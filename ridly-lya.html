<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Lya — RIDLY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --red:#cc0000;
      --red2:#e51010;
      --bg:#080808;
      --panel:#101010;
      --panel2:#0b0b0b;
      --text:#f2f2f2;
      --muted:#858585;
      --border:rgba(255,255,255,.10);
      --border2:rgba(255,255,255,.16);
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100svh;
      color:var(--text);
      font-family:"Barlow Condensed",Arial,sans-serif;
      background:
        radial-gradient(700px 500px at 20% 8%,rgba(204,0,0,.18),transparent 62%),
        radial-gradient(700px 500px at 90% 90%,rgba(204,0,0,.08),transparent 65%),
        var(--bg);
    }

    button,input{font:inherit}
    a{color:inherit}

    header{
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 clamp(16px,4vw,52px);
      border-bottom:1px solid var(--border);
      background:rgba(8,8,8,.86);
      backdrop-filter:blur(16px);
      position:sticky;
      top:0;
      z-index:30;
    }

    .brand{display:flex;align-items:center;text-decoration:none}
    .brand img{
      width:112px;
      height:54px;
      object-fit:contain;
      mix-blend-mode:screen;
    }

    .back{
      text-decoration:none;
      color:#858585;
      text-transform:uppercase;
      letter-spacing:.1em;
      font-weight:800;
      font-size:12px;
      transition:.2s;
    }
    .back:hover{color:#fff}

    main{
      width:min(1180px,calc(100% - 28px));
      min-height:calc(100svh - 72px);
      margin:auto;
      padding:36px 0 48px;
      display:grid;
      grid-template-columns:.82fr 1.18fr;
      gap:26px;
      align-items:stretch;
    }

    .ridy-side,.chat-card{
      border:1px solid var(--border);
      border-radius:22px;
      background:linear-gradient(145deg,rgba(17,17,17,.97),rgba(5,5,5,.98));
      box-shadow:0 32px 90px rgba(0,0,0,.38);
      overflow:hidden;
      position:relative;
    }

    .ridy-side::before{
      content:"";
      position:absolute;
      width:300px;height:300px;
      left:-130px;top:-120px;
      border-radius:50%;
      background:rgba(204,0,0,.16);
      filter:blur(65px);
      pointer-events:none;
    }

    .ridy-side{
      min-height:660px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:28px 28px 0;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      width:max-content;
      padding:7px 11px;
      border:1px solid var(--border);
      border-radius:999px;
      color:#a0a0a0;
      font-size:11px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      background:rgba(255,255,255,.025);
    }
    .eyebrow::before{
      content:"";
      width:7px;height:7px;border-radius:50%;
      background:var(--red2);
      box-shadow:0 0 13px var(--red2);
    }

    h1{
      margin:19px 0 8px;
      font-family:"Bebas Neue",sans-serif;
      font-size:clamp(58px,6vw,88px);
      line-height:.86;
      font-weight:400;
      letter-spacing:.02em;
    }
    h1 span{color:var(--red2)}

    .lead{
      margin:0;
      max-width:370px;
      color:#8f8f8f;
      font-size:20px;
      line-height:1.16;
    }
    .lead strong{color:#fff}

    .ridy-art{
      position:relative;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      height:430px;
      margin-top:18px;
      overflow:visible;
    }
    .ridy-art::before{
      content:"";
      position:absolute;
      bottom:20px;
      width:280px;height:210px;
      border-radius:50%;
      background:rgba(204,0,0,.16);
      filter:blur(70px);
    }
    .ridy-art img{
      position:relative;
      z-index:2;
      display:block;
      height:430px;
      width:auto;
      max-width:100%;
      object-fit:contain;
      object-position:bottom center;
      filter:
        brightness(1.08)
        contrast(1.05)
        drop-shadow(0 0 24px rgba(204,0,0,.28))
        drop-shadow(0 18px 38px rgba(0,0,0,.75));
      animation:ridyFloat 4.6s ease-in-out infinite;
      transform-origin:bottom center;
    }
    .ridy-art.thinking img{animation:ridyThink .65s ease-in-out infinite alternate}

    @keyframes ridyFloat{
      0%,100%{transform:translateY(0) rotate(0deg)}
      50%{transform:translateY(-7px) rotate(.35deg)}
    }
    @keyframes ridyThink{
      from{transform:translateY(-2px) scale(1)}
      to{transform:translateY(-7px) scale(1.008)}
    }

    .status-pill{
      position:absolute;
      z-index:3;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:7px;
      padding:7px 12px;
      border:1px solid var(--border2);
      border-radius:999px;
      background:rgba(0,0,0,.74);
      backdrop-filter:blur(10px);
      color:#d5d5d5;
      white-space:nowrap;
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.09em;
    }
    .status-pill i{width:7px;height:7px;border-radius:50%;background:#38d46a;box-shadow:0 0 10px #38d46a}

    .chat-card{
      min-height:660px;
      display:flex;
      flex-direction:column;
    }

    .chat-head{
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      padding:18px 20px;
      border-bottom:1px solid var(--border);
    }
    .chat-title{display:flex;align-items:center;gap:12px}
    .mini-avatar{
      width:44px;height:44px;border-radius:14px;
      overflow:hidden;border:1px solid rgba(204,0,0,.45);
      background:#050505;
      flex:0 0 auto;
    }
    .mini-avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
    .chat-title strong{display:block;font-size:18px;line-height:1}
    .chat-title span{display:block;color:#747474;font-size:12px;margin-top:4px}
    .clear-btn{
      border:1px solid var(--border);
      background:#0b0b0b;color:#777;
      border-radius:8px;padding:8px 10px;
      font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
      cursor:pointer;
    }
    .clear-btn:hover{color:#fff;border-color:rgba(204,0,0,.5)}

    .messages{
      flex:1;
      min-height:360px;
      padding:22px 20px 12px;
      overflow:auto;
      scroll-behavior:smooth;
    }

    .msg{display:flex;margin:0 0 13px}
    .msg.user{justify-content:flex-end}
    .bubble{
      max-width:min(78%,560px);
      padding:11px 14px;
      border-radius:14px;
      font-size:16px;
      line-height:1.25;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .msg.ridy .bubble{
      color:#ddd;
      background:#111;
      border:1px solid var(--border);
      border-bottom-left-radius:4px;
    }
    .msg.user .bubble{
      color:#fff;
      background:var(--red);
      border:1px solid var(--red2);
      border-bottom-right-radius:4px;
    }

    .thinking-bubble{display:inline-flex;align-items:center;gap:5px;min-width:58px}
    .thinking-bubble span{
      width:6px;height:6px;border-radius:50%;background:#aaa;
      animation:dot 1s ease-in-out infinite;
    }
    .thinking-bubble span:nth-child(2){animation-delay:.15s}
    .thinking-bubble span:nth-child(3){animation-delay:.3s}
    @keyframes dot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

    .quick-wrap{padding:0 20px 14px}
    .quick-label{font-size:11px;color:#676767;text-transform:uppercase;font-weight:800;letter-spacing:.12em;margin-bottom:8px}
    .quick-actions{display:flex;gap:7px;flex-wrap:wrap}
    .quick{
      border:1px solid var(--border2);
      background:#0c0c0c;color:#c8c8c8;
      border-radius:999px;padding:8px 11px;
      cursor:pointer;font-size:13px;font-weight:700;
      transition:.16s;
    }
    .quick:hover{border-color:rgba(204,0,0,.65);color:#fff;transform:translateY(-1px)}

    .composer{
      display:flex;
      gap:9px;
      padding:15px;
      border-top:1px solid var(--border);
      background:rgba(5,5,5,.88);
    }
    .composer input{
      flex:1;min-width:0;height:49px;
      padding:0 15px;
      border:1px solid var(--border2);
      border-radius:10px;
      outline:none;
      color:#fff;background:#090909;
      font-size:16px;
    }
    .composer input:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(204,0,0,.13)}
    .composer input::placeholder{color:#4f4f4f}
    .send{
      min-width:92px;
      border:1px solid var(--red);
      border-radius:10px;
      background:var(--red);
      color:#fff;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.06em;
      cursor:pointer;
      transition:.18s;
    }
    .send:hover{background:var(--red2);transform:translateY(-1px)}
    .send:disabled{opacity:.5;cursor:default;transform:none}

    .note{
      padding:0 20px 15px;
      color:#555;
      font-size:11px;
      text-align:center;
    }



    .answer-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08)}
    .source-link,.topic-btn{
      display:inline-flex;align-items:center;gap:6px;text-decoration:none;
      border:1px solid var(--border2);border-radius:999px;padding:6px 9px;
      background:#090909;color:#c9c9c9;font-size:11px;font-weight:800;
      letter-spacing:.04em;cursor:pointer;
    }
    .source-link:hover,.topic-btn:hover{color:#fff;border-color:rgba(204,0,0,.7)}
    .dynamic-tag{display:inline-flex;align-items:center;border:1px solid rgba(245,158,11,.28);border-radius:999px;padding:6px 9px;color:#e6aa48;font-size:11px;font-weight:800;background:rgba(245,158,11,.06)}
    .suggestions{display:flex;flex-direction:column;gap:7px;margin-top:9px}
    .topic-btn{text-align:left;border-radius:10px;padding:9px 10px;width:100%}
    .kb-count{color:#555;font-size:10px;margin-top:4px;text-transform:uppercase;letter-spacing:.1em}

    .lang-switch{
      display:flex;
      align-items:center;
      gap:5px;
      padding:4px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#0a0a0a;
    }
    .lang-btn{
      min-width:34px;
      height:30px;
      padding:0 8px;
      border:0;
      border-radius:7px;
      background:transparent;
      color:#777;
      font-size:11px;
      font-weight:900;
      letter-spacing:.06em;
      cursor:pointer;
      transition:.16s;
    }
    .lang-btn:hover{color:#fff;background:#151515}
    .lang-btn.active{color:#fff;background:var(--red)}
    .head-actions{display:flex;align-items:center;gap:12px}


    @keyframes ridyAlive{
      0%,100%{transform:translateY(0) rotate(-.4deg) scale(1)}
      25%{transform:translateY(-2px) rotate(.3deg) scale(1.008)}
      50%{transform:translateY(-5px) rotate(.8deg) scale(1.014)}
      75%{transform:translateY(-2px) rotate(.1deg) scale(1.007)}
    }

    @keyframes ridyGroundPulse{
      0%,100%{transform:scaleX(.92);opacity:.35}
      50%{transform:scaleX(1.08);opacity:.62}
    }

    .ridy-art.thinking img,
    .thinking .ridy-art img{
      animation:ridyThinking .8s ease-in-out infinite alternate;
    }

    @keyframes ridyThinking{
      from{transform:translateY(0) rotate(-1deg) scale(1)}
      to{transform:translateY(-4px) rotate(1deg) scale(1.025)}
    }

    @media(max-width:820px){
      html,body{
        width:100%;
        height:100%;
        min-height:100%;
        overflow:hidden;
      }

      body{
        min-height:100dvh;
        background:
          radial-gradient(420px 260px at 15% 0%,rgba(204,0,0,.18),transparent 66%),
          var(--bg);
      }

      header{
        height:58px;
        min-height:58px;
        padding:
          max(6px,env(safe-area-inset-top))
          10px
          6px;
        gap:8px;
        position:relative;
      }

      .brand{
        flex:0 0 auto;
      }

      .brand img{
        width:78px;
        height:40px;
      }

      .head-actions{
        min-width:0;
        flex:1;
        justify-content:flex-end;
        gap:6px;
      }

      .lang-switch{
        gap:2px;
        padding:3px;
        border-radius:9px;
        flex:0 1 auto;
      }

      .lang-btn{
        min-width:28px;
        width:28px;
        height:28px;
        padding:0;
        font-size:10px;
        border-radius:6px;
      }

      .back{
        width:32px;
        height:32px;
        flex:0 0 32px;
        display:grid;
        place-items:center;
        border:1px solid var(--border);
        border-radius:8px;
        background:#0a0a0a;
        color:#aaa;
        font-size:0;
      }

      .back::before{
        content:"←";
        font-size:17px;
        line-height:1;
      }

      main{
        width:100%;
        height:calc(100dvh - 58px);
        min-height:0;
        margin:0;
        padding:8px 8px max(8px,env(safe-area-inset-bottom));
        display:flex;
        flex-direction:column;
        gap:8px;
        overflow:hidden;
      }

      .ridy-side,
      .chat-card{
        border-radius:16px;
      }

      /* Compact assistant banner: everything remains visible without eating the screen */
      .ridy-side{
        flex:0 0 178px;
        min-height:178px;
        height:178px;
        margin:0;
        padding:14px 172px 12px 14px;
        overflow:hidden;
        display:block;
        isolation:isolate;
      }

      .ridy-side::before{
        width:190px;
        height:190px;
        left:auto;
        right:-70px;
        top:-70px;
        filter:blur(44px);
      }

      .eyebrow{
        padding:5px 8px;
        gap:5px;
        font-size:9px;
        letter-spacing:.11em;
      }

      .eyebrow::before{
        width:5px;
        height:5px;
      }

      .ridy-side h1{
        margin:8px 0 4px;
        font-size:35px;
        line-height:.84;
        max-width:175px;
      }

      .lead{
        max-width:205px;
        margin:0;
        font-size:12.5px;
        line-height:1.08;
        display:-webkit-box;
        -webkit-line-clamp:3;
        -webkit-box-orient:vertical;
        overflow:hidden;
      }

      .ridy-art{
        position:absolute;
        right:-12px;
        bottom:-3px;
        width:190px;
        height:182px;
        margin:0;
        overflow:visible;
        align-items:flex-end;
        z-index:4;
        pointer-events:none;
      }

      .ridy-art::after{
        content:"";
        position:absolute;
        right:10px;
        bottom:8px;
        width:132px;
        height:26px;
        border-radius:50%;
        background:rgba(204,0,0,.22);
        filter:blur(17px);
        z-index:0;
        animation:ridyGroundPulse 2.6s ease-in-out infinite;
      }

      .ridy-art::before{
        width:135px;
        height:105px;
        bottom:0;
        filter:blur(36px);
      }

      .ridy-art img{
        position:relative;
        z-index:2;
        height:188px;
        width:auto;
        max-width:184px;
        object-fit:contain;
        object-position:bottom center;
        filter:
          brightness(1.12)
          contrast(1.06)
          saturate(1.06)
          drop-shadow(0 0 10px rgba(204,0,0,.16))
          drop-shadow(0 12px 18px rgba(0,0,0,.62));
        animation:ridyAlive 3.4s ease-in-out infinite;
        transform-origin:50% 100%;
        will-change:transform;
      }

      .status-pill{
        left:auto;
        right:8px;
        bottom:7px;
        transform:none;
        padding:5px 8px;
        gap:5px;
        font-size:8px;
        letter-spacing:.06em;
        max-width:138px;
        overflow:hidden;
        text-overflow:ellipsis;
        z-index:7;
        background:rgba(8,8,8,.88);
        backdrop-filter:blur(8px);
        box-shadow:0 5px 16px rgba(0,0,0,.42);
      }

      .status-pill i{
        width:5px;
        height:5px;
        flex:0 0 5px;
      }

      /* Chat takes every remaining pixel */
      .chat-card{
        flex:1 1 auto;
        min-height:0;
        height:auto;
        overflow:hidden;
        display:flex;
        flex-direction:column;
      }

      .chat-head{
        flex:0 0 58px;
        min-height:58px;
        height:58px;
        padding:8px 10px;
        gap:8px;
      }

      .chat-title{
        gap:8px;
        min-width:0;
      }

      .mini-avatar{
        width:42px;
        height:42px;
        border-radius:12px;
        box-shadow:0 0 0 1px rgba(204,0,0,.45),0 0 18px rgba(204,0,0,.16);
        overflow:hidden;
      }

      .mini-avatar img{
        transform:scale(1.22);
        transform-origin:50% 28%;
      }

      .chat-title strong{
        font-size:16px;
      }

      .chat-title span{
        max-width:150px;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        font-size:10px;
        margin-top:2px;
      }

      .clear-btn{
        padding:6px 8px;
        font-size:9px;
        border-radius:7px;
      }

      .messages{
        flex:1 1 auto;
        min-height:0;
        height:auto;
        padding:10px 10px 4px;
        overflow-y:auto;
        overscroll-behavior:contain;
        -webkit-overflow-scrolling:touch;
      }

      .msg{
        margin-bottom:8px;
      }

      .bubble{
        max-width:88%;
        padding:8px 10px;
        border-radius:11px;
        font-size:14px;
        line-height:1.18;
      }

      .answer-meta{
        gap:5px;
        margin-top:7px;
        padding-top:7px;
      }

      .source-link,
      .topic-btn,
      .dynamic-tag{
        padding:5px 7px;
        font-size:9px;
      }

      .suggestions{
        gap:5px;
        margin-top:6px;
      }

      /* Quick questions stay on one compact horizontal row */
      .quick-wrap{
        flex:0 0 auto;
        padding:5px 9px 6px;
        border-top:1px solid rgba(255,255,255,.05);
      }

      .quick-label{
        display:none;
      }

      .quick-actions{
        display:flex;
        flex-wrap:nowrap;
        gap:5px;
        overflow-x:auto;
        scrollbar-width:none;
        -webkit-overflow-scrolling:touch;
        padding-bottom:1px;
      }

      .quick-actions::-webkit-scrollbar{
        display:none;
      }

      .quick{
        flex:0 0 auto;
        padding:6px 9px;
        font-size:11px;
        white-space:nowrap;
      }

      .composer{
        flex:0 0 54px;
        min-height:54px;
        padding:6px 8px;
        gap:6px;
        background:#070707;
      }

      .composer input{
        height:42px;
        padding:0 11px;
        border-radius:9px;
        font-size:15px;
      }

      .send{
        min-width:68px;
        height:42px;
        padding:0 10px;
        border-radius:9px;
        font-size:11px;
      }

      .note{display:none;}
    }

    @media(max-width:380px){
      .brand img{
        width:68px;
      }

      .lang-btn{
        min-width:25px;
        width:25px;
        height:27px;
        font-size:9px;
      }

      .back{
        width:29px;
        height:29px;
        flex-basis:29px;
      }

      .ridy-side{
        flex-basis:166px;
        min-height:166px;
        height:166px;
        padding-right:154px;
      }

      .ridy-side h1{
        font-size:33px;
      }

      .lead{
        font-size:12px;
        max-width:190px;
      }

      .ridy-art{
        width:168px;
        height:168px;
        right:-13px;
      }

      .ridy-art img{
        height:174px;
        max-width:164px;
      }

      .status-pill{
        max-width:112px;
        font-size:7px;
      }

      .mini-avatar{
        width:34px;
        height:34px;
      }

      .chat-title span{
        max-width:112px;
      }

      .bubble{
        max-width:92%;
        font-size:13px;
      }

      .send{
        min-width:58px;
        padding:0 7px;
        font-size:10px;
      }
    }

    /* Short phones: preserve the chat and shrink only the intro */
    @media(max-width:820px) and (max-height:700px){
      .ridy-side{
        flex-basis:132px;
        min-height:132px;
        height:132px;
        padding-top:10px;
        padding-right:132px;
      }

      .eyebrow{
        display:none;
      }

      .ridy-side h1{
        margin:2px 0 3px;
        font-size:31px;
      }

      .lead{
        font-size:11px;
        -webkit-line-clamp:2;
      }

    if(id.includes('event') || id.includes('contest') || id.includes('championship')) return 'events';
    if(id.startsWith('ridly-')) return 'ridly';
    if(id.startsWith('jf-')) return 'shop';
    if(cat.includes('trottinette') || cat.includes('scooter')) return 'scooter';
    if(cat.includes('rsl')) return 'rsl';
    return cat || null;
  }

  function rememberEntry(entry,userText='',intent=null){
    rememberContext({
      topic:topicFromEntry(entry),
      entryId:entry?.id||null,
      intent:intent||null,
      lastUser:userText||conversationContext.lastUser
    });
  }

  function cityFromText(text){
    const s=normalize(text);
    if(/\bmontreux\b/.test(s)) return 'montreux';
    if(/\b(vidy|lausanne)\b/.test(s)) return 'vidy';
    if(/\byverdon\b/.test(s)) return 'yverdon';
    if(/\bmartigny\b/.test(s)) return 'martigny';
    return null;
  }

  function editDistance(a,b){
    a=String(a||''); b=String(b||'');
    if(a===b) return 0;
    if(!a.length) return b.length;
    if(!b.length) return a.length;
    const prev=Array.from({length:b.length+1},(_,i)=>i);
    for(let i=1;i<=a.length;i++){
      let left=i, diag=i-1;
      prev[0]=i;
      for(let j=1;j<=b.length;j++){
        const up=prev[j];
        const cost=a[i-1]===b[j-1]?0:1;
        const val=Math.min(up+1,left+1,diag+cost);
        diag=up; prev[j]=val; left=val;
      }
    }
    return prev[b.length];
  }

  function fuzzyTokenMatch(token,textTokens){
    if(token.length<4) return false;
    return textTokens.some(t=>{
      if(Math.abs(t.length-token.length)>2) return false;
      const maxDist=token.length>=8?2:1;
      return editDistance(token,t)<=maxDist;
    });
  }

  function allSearchText(e){
    return normalize([
      ...(Object.values(e.questions||{})), ...(e.keywords||[]), e.category, e.id
    ].join(' '));
  }

  function scoreEntry(query,e){
    const nq=normalize(query), qt=tokens(query), text=allSearchText(e);
    if(!nq) return 0;
    let score=0;

    const qfrExact=normalize((e.questions&&e.questions.fr)||'')
      .replace(/^qui est /,'')
      .replace(/\s*\?\s*$/,'');
    const possiblePerson=normalize(cleanPossiblePersonName(query));
    if(qfrExact && possiblePerson===qfrExact) score += 40;

    if(e.category==='Riders'){
      const rn=normalize(riderDisplayName(e));
      const possible=normalize(cleanPossiblePersonName(query));

      if(rn && possible===rn){
        score += 30;
      } else if(rn && isLikelyPersonName(query)){
        // Full-name typo tolerance, but never "same first name = same rider".
        const d=riderFullNameDistance(rn,possible);
        if(d<=2) score += 14;
        else score -= 18;
      }
    }
    if(text.includes(nq)) score+=18;
    for(const k of (e.keywords||[])){
      const nk=normalize(k); if(nk && nq.includes(nk)) score+=8; else if(nk && text.includes(nk) && qt.some(t=>nk.includes(t))) score+=2;
    }
    const textTokens=tokens(text);
    for(const t of qt){
      if(text.includes(t)) score += t.length>=6 ? 4.5 : 3;
      else if(fuzzyTokenMatch(t,textTokens)) score += t.length>=7 ? 2.6 : 1.7;
      const title=normalize((e.questions||{})[language]||'');
      if(title.includes(t)) score+=2;
      else if(fuzzyTokenMatch(t,tokens(title))) score+=1.1;
    }
    const cat=normalize(e.category);
    if(nq.includes(cat)) score+=8;
    return score;
  }

  function rank(query){
    return knowledge.map(e=>({e,score:scoreEntry(query,e)})).sort((a,b)=>b.score-a.score);
  }

  }

  function smartIntent(text){
    const s=normalize(text);
    const city=cityFromText(text);

    const intent={
      city,
      register:/\b(inscri|inscription|inscriptions|inscrire|m inscrire|m inscriptions|register|registration|sign up|anmeld|anmeldung|iscriv|iscrizione|reserver|reservation|reserve|booking)\b/.test(s),
      participate:/\b(particip|participer|venir|rejoindre|join|take part|mitmachen|teilnehmen|partecipa|partecipare|je veux venir|je veux participer)\b/.test(s),
      price:/\b(combien|prix|tarif|coute|cout|chf|price|cost|kosten|preis|quanto|prezzo|costa)\b/.test(s),
      where:/\b(ou|lieu|ville|adresse|where|wo|ort|dove|posto)\b/.test(s),
      when:/\b(quand|horaire|heure|jour|date|samedi|when|time|schedule|wann|uhr|quando|orario)\b/.test(s),
      course:/\b(cours|course|courses|kurs|kurse|corso|corsi|stage|session|seance|coach)\b/.test(s),
      event:/\b(event|evenement|competition|contest|jam|finale|championnat|evento|evento|wettkampf)\b/.test(s),
      ridly:/\b(ridly|compte|account|profil|profile)\b/.test(s),
      whatsapp:/\b(whatsapp|whats app|groupe|group|gruppe|gruppo)\b/.test(s)
    };

    return intent;
  }

  function answerSmartContext(text){
    const i=smartIntent(text);
    const t=SMART_COPY[language]||SMART_COPY.en;
    const ctx=conversationContext||{};
    const city=i.city || ctx.city || null;
    const cityLabel=city && COURSE_WHATSAPP?.[city]?.label;

    const courseContext = i.course || ctx.topic==='courses';
    const eventContext = i.event || ctx.topic==='events';

    // Explicit RIDLY/account registration should continue to normal knowledge search.
    if(i.register && i.ridly && !i.course) return false;

    // "Je veux participer" after a course answer => understand the follow-up.
    if(i.participate && courseContext){
      return smartReply(
        text,
        t.courseParticip(cityLabel||null),
        courseActions(city),
        {topic:'courses',city,intent:'participate'}
      );
    }

    // "Je m'inscris où ?" after course context.
    if(i.register && courseContext){
      return smartReply(
        text,
        t.courseRegister,
        courseActions(city),
        {topic:'courses',city,intent:'register'}
      );
    }

    // Course price follow-up: "et combien ?"
    if(i.price && courseContext){
      const entry=knowledge.find(e=>e.id==='rsl-course-price');
      if(entry){
        addUser(text);
        rememberEntry(entry,text,'price');
        setBusy(true);

          bubble.appendChild(wrap);
          setBusy(false); input.value=''; input.focus();
        },180);
        return true;
      }
    }

    // "où ?", "dans quelle ville ?", or a city after course context.
    if((i.where || i.city) && courseContext && !i.whatsapp){
      if(i.city && cityLabel){
        return smartReply(
          text,
          t.courseCity(cityLabel),
          courseActions(city),
          {topic:'courses',city,intent:'location'}
        );
      }
      return smartReply(
        text,
        t.courseWhere,
        courseActions(null),
        {topic:'courses',intent:'location'}
      );
    }

    // "quand ?" after course context.
    if(i.when && courseContext){
      return smartReply(
        text,
        t.courseWhen,
        courseActions(city),
        {topic:'courses',city,intent:'schedule'}
      );
    }

    // Participation after event context.
    if(i.participate && eventContext){
      return smartReply(
        text,
        t.eventParticip,
        [{label:t.eventBtn,href:'https://rsl-swiss.ch/'}],
        {topic:'events',intent:'participate'}
      );
    }

    // Registration without context: don't guess, offer choices.
    if(i.register && !i.course && !i.event && !i.ridly && !ctx.topic){
      return smartReply(
        text,
        t.ambiguousRegister,
        [
          {label:t.courseChoice,action:()=>smartReply('',t.courseRegister,courseActions(null),{topic:'courses',intent:'register'})},
          {label:t.eventChoice,href:'https://rsl-swiss.ch/'}
        ],
        {intent:'clarify-register'}
      );
    }

    // "Je veux participer" with no useful context => ask a useful clarification.
    if(i.participate && !courseContext && !eventContext){
      return smartReply(
        text,
        t.ambiguousParticip,
        [
          {label:t.courseChoice,action:()=>smartReply('',t.courseRegister,courseActions(null),{topic:'courses',intent:'register'})},
          {label:t.eventChoice,href:'https://rsl-swiss.ch/'}

    }

    return false;
  }

  function scootCopy(){
    return SCOOT_COPY[language] || SCOOT_COPY.en;
  }

  function cleanPlayerName(name){
    name = String(name||'')
      .replace(/[.,!?;:()[\]{}"'’`]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

    // remove common command words that can stick to names
    name = name.replace(/^(pour|for|fur|für|a|à|de|da|di)\s+/i,'').trim();

    if(!name) return '';
    return name
      .split(' ')
      .map(p=>p ? p.charAt(0).toUpperCase()+p.slice(1).toLowerCase() : '')
      .join(' ');
  }

  function scootScore(player){
    const count = Math.max(0, Math.min(SCOOT_WORD.length, player.letters||0));
    return count ? SCOOT_WORD.slice(0,count).join('') : scootCopy().zero;
  }

  function scootFindPlayer(name){
    const target = normalize(name);
    if(!target) return null;

    // exact normalized match first
    let found = scootGame.players.find(p=>normalize(p.name)===target);
    if(found) return found;

    // loose first-name match / typo tolerance
    found = scootGame.players.find(p=>{
      const pn = normalize(p.name);
      if(pn.startsWith(target) || target.startsWith(pn)) return true;
      return editDistance(pn,target) <= (Math.max(pn.length,target.length)>=7 ? 2 : 1);
    });
    return found || null;
  }

  function scootExtractNamesFromStart(text){
    let s = String(text||'').trim();

    // Strip game-of-scoot wording in all likely spellings, including user's "scout".
    s = s.replace(/\b(game\s*(of|off|de)?\s*(scoot|scout)|game\s+scoot|game\s+scout|scoot\s+game|scout\s+game)\b/ig,' ');
    s = s.replace(/\b(lance|lancer|commence|commencer|demarre|démarre|start|starte|inizia|iniziare|avec|with|mit|con|entre|vs|versus)\b/ig,' ');

    // Split on commas, slashes, +, &, "et", "and", "und", "e".
    let raw = s
      .replace(/\s+(et|and|und|e)\s+/ig, ',')
      .replace(/[\/+&]/g, ',')
      .split(',')
      .map(cleanPlayerName)
      .filter(Boolean);

    // If no separators, accept remaining words as individual first names.
    if(raw.length < 2){
      const words = s
        .replace(/[^\p{L}\p{M}'’-]+/gu,' ')
        .trim()
        .split(/\s+/)
        .map(cleanPlayerName)
        .filter(Boolean)
        .filter(x=>!['Game','Scoot','Scout'].includes(x));
      if(words.length >= 2) raw = words;
    }

    // Remove duplicates
    const seen = new Set();
    return raw.filter(n=>{
      const k=normalize(n);
      if(!k || seen.has(k)) return false;
      seen.add(k); return true;
    }).slice(0,8);
  }

  function scootRenderScore(prefix=''){
    const t=scootCopy();
    const lines=scootGame.players.map(p=>{
      const dead=(p.letters||0)>=SCOOT_WORD.length;
      return `${dead?'❌':'•'} ${p.name} : ${scootScore(p)}`;
    });
    return `${prefix ? prefix+'\n\n' : ''}${t.scoreTitle}\n${lines.join('\n')}`;
  }

  function scootAlivePlayers(){
    return scootGame.players.filter(p=>(p.letters||0)<SCOOT_WORD.length);
  }

  function scootReply(text,userText=''){
    if(userText) addUser(userText);
    input.value='';
    setBusy(true);

  function scootStart(names,userText){
    const t=scootCopy();
    if(names.length<2) return scootReply(t.needPlayers,userText);

    scootGame={
      active:true,
      players:names.map(name=>({name,letters:0})),
      lastAction:null,
      waitingPlayers:false
    };

    return scootReply(
      `${t.started(names)}\n\n${scootRenderScore()}`,
      userText
    );
  }

  function scootAddLetter(player,userText){
    const t=scootCopy();
    if(!player) return scootReply(t.noGame,userText);
    if(player.letters>=SCOOT_WORD.length){
      return scootReply(`${player.name} a déjà SCOOT 😅\n\n${scootRenderScore()}`,userText);
    }

    const previous=player.letters;
    player.letters++;
    scootGame.lastAction={type:'letter',player:player.name,previous};

    const newLetter=SCOOT_WORD[player.letters-1];
    let msg=t.letter(player.name,newLetter,scootScore(player));

    if(player.letters>=SCOOT_WORD.length){
      msg += `\n${t.eliminated(player.name)}`;
      const alive=scootAlivePlayers();
      if(alive.length===1 && scootGame.players.length>1){
        msg += `\n\n${t.winner(alive[0].name)}`;
      }
    }

    return scootReply(`${msg}\n\n${scootRenderScore()}`,userText);
  }

  function scootRemoveLetter(player,userText){
    const t=scootCopy();
    if(!player) return scootReply(t.noGame,userText);
    if(player.letters<=0) return scootReply(t.nothing(player.name),userText);

    player.letters--;
    scootGame.lastAction={type:'remove',player:player.name};
    return scootReply(`${t.removed(player.name,scootScore(player))}\n\n${scootRenderScore()}`,userText);
  }

  function scootUndo(userText){
    const t=scootCopy();
    const a=scootGame.lastAction;
    if(!a) return scootReply("Je n’ai rien à annuler pour le moment 😄",userText);

    const p=scootFindPlayer(a.player);
    if(!p) return scootReply("Je n’ai pas retrouvé le dernier joueur 😅",userText);

    if(a.type==='letter'){
      p.letters=Math.max(0,a.previous);
      scootGame.lastAction=null;
      return scootReply(`${t.removed(p.name,scootScore(p))}\n\n${scootRenderScore()}`,userText);
    }
    scootGame.lastAction=null;
    return scootReply(scootRenderScore("Annulation faite ↩️"),userText);
  }


  function scootExtractPlainNames(text){
    let s=String(text||'').trim();

    // Common separators between first names
    s=s
      .replace(/\s+(et|and|und|e|vs|versus)\s+/ig, ',')
      .replace(/[\/+&;]/g, ',');

    let names=[];

    if(s.includes(',')){
      names=s.split(',')
        .map(cleanPlayerName)
        .filter(Boolean);
    }else{
      // In waiting mode "Lucas Joel Bastien" means three players.
      names=s
        .replace(/[^\p{L}\p{M}'’-]+/gu,' ')
        .trim()
        .split(/\s+/)
        .map(cleanPlayerName)
        .filter(Boolean);
    }

    const forbidden=new Set([
      'Game','Scoot','Scout','Of','Off','De','The',
      'Oui','Non','Ok','Okay','Merci','Salut','Bonjour'
    ]);

    const seen=new Set();
    return names.filter(n=>{
      const k=normalize(n);
      if(!k || forbidden.has(n) || seen.has(k)) return false;
      seen.add(k);
      return true;
    }).slice(0,8);
  }


  function scootLooksLikeLetterCommand(text){
    const s=normalize(text);
    const ts=tokens(s);

    // Exact + common typos in FR/EN/DE/IT.
    const known=[
      'lettre','letre','lettres','letr','letter','letters',
      'buchstabe','buchstaben','lettera','lettere'
    ];
    if(ts.some(t=>known.includes(t))) return true;

    // Fuzzy typo tolerance: "lettre" / "letter" up to 1 edit,
    // longer translations up to 2 edits.
    return ts.some(t=>{
      if(editDistance(t,'lettre')<=1) return true;
      if(editDistance(t,'letter')<=1) return true;
      if(t.length>=7 && editDistance(t,'buchstabe')<=2) return true;
      if(t.length>=6 && editDistance(t,'lettera')<=2) return true;
      return false;
    });
  }

  function scootPlayerMentioned(text){
    const s=normalize(text);

    // Prefer actual players already registered in the current game.
    for(const p of scootGame.players){
      const pn=normalize(p.name);
      if(
        s===pn ||
        s.includes(` ${pn} `) ||
        s.startsWith(pn+' ') ||
        s.endsWith(' '+pn) ||
        s.includes(pn)
      ){
        return p;
      }
    }

    return null;
  }

  function answerScootGame(text){
    const raw=String(text||'').trim();
    const s=normalize(raw);
    const t=scootCopy();

    // Lya asked for names on the previous turn:
    // the next message is treated as the player list.
    if(scootGame.waitingPlayers){
      if(/^(annule|annuler|cancel|stop|laisse tomber|vergiss|abbrechen|annulla)[!. ]*$/.test(s)){
        scootGame.waitingPlayers=false;
        return scootReply("OK 😄 Game annulé.",raw);
      }

      const pendingNames=scootExtractPlainNames(raw);
      if(pendingNames.length>=2){
        return scootStart(pendingNames,raw);
      }

      if(names.length>=2) return scootStart(names,raw);

        scootGame={active:false,players:[],lastAction:null,waitingPlayers:false};
        return scootReply(t.reset,raw);
      }
      scootGame.waitingPlayers=true;
      return scootReply(t.needPlayers,raw);
    }

    if(
      scootGame.active &&
      /\b(reset|recommence|recommencer|efface|effacer|annule la partie|clear game|reset game|spiel loschen|partita nuova)\b/.test(s)
    ){
      scootGame={active:false,players:[],lastAction:null,waitingPlayers:false};
      return scootReply(t.cleared,raw);
    }

    // Help.
    if(
      /\b(aide|help|hilfe|aiuto)\b/.test(s) &&
      /\b(scoot|scout|game)\b/.test(s)
    ){
      return scootReply(t.help,raw);
    }

    if(!scootGame.active){
      if(mentionsGame){
        scootGame.waitingPlayers=true;
        return scootReply(t.needPlayers,raw);
      }
      return false;
    }

    // "letre joel", "lettre Joel", "Joel lettre", "met une lettre Joel", etc.
    const mentionedPlayer=scootPlayerMentioned(raw);

      const removing=/\b(retire|retirer|enleve|enlève|enlever|remove|take off|entferne|togli)\b/.test(s);
      if(!removing){
        return scootAddLetter(mentionedPlayer,raw);
      }
    }

    // Also accept very short miss commands with typo tolerance.
    if(mentionedPlayer){
      const missWords=['rate','raté','ratee','ratée','miss','missed','loupe','loupé','foire','foiré'];
      const ts=tokens(s);
      const looksMiss=ts.some(t=>
        missWords.includes(t) ||
        editDistance(t,'rate')<=1 ||
        editDistance(t,'miss')<=1
      );
      if(looksMiss){
        return scootAddLetter(mentionedPlayer,raw);
      }
    }

    // Score request.
    if(/^(score|scores|classement|resultat|resultats|résultat|résultats|stand|standings|punktestand|punteggio)[?.! ]*$/.test(s)
       || /\b(score du game|score scoot|score scout|qui gagne|who is winning|wer fuhrt|chi sta vincendo)\b/.test(s)){
      return scootReply(scootRenderScore(),raw);
    }

    // Undo last action.
    if(/\b(annule|annuler|undo|zuruck|rückgängig|annulla)\b/.test(s) && /\b(lettre|letter|buchstabe|lettera|dernier|last|letzte|ultima)\b/.test(s)){
      return scootUndo(raw);
    }

    // Add a player during the game: "ajoute Noah"
    let m=raw.match(/\b(?:ajoute|ajouter|add|füge|fuge|aggiungi)\s+([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)/i);
    if(m){
      const name=cleanPlayerName(m[1]);
      if(scootFindPlayer(name)) return scootReply(t.already(name),raw);
      scootGame.players.push({name,letters:0});
      return scootReply(`${t.added(name)}\n\n${scootRenderScore()}`,raw);
    }

    // Remove one letter: "retire une lettre à Bastien"
    m=raw.match(/\b(?:retire|enleve|enlève|remove|take off|entferne|togli)\b.*?\b(?:lettre|letter|buchstabe|lettera)\b.*?\b(?:a|à|from|von|da)?\s*([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)\b/i);
    if(m){
      const p=scootFindPlayer(m[1]);
      if(!p) return scootReply(t.unknown(cleanPlayerName(m[1])),raw);
      return scootRemoveLetter(p,raw);
    }

    // "Lucas a réussi / landed it" => no letter, but acknowledge.
    for(const p of scootGame.players){
      const pn=normalize(p.name);
      if(s.includes(pn) && /\b(reussi|réussi|replaque|replaqué|landed|lands|land|gelandet|chiuso|atterrato)\b/.test(s)){
        return scootReply(`${t.success(p.name)}\n\n${scootRenderScore()}`,raw);
      }
    }

    // "Lucas a raté" or "lettre pour Lucas"
    let targetName=null;

    m=raw.match(/\b(?:une?\s+)?(?:lettre|letre|letr|letter|buchstabe|lettera)\s+(?:(?:pour|for|fur|für|a|à|per)\s+)?([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)/i);
    if(m) targetName=m[1];

    if(!targetName){
      m=raw.match(/\b([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)\s+(?:a\s+)?(?:rate|raté|ratee|ratée|missed|miss|verpasst|sbagliato|sbaglia)\b/i);
      if(m) targetName=m[1];
    }

    // Very natural short command: "Bastien lettre"
    if(!targetName){
      for(const p of scootGame.players){
        const pn=normalize(p.name);
        if(s.includes(pn) && /\b(lettre|letre|letr|letter|buchstabe|lettera|rate|raté|miss|missed|sbaglia|verpasst)\b/.test(s)){
          targetName=p.name;
          break;
        }
      }
    }

    if(targetName){
      const p=scootFindPlayer(targetName);
      if(!p) return scootReply(t.unknown(cleanPlayerName(targetName)),raw);
      return scootAddLetter(p,raw);
    }

    // While game is active, allow "score?" style variants but otherwise don't hijack normal Lya.
    return false;
  }

  function answerSmallTalk(text){
    const intent = smallTalkIntent(text);
    if(!intent) return false;

    const langPack = SMALL_TALK_REPLIES[language] || SMALL_TALK_REPLIES.en;
    const replies = langPack[intent];
    if(!replies) return false;

    addUser(text);
    input.value='';
    setBusy(true);

    // Tiny movement so Lya feels alive when she answers.
    ridyArt.classList.remove('ridy-wave');
    void ridyArt.offsetWidth;
    ridyArt.classList.add('ridy-wave');

    setTimeout(()=>{
      addRidy(randomReply(replies));
      setBusy(false);
      input.focus();
      setTimeout(()=>ridyArt.classList.remove('ridy-wave'),650);
    },180);

    return true;
  }


  function riderDisplayName(entry){
    if(!entry || entry.category!=='Riders') return '';
    const qfr=(entry.questions&&entry.questions.fr)||'';
    const m=qfr.match(/^Qui est (.+?) \?$/i);
    return m ? m[1].trim() : '';
  }

  function cleanPossiblePersonName(text){
    let s=String(text||'').trim();

    // Remove conversational corrections / question wrappers.
    s=s.replace(/^(non|nan|nope|nop)\s+/i,'');
    s=s.replace(/^(qui\s+est|c['’]est\s+qui|bio(?:graphie)?(?:\s+de)?|who\s+is|wer\s+ist|chi\s+[èe])\s+/i,'');
    s=s.replace(/[?!.,;:]+$/g,'').trim();

    return s;
  }

  function isLikelyPersonName(text){
    const cleaned=cleanPossiblePersonName(text);
    if(!cleaned) return false;

    const parts=cleaned.split(/\s+/).filter(Boolean);
    if(parts.length<2 || parts.length>4) return false;

    // Do not confuse normal RIDLY questions with names.
    const blocked=new Set([
      'game','scoot','scout','score','cours','course','courses','prix','price',
      'rider','riders','suisse','suisses','swiss','world','mondial','mondiaux',
      'park','street','spot','spots','whatsapp','groupe','group','inscription',
      'ridly','rsl','lya','trottinette','scooter','classement','ranking',
      'montreux','lausanne','vidy','yverdon','martigny'
    ]);
    if(parts.some(p=>blocked.has(normalize(p)))) return false;

    return parts.every(p=>/^[A-Za-zÀ-ÖØ-öø-ÿ'’\-]+$/.test(p));
  }

  function riderFullNameDistance(a,b){
    const aa=normalize(a).split(/\s+/).filter(Boolean);
    const bb=normalize(b).split(/\s+/).filter(Boolean);
    if(aa.length!==bb.length) return 99;

    let total=0;
    for(let i=0;i<aa.length;i++){
      total += editDistance(aa[i],bb[i]);
    }
    return total;
  }

  function answerUnknownRiderName(text){
    if(!isLikelyPersonName(text)) return false;

    const candidate=cleanPossiblePersonName(text);
    const nc=normalize(candidate);

    // Known people outside the Riders category (e.g. Joël Meuwly / RSL)
    // must be allowed through to the normal knowledge search.
    if(typeof knownFullNames==='function'){
      const knownPerson=knownFullNames().some(full=>normalize(full)===nc);
      if(knownPerson) return false;
    }

    const riderEntries=knowledge.filter(e=>e.category==='Riders' && riderDisplayName(e));
    const exact=riderEntries.find(e=>normalize(riderDisplayName(e))===nc);
    if(exact) return false; // normal search should answer it

    // Allow small spelling mistakes only when the WHOLE full name is close.
    const close=riderEntries.find(e=>{
      const rn=riderDisplayName(e);
      const partsA=normalize(rn).split(/\s+/);
      const partsB=nc.split(/\s+/);
      if(partsA.length!==partsB.length) return false;
      const d=riderFullNameDistance(rn,candidate);
      return d <= (nc.length>=12 ? 2 : 1);
    });
    if(close) return false;

    // A full-name-looking query should never fall onto another rider
    // merely because the first name matches.
    const replies={
      fr:`Je n’ai pas encore d’infos fiables sur ${candidate} 😅 Je préfère ne pas inventer.`,
      de:`Ich habe noch keine verlässlichen Infos zu ${candidate} 😅 Lieber erfinde ich nichts.`,
      it:`Non ho ancora informazioni affidabili su ${candidate} 😅 Preferisco non inventare.`,
      en:`I don’t have reliable information on ${candidate} yet 😅 I’d rather not make anything up.`
    };

    addUser(text);
    input.value='';
    setBusy(true);
    setTimeout(()=>{
      addRidy(replies[language]||replies.fr);
      setBusy(false);
      input.focus();
    },180);
    return true;
  }


  function knownFullNames(){
    const names=[];

    // Structured rider names
    for(const e of knowledge){
      if(e.category==='Riders'){
        const rn=riderDisplayName(e);
        if(rn) names.push(rn);
      }
    }

    // A few structured RSL names already present in the local knowledge base.
    // Extract likely "Firstname Lastname" sequences from RSL answers/questions.
    for(const e of knowledge){
      if(e.category==='Riders') continue;
      const blob=[
        ...Object.values(e.questions||{}),
        ...Object.values(e.answer||{})
      ].join(' ');

      const matches=blob.match(/\b[A-ZÀ-ÖØ-Ý][a-zà-öø-ÿ'’\-]+(?:\s+[A-ZÀ-ÖØ-Ý][a-zà-öø-ÿ'’\-]+)+\b/g) || [];
      for(const m of matches){
        const parts=m.split(/\s+/);
        if(parts.length>=2 && parts.length<=3) names.push(m.trim());
      }
    }

    return [...new Set(names)];
  }

  function answerSingleFirstName(text){
    const raw=String(text||'').trim().replace(/[?!.,;:]+$/g,'');
    if(!raw || /\s/.test(raw)) return false;

    const n=normalize(raw);
    if(n.length<3) return false;

    // Don't hijack normal one-word RIDLY commands/topics.
    const blocked=new Set([
      'salut','hello','bonjour','merci','aide','help','score','game','scoot','scout',
      'park','street','spot','spots','cours','course','prix','price','riders','rider',
      'suisse','swiss','mondial','world','classement','ranking','whatsapp','groupe',
      'montreux','lausanne','vidy','yverdon','martigny','ridly','rsl','lya',
      'oui','non','ok','okay','bye','ciao','hallo','bonjour'
    ]);
    if(blocked.has(n)) return false;

    const candidates=knownFullNames().filter(full=>{
      const first=normalize(full).split(/\s+/)[0];
      return first===n || editDistance(first,n)<=1;
    });

    // If no known candidate, leave normal routing alone.
    if(!candidates.length) return false;

    const unique=[...new Set(candidates)].slice(0,4);

    let msg='';
    if(unique.length===1){
      const full=unique[0];
      msg=(
        language==='de' ? `Meinst du ${full}? Schreib am besten den vollständigen Namen, damit ich niemanden verwechsle 😄` :
        language==='it' ? `Parli di ${full}? Scrivi meglio nome e cognome, così non confondo le persone 😄` :
        language==='en' ? `Do you mean ${full}? Give me the full name so I don’t mix people up 😄` :
        `Tu parles de ${full} ? Donne-moi le prénom + nom, comme ça je ne confonds personne 😄`
      );
    }else{
      const list=unique.join(', ');
      msg=(
        language==='de' ? `Welchen ${raw} meinst du? Ich habe mehrere mögliche Personen: ${list}. Gib mir bitte den vollständigen Namen 😄` :
        language==='it' ? `Quale ${raw} intendi? Ho più possibilità: ${list}. Dammi nome e cognome 😄` :
        language==='en' ? `Which ${raw} do you mean? I have several possibilities: ${list}. Give me the full name 😄` :
        `Tu parles de quel ${raw} ? J’ai plusieurs possibilités : ${list}. Donne-moi le prénom + nom 😄`
      );
    }

    addUser(text);
    input.value='';
    setBusy(true);
    setTimeout(()=>{
      addRidy(msg);
      setBusy(false);
      input.focus();
    },160);
    return true;
  }

  function ask(q){
    const clean=String(q||'').trim();
    if(!clean||busy) return;

    // GAME OF SCOOT: persistent local match state.
    if(answerScootGame(clean)) return;

    // Sexual / inappropriate prompts: playful boundary first.
    if(answerBoundary(clean)) return;

    // Course WhatsApp links.
    if(answerCourseWhatsApp(clean)) return;

    // Contextual reasoning: understands follow-up questions.
    if(answerSmartContext(clean)) return;

    // Greetings / thanks / basic conversation.
    if(answerSmallTalk(clean)) return;

    // A single first name is ambiguous: ask for the full name.
    if(answerSingleFirstName(clean)) return;

    // A full rider name must match the full name, not just the first name.
    if(answerUnknownRiderName(clean)) return;

    if(!knowledge.length) return;
    addUser(clean); input.value=''; setBusy(true);
    setTimeout(()=>{
      const results=rank(clean); const top=results[0];
      if(top && top.score>=5.5){
        const answer=(top.e.answer&&top.e.answer[language])||top.e.answer.fr||top.e.answer.en;
        rememberEntry(top.e,clean,'knowledge');
        addRidy(answer,top.e);

        // Useful call-to-action when the matched topic is courses.
        if(topicFromEntry(top.e)==='courses'){
          const lastBubble=messages.lastElementChild?.querySelector('.bubble');
          if(lastBubble){
            const t=SMART_COPY[language]||SMART_COPY.en;
            const wrap=document.createElement('div'); wrap.className='smart-actions';
            addSmartButton(wrap,t.coursesBtn,null,'https://rsl-swiss.ch/cours');
            lastBubble.appendChild(wrap);
          }
        }
      } else showSuggestions(results.filter(x=>x.score>0));
      setBusy(false); input.focus();
    },260);
  }

  }

de la publication, tu peux choisir une catégorie comme Street, Park, Pumptrack, Contest ou Lifestyle et éventuellement rattacher le contenu à un spot.","de":"RIDLY bietet mehrere Formate: Feed-Post, temporäre Story und vertikales Reel. Beim Posten kannst du Kategorien wie Street, Park, Pumptrack, Contest oder Lifestyle wählen und den Inhalt optional mit einem Spot verknüpfen.","it":"RIDLY prevede diversi formati: post nel feed, Story temporanea e Reel verticale. Puoi scegliere categorie come Street, Park, Pumptrack, Contest o Lifestyle e collegare eventualmente il contenuto a uno spot.","en":"RIDLY supports several formats: feed posts, temporary Stories and vertical Reels. You can choose categories such as Street, Park, Pumptrack, Contest or Lifestyle and optionally link the content to a spot."},"keywords":["publier","post","feed","story","reel","street","park","pumptrack","contest","lifestyle","veröffentlichen","pubblicare"],"source":{"label":"RIDLY – Ajouter","url":"ajouter.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-story","category":"RIDLY","questions":{"fr":"Combien de temps dure une Story RIDLY ?","de":"Wie lange bleibt eine RIDLY-Story?","it":"Quanto dura una Story RIDLY?","en":"How long does a RIDLY Story last?"},"answer":{"fr":"Dans la version actuelle du projet, une Story RIDLY est prévue comme contenu temporaire pendant 48 heures.","de":"In der aktuellen Projektversion ist eine RIDLY-Story als temporärer Inhalt für 48 Stunden vorgesehen.","it":"Nella versione attuale del progetto, una Story RIDLY è prevista come contenuto temporaneo per 48 ore.","en":"In the current project version, a RIDLY Story is designed as temporary content lasting 48 hours."},"keywords":["story","48h","48 heures","temporary","temporär","temporanea"],"source":{"label":"RIDLY – Ajouter","url":"ajouter.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-feed-rating","category":"RIDLY","questions":{"fr":"Peut-on noter les publications RIDLY ?","de":"Kann man RI -Statistiken.","it":"Un profilo RIDLY può contenere nickname, nome, città, cantone, paese, genere, Instagram, bio e avatar. Mostra anche elementi social e attività come post, follower e statistiche di spot o sessioni.","en":"A RIDLY profile can include username, name, city, canton, country, gender, Instagram, bio and avatar. It also shows social/activity elements such as posts, followers and spot or session statistics."},"keywords":["profil","profile","pseudo","avatar","bio","instagram","followers","statistiques","profil rider"],"source":{"label":"RIDLY – Profil","url":"profil_ou_rider.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-rankings","category":"RIDLY","questions":{"fr":"Comment fonctionnent les classements RIDLY ?","de":"Wie funktionieren die RIDLY-Rankings?","it":"Come funzionano le classifiche RIDLY?","en":"How do RIDLY rankings work?"},"answer":{"fr":"La page Classements permet de filtrer notamment par pays, spot et recherche rider/ville. Le projet prévoit des classements globaux ou par spot avec du temps et des points.","de":"Auf der Ranking-Seite kann unter anderem nach Land, Spot und Rider/Stadt gefiltert werden. Vorgesehen sind globale oder spotbezogene Rankings mit Zeit und Punkten.","it":"La pagina Classifiche permette di filtrare per paese, spot e ricerca rider/città. Il progetto prevede classifiche globali o per spot con tempo e punti.","en":"The Rankings page can be filtered by country, spot and rider/city search. The project supports global or per-spot rankings with time and points."},"keywords":["classement","ranking","points","temps","spot","country","pays","rangliste","classifica"],"source":{"label":"RIDLY – Classements","url":"classement.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-global-chat","category":"RIDLY","questions":{"fr":"RIDLY a-t-il un chat général ?","de":"Hat RIDLY einen öffentlichen Chat?","it":"RIDLY ha una chat generale?","en":"Does RIDLY have a global chat?"},"answer":{"fr":"Oui. RIDLY comporte un chat riders général réservé aux utilisateurs connectés. Une modération automatique bloque déjà certains mots.","de":"Ja. RIDLY enthält einen allgemeinen Rider-Chat für angemeldete Nutzer. Einige Wörter werden bereits automatisch moderiert.","it":"Sì. RIDLY include una chat generale per rider accessibile agli utenti connessi. Alcune parole vengono già bloccate automaticamente.","en":"Yes. RIDLY includes a general riders chat for signed-in users. Some words are already blocked by automatic moderation."},"keywords":["chat","chat général","global chat","discussion","moderation","modération"],"source":{"label":"RIDLY – Chat","url":"chat.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-private-chat","category":"RIDLY","questions":{"fr":"Peut-on parler en privé sur RIDLY ?","de":"Gibt es private Nachrichten auf RIDLY?","it":"Ci sono messaggi privati su RIDLY?","en":"Does RIDLY have private messages?"},"answer":{"fr":"Oui. RIDLY comporte aussi un chat privé 1 contre 1. Le projet prévoit l’envoi de médias et une interface pour l’audio ; les vidéos sont limitées à 20 secondes dans cette version.","de":"Ja. RIDLY hat auch einen privaten 1-zu-1-Chat. Medien und eine Audio-Funktion sind vorgesehen; Videos sind in dieser Version auf 20 Sekunden begrenzt.","it":"Sì. RIDLY include anche una chat privata 1 a 1. Sono previsti media e una funzione audio; in questa versione i video sono limitati a 20 secondi.","en":"Yes. RIDLY also has one-to-one private chat. Media and an audio interface are supported; videos are limited to 20 seconds in this version."},"keywords":["chat privé","private chat","message privé","dm","1v1","audio","video 20"],"source":{"label":"RIDLY – Chat privé","url":"chat1v1.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-games","category":"RIDLY","questions":{"fr":"Quels jeux y a-t-il sur RIDLY ?","de":"Welche Games gibt es auf RIDLY?","it":"Quali giochi ci sono su RIDLY?","en":"What games are on RIDLY?"},"answer":{"fr":"RIDLY possède un Game Hub autour de la trottinette : Game of Scoot classique et vidéo, ainsi que plusieurs mini-jeux/challenges comme Simon, Random Tricks, Challenges, Scoot Runner ou Finger Hero selon la version disponible.","de":"RIDLY hat einen Scooter-Game-Hub mit klassischem und Video-Game-of-Scoot sowie mehreren Mini-Games/Challenges wie Simon, Random Tricks, Challenges, Scoot Runner oder Finger Hero – je nach verfügbarer Version.","it":"RIDLY ha un Game Hub dedicato al monopattino con Game of Scoot classico e video, oltre a mini-giochi/challenge come Simon, Random Tricks, Challenges, Scoot Runner o Finger Hero secondo la versione.","en":"RIDLY has a scooter Game Hub with classic and video Game of Scoot plus mini-games/challenges such as Simon, Random Tricks, Challenges, Scoot Runner or Finger Hero depending on the version."},"keywords":["games","jeux","game of scoot","simon","random tricks","finger hero","scoot runner","challenge"],"source":{"label":"RIDLY – Games","url":"games.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-game-of-scoot","category":"RIDLY","questions":{"fr":"Comment marche le Game of Scoot classique ?","de":"Wie funktioniert das klassische Game of Scoot?","it":"Come funziona il Game of Scoot classico?","en":"How does classic Game of Scoot work?"},"answer":{"fr":"Le mode classique sert à organiser un Game of Scoot avec les lettres S-C-O-O-T. RIDLY permet de partager un code de partie et ce mode ne demande pas obligatoirement de vidéo.","de":"Der klassische Modus organisiert ein Game of Scoot mit den Buchstaben S-C-O-O-T. RIDLY ermöglicht einen Spielcode; in diesem Modus ist kein Video zwingend erforderlich.","it":"La modalità classica organizza un Game of Scoot con le lettere S-C-O-O-T. RIDLY permette di condividere un codice partita e non richiede obbligatoriamente un video.","en":"Classic mode runs a Game of Scoot using the letters S-C-O-O-T. RIDLY lets players share a game code and this mode does not require video."},"keywords":["game of scoot","scoot","lettres scoot","code partie","game code","classique"],"source":{"label":"RIDLY – Game of Scoot","url":"game_scoot_classic.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-account","category":"RIDLY","questions":{"fr":"Comment se connecter à RIDLY ?","de":"Wie melde ich mich bei RIDLY an?","it":"Come accedo a RIDLY?","en":"How do I sign in to RIDLY?"},"answer":{"fr":"La page Compte utilise Supabase Auth. Tu peux te connecter par e-mail et mot de passe ; le projet prévoit aussi un lien magique par e-mail. Si tu as déjà une session valide, RIDLY peut t’envoyer directement vers la carte.","de":"Die Konto-Seite nutzt Supabase Auth. Du kannst dich mit E-Mail und Passwort anmelden; außerdem ist ein Magic-Link per E-Mail vorgesehen. Mit gültiger Session kann RIDLY direkt zur Karte weiterleiten.","it":"La pagina Account usa Supabase Auth. Puoi accedere con e-mail e password; è previsto anche un link magico via e-mail. Con una sessione valida RIDLY può portarti direttamente alla mappa.","en":"The Account page uses Supabase Auth. You can sign in with email and password, and the project also supports an email magic link. With an existing valid session RIDLY can send you straight to the map."},"keywords":["connexion","login","compte","account","supabase","mot de passe","password","magic link","lien magique"],"source":{"label":"RIDLY – Compte","url":"compte.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-password-reset","category":"RIDLY","questions":{"fr":"J’ai oublié mon mot de passe RIDLY.","de":"Ich habe mein RIDLY-Passwort vergessen.","it":"Ho dimenticato la password RIDLY.","en":"I forgot my RIDLY password."},"answer":{"fr":"Utilise « Mot de passe oublié ? » sur la page Compte. RIDLY envoie un e-mail de réinitialisation et renvoie ensuite vers la page dédiée au nouveau mot de passe.","de":"Nutze „Passwort vergessen?“ auf der Konto-Seite. RIDLY verschickt eine Reset-E-Mail und führt anschließend zur Seite für das neue Passwort.","it":"Usa “Password dimenticata?” nella pagina Account. RIDLY invia un’e-mail di reimpostazione e poi apre la pagina dedicata alla nuova password.","en":"Use “Forgot password?” on the Account page. RIDLY sends a reset email and then directs you to the dedicated new-password page."},"keywords":["mot de passe oublié","forgot password","reset password","passwort vergessen","password dimenticata"],"source":{"label":"RIDLY – Compte","url":"compte.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-pwa","category":"RIDLY","questions":{"fr":"Peut-on installer RIDLY comme une app ?","de":"Kann RIDLY als App installiert werden?","it":"Si può installare RIDLY come app?","en":"Can RIDLY be installed like an app?"},"answer":{"fr":"Oui. RIDLY est conçu comme une PWA : avec le manifest et le service worker, un navigateur compatible peut proposer « Installer » ou « Ajouter à l’écran d’accueil ». Sur iPhone, l’installation passe généralement par Safari > Partager > Ajouter à l’écran d’accueil.","de":"Ja. RIDLY ist als PWA ausgelegt: Mit Manifest und Service Worker kann ein kompatibler Browser „Installieren“ oder „Zum Home-Bildschirm“ anbieten. Auf dem iPhone läuft es meist über Safari > Teilen > Zum Home-Bildschirm.","it":"Sì. RIDLY è progettato come PWA: con manifest e service worker un browser compatibile può proporre “Installa” o “Aggiungi alla schermata Home”. Su iPhone di solito si usa Safari > Condividi > Aggiungi alla schermata Home.","en":"Yes. RIDLY is designed as a PWA: with its manifest and service worker a compatible browser can offer Install/Add to Home Screen. On iPhone this is usually Safari > Share > Add to Home Screen."},"keywords":["pwa","installer","installation","app","écran accueil","home screen","installieren","schermata home"],"source":{"label":"RIDLY","url":"https://ridly.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-age","category":"RIDLY","questions":{"fr":"Quel âge faut-il pour utiliser RIDLY ?","de":"Wie alt muss man für RIDLY sein?","it":"Quanti anni servono per usare RIDLY?","en":"How old do you need to be to use RIDLY?"},"answer":{"fr":"Les conditions RIDLY indiquent un âge minimum de 13 ans. Pour les moins de 16 ans, le consentement du représentant légal est prévu.","de":"Die RIDLY-Bedingungen nennen ein Mindestalter von 13 Jahren. Unter 16 Jahren ist die Zustimmung eines gesetzlichen Vertreters vorgesehen.","it":"Le condizioni RIDLY indicano un’età minima di 13 anni. Per chi ha meno di 16 anni è previsto il consenso del rappresentante legale.","en":"RIDLY terms state a minimum age of 13. Users under 16 are expected to have consent from a legal guardian."},"keywords":["âge","age","13","16","mineur","minor","minderjährig","minorenne","parent","guardian"],"source":{"label":"RIDLY – Conditions","url":"conditions.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-moderation","category":"RIDLY","questions":{"fr":"Qu’est-ce qui est interdit sur RIDLY ?","de":"Was ist auf RIDLY verboten?","it":"Cosa è vietato su RIDLY?","en":"What is prohibited on RIDLY?"},"answer":{"fr":"Les règles interdisent notamment les contenus haineux, pornographiques ou illégaux, le harcèlement, le spam et les incitations dangereuses. RIDLY peut modérer, supprimer du contenu ou suspendre un compte en cas d’abus.","de":"Verboten sind unter anderem Hassinhalte, Pornografie oder illegale Inhalte, Belästigung, Spam und gefährliche Aufforderungen. RIDLY kann Inhalte moderieren/entfernen oder Konten bei Missbrauch sperren.","it":"Sono vietati tra l’altro contenuti d’odio, pornografici o illegali, molestie, spam e incitazioni pericolose. RIDLY può moderare/rimuovere contenuti o sospendere account in caso di abuso.","en":"Prohibited content includes hateful, pornographic or illegal material, harassment, spam and dangerous incitement. RIDLY may moderate/remove content or suspend accounts for abuse."},"keywords":["interdit","modération","moderation","harcèlement","spam","illegal","hateful","verboten","vietato"],"source":{"label":"RIDLY – Conditions","url":"conditions.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-data","category":"RIDLY","questions":{"fr":"Quelles données RIDLY utilise-t-il ?","de":"Welche Daten verarbeitet RIDLY?","it":"Quali dati usa RIDLY?","en":"What data does RIDLY use?"},"answer":{"fr":"Les conditions et la politique du projet couvrent les données de compte, les contenus publiés et certaines données techniques. Supabase est utilisé pour la base de données et l’authentification. RIDLY indique ne pas vendre les données et ne les partager qu’avec les prestataires nécessaires au fonctionnement.","de":"Die Projektbedingungen und Datenschutztexte umfassen Kontodaten, veröffentlichte Inhalte und technische Daten. Supabase wird für Datenbank und Authentifizierung genutzt. RIDLY erklärt, Daten nicht zu verkaufen und nur mit notwendigen Dienstleistern zu teilen.","it":"Le condizioni e la privacy del progetto coprono dati account, contenuti pubblicati e alcuni dati tecnici. Supabase è usato per database e autenticazione. RIDLY dichiara di non vendere i dati e di condividerli solo con fornitori necessari al servizio.","en":"The project terms/privacy cover account data, published content and some technical data. Supabase is used for database and authentication. RIDLY states that it does not sell data and only shares it with providers needed to run the service."},"keywords":["données","data","privacy","confidentialité","supabase","protection données","datenschutz","privacy policy"],"source":{"label":"RIDLY – Confidentialité","url":"confidentialite.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-content-rights","category":"RIDLY","questions":{"fr":"À qui appartiennent les photos et vidéos publiées sur RIDLY ?","de":"Wem gehören Fotos und Videos auf RIDLY?","it":"A chi appartengono foto e video pubblicati su RIDLY?","en":"Who owns photos and videos posted on RIDLY?"},"answer":{"fr":"Selon les conditions du projet, l’utilisateur conserve ses droits sur son contenu. En publiant, il accorde toutefois à RIDLY une licence non exclusive, mondiale et gratuite permettant d’héberger, adapter et diffuser ce contenu dans le service et sa promotion.","de":"Nach den Projektbedingungen behält der Nutzer seine Rechte am eigenen Inhalt. Durch das Veröffentlichen erhält RIDLY jedoch eine nicht-exklusive, weltweite und kostenlose Lizenz, den Inhalt im Dienst und zur Bewerbung zu hosten, anzupassen und zu verbreiten.","it":"Secondo le condizioni del progetto, l’utente mantiene i diritti sui propri contenuti. Pubblicando concede però a RIDLY una licenza non esclusiva, mondiale e gratuita per ospitare, adattare e distribuire il contenuto nel servizio e nella sua promozione.","en":"Under the project terms, users keep their rights to their content. By posting, they grant RIDLY a non-exclusive, worldwide, royalty-free licence to host, adapt and distribute that content within the service and its promotion."},"keywords":["droits photo","copyright","contenu","content rights","photo vidéo","license","licence","urheberrecht","diritti"],"source":{"label":"RIDLY – Conditions","url":"conditions.html"},"dynamic":false,"verified":"2026-08-26"},{"id":"ridly-home-summary","category":"RIDLY","questions":{"fr":"Que dit la page d’accueil RIDLY ?","de":"Was sagt die RIDLY-Startseite?","it":"Cosa dice la home di RIDLY?","en":"What does the RIDLY homepage say?"},"answer":{"fr":"La page publique présente RIDLY comme « la carte des spots pour tous les riders » : skateparks, street spots, shops partenaires et lieux de cours, avec clips, Game of Scoot et profil rider. La connexion est annoncée comme gratuite.","de":"Die öffentliche Startseite beschreibt RIDLY als „Spot-Karte für alle Rider“: Skateparks, Street-Spots, Partner-Shops und Kursorte, ergänzt durch Clips, Game of Scoot und Rider-Profil. Die Anmeldung wird als kostenlos präsentiert.","it":"La home pubblica presenta RIDLY come “la mappa degli spot per tutti i rider”: skatepark, street spot, shop partner e luoghi dei corsi, con clip, Game of Scoot e profilo rider. La connessione è indicata come gratuita.","en":"The public homepage presents RIDLY as “the spot map for all riders”: skateparks, street spots, partner shops and course locations, plus clips, Game of Scoot and a rider profile. Sign-in is presented as free."},"keywords":["accueil ridly","homepage","carte des spots","ouvrir ridly","clips"],"source":{"label":"RIDLY","url":"https://ridly.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-overview","category":"RSL","questions":{"fr":"C’est quoi la RSL ?","de":"Was ist die RSL?","it":"Cos’è la RSL?","en":"What is the RSL?"},"answer":{"fr":"La RSL, Romandie Scooter League, structure la trottinette freestyle en Suisse romande avec championnat, cours et stages, formation de coachs, carte de spots reliée à RIDLY, événements et services pour la communauté. Le site la présente comme sous-fédération officielle Swiss Skate.","de":"Die RSL, Romandie Scooter League, strukturiert Freestyle-Scooter in der Romandie mit Meisterschaft, Kursen, Coach-Ausbildung, einer mit RIDLY verbundenen Spot-Karte, Events und Community-Angeboten. Die Website bezeichnet sie als offizielle Unterföderation von Swiss Skate.","it":"La RSL, Romandie Scooter League, struttura il monopattino freestyle nella Svizzera romanda con campionato, corsi, formazione coach, mappa spot collegata a RIDLY, eventi e servizi per la community. Il sito la presenta come sotto-federazione ufficiale Swiss Skate.","en":"RSL, the Romandie Scooter League, structures freestyle scooter in French-speaking Switzerland with a championship, courses, coach training, a RIDLY-connected spot map, events and community services. Its website presents it as an official Swiss Skate sub-federation."},"keywords":["rsl","romandie scooter league","ligue","swiss skate","association","sous fédération","unterverband","lega"],"source":{"label":"RSL","url":"https://rsl-swiss.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-vision","category":"RSL","questions":{"fr":"Quelle est la vision de la RSL ?","de":"Was ist die Vision der RSL?","it":"Qual è la visione della RSL?","en":"What is RSL’s vision?"},"answer":{"fr":"La RSL vient de la structure Ride4Style développée depuis 2018. Sa vision est d’offrir une progression claire, du premier drop jusqu’aux contests officiels, avec cours, stages, événements et communauté.","de":"Die RSL entstand aus der seit 2018 aufgebauten Ride4Style-Struktur. Ziel ist eine klare Entwicklung vom ersten Drop bis zu offiziellen Contests – mit Kursen, Camps, Events und Community.","it":"La RSL nasce dalla struttura Ride4Style sviluppata dal 2018. L’obiettivo è offrire una progressione chiara, dal primo drop fino ai contest ufficiali, con corsi, stage, eventi e community.","en":"RSL grows out of the Ride4Style structure developed since 2018. Its vision is a clear progression from a rider’s first drop to official contests, supported by courses, camps, events and community."},"keywords":["vision","histoire","history","ride4style","2018","progression","premier drop","geschichte","storia"],"source":{"label":"RSL – Comité","url":"https://rsl-swiss.ch/comite"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-committee","category":"RSL","questions":{"fr":"Qui est dans le comité RSL ?","de":"Wer ist im RSL-Komitee?","it":"Chi fa parte del comitato RSL?","en":"Who is on the RSL committee?"},"answer":{"fr":"Le site RSL liste Joël Meuwly comme président (coordination, résultats, sponsors), William Maurer comme trésorier (comptabilité, trésorerie, prof RSL), Florian Barbezat comme responsable médias et prof RSL, et Louis Zanolli comme co-responsable médias et prof RSL.","de":"Die RSL-Website nennt Joël Meuwly als Präsident (Koordination, Resultate, Sponsoren), William Maurer als Kassier (Buchhaltung, Finanzen, RSL-Coach), Florian Barbezat als Medienverantwortlichen/RSL-Coach und Louis Zanolli als Co-Medienverantwortlichen/RSL-Coach.","it":"Il sito RSL indica Joël Meuwly come presidente (coordinamento, risultati, sponsor), William Maurer come tesoriere (contabilità, tesoreria, coach RSL), Florian Barbezat come responsabile media/coach RSL e Louis Zanolli come co-responsabile media/coach RSL.","en":"The RSL site lists Joël Meuwly as president (coordination, results, sponsors), William Maurer as treasurer (accounts, treasury, RSL coach), Florian Barbezat as media lead/RSL coach and Louis Zanolli as co-media lead/RSL coach."},"keywords":["comité","committee","präsident","président","trésorier","media","joel","william","florian","louis","comitato"],"source":{"label":"RSL – Comité","url":"https://rsl-swiss.ch/comite"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-championship","category":"RSL","questions":{"fr":"Comment fonctionne le championnat RSL ?","de":"Wie funktioniert die RSL-Meisterschaft?","it":"Come funziona il campionato RSL?","en":"How does the RSL championship work?"},"answer":{"fr":"Le site RSL présente un Championnat Romand de Trottinette Freestyle sur 3 manches, avec classements officiels. Les catégories annoncées sont U13, U15, Amateur et Pro, avec disciplines Park et Street.","de":"Die RSL-Website beschreibt eine Romandie-Meisterschaft im Freestyle-Scooter über 3 Runden mit offiziellen Rankings. Angekündigt sind U13, U15, Amateur und Pro sowie Park und Street.","it":"Il sito RSL presenta un Campionato Romando di monopattino freestyle su 3 manche, con classifiche ufficiali. Le categorie annunciate sono U13, U15, Amateur e Pro, nelle discipline Park e Street.","en":"The RSL site presents a 3-round Romandie Freestyle Scooter Championship with official rankings. Announced categories are U13, U15, Amateur and Pro, across Park and Street."},"keywords":["championnat","championship","meisterschaft","campionato","3 manches","u13","u15","amateur","pro","park street"],"source":{"label":"RSL","url":"https://rsl-swiss.ch/"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-next-event","category":"RSL","questions":{"fr":"C’est quand le prochain événement RSL ?","de":"Wann ist das nächste RSL-Event?","it":"Quando è il prossimo evento RSL?","en":"When is the next RSL event?"},"answer":{"fr":"Les dates d’événements changent et la page publique peut parfois conserver une ancienne « prochaine manche ». Pour une date actuelle, ouvre directement la page RSL et vérifie la section événements avant de te déplacer.","de":"Event-Daten ändern sich und die öffentliche Seite kann gelegentlich noch eine ältere „nächste Runde“ anzeigen. Für das aktuelle Datum bitte direkt die RSL-Eventseite prüfen, bevor du anreist.","it":"Le date degli eventi cambiano e la pagina pubblica può talvolta mostrare ancora una vecchia “prossima manche”. Per la data attuale, controlla direttamente la pagina eventi RSL prima di partire.","en":"Event dates change and the public page may sometimes still show an older “next round”. For the current date, check the RSL event page directly before travelling."},"keywords":["prochain événement","next event","prochaine manche","date contest","event date","nächstes event","prossimo evento"],"source":{"label":"RSL – Événements","url":"https://rsl-swiss.ch/"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-vidy-2026","category":"RSL","questions":{"fr":"Qu’était le Contest Vidy du 27 juin 2026 ?","de":"Was war der Vidy Contest am 27. Juni 2026?","it":"Cos’era il Contest Vidy del 27 giugno 2026?","en":"What was the Vidy Contest on 27 June 2026?"},"answer":{"fr":"Le site RSL a publié le Scooter Contest Vidy du 27 juin 2026 à Lausanne comme 2e manche du championnat romand, avec U13, U15, Amateur, Pro, Park et Street. Le casque était obligatoire et les riders devaient être présents avant leur passage.","de":"Die RSL-Website veröffentlichte den Scooter Contest Vidy am 27. Juni 2026 in Lausanne als 2. Runde der Romandie-Meisterschaft mit U13, U15, Amateur, Pro, Park und Street. Helm war Pflicht.","it":"Il sito RSL ha pubblicato il Scooter Contest Vidy del 27 giugno 2026 a Losanna come 2ª manche del campionato romando, con U13, U15, Amateur, Pro, Park e Street. Il casco era obbligatorio.","en":"RSL published the 27 June 2026 Scooter Contest Vidy in Lausanne as round 2 of the Romandie championship, with U13, U15, Amateur, Pro, Park and Street. Helmets were mandatory."},"keywords":["vidy","27 juin 2026","27 june 2026","lausanne","2e manche","contest vidy"],"source":{"label":"RSL","url":"https://rsl-swiss.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-park","category":"RSL","questions":{"fr":"C’est quoi le Park en trottinette freestyle ?","de":"Was ist Park im Freestyle-Scooter?","it":"Cos’è il Park nel monopattino freestyle?","en":"What is Park in freestyle scooter?"},"answer":{"fr":"En RSL, le Park se ride surtout sur bowls, quarters, funbox et spines. On recherche amplitude, flow, lignes et combos aériens propres ; des tricks typiques sont tailwhip, bri flip, backflip ou barspin en combo.","de":"Bei RSL wird Park vor allem auf Bowls, Quarters, Funboxen und Spines gefahren. Wichtig sind Höhe, Flow, Linien und saubere Air-Kombos; typische Tricks sind Tailwhip, Bri Flip, Backflip oder Barspin-Kombos.","it":"Per RSL il Park usa soprattutto bowl, quarter, funbox e spine. Conta ampiezza, flow, linee e combo aeree pulite; trick tipici sono tailwhip, bri flip, backflip o combo di barspin.","en":"In RSL, Park mainly uses bowls, quarters, funboxes and spines. The focus is amplitude, flow, lines and clean aerial combos; typical tricks include tailwhip, bri flip, backflip and barspin combos."},"keywords":["park","bowl","quarter","spine","funbox","amplitude","flow","air"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-street","category":"RSL","questions":{"fr":"C’est quoi le Street en trottinette freestyle ?","de":"Was ist Street im Freestyle-Scooter?","it":"Cos’è lo Street nel monopattino freestyle?","en":"What is Street in freestyle scooter?"},"answer":{"fr":"En RSL, le Street s
