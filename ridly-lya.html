,"smith","ledge","rail","street trick"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-manual","category":"Trottinette freestyle","questions":{"fr":"Comment progresser en manual ?","de":"Wie verbessert man Manuals?","it":"Come migliorare il manual?","en":"How do I improve manuals?"},"answer":{"fr":"Cherche d’abord le point d’équilibre à faible vitesse, bras détendus et genoux souples. Utilise surtout les hanches et les jambes pour corriger, pas de grands mouvements de guidon. Mesure ta progression en distance ou en repères au sol.","de":"Suche den Balancepunkt zuerst bei niedriger Geschwindigkeit, Arme locker und Knie weich. Korrigiere hauptsächlich mit Hüfte/Beinen statt großen Bar-Bewegungen. Fortschritt über Distanz oder Bodenmarken messen.","it":"Trova il punto di equilibrio a bassa velocità, braccia rilassate e ginocchia morbide. Correggi soprattutto con anche/gambe, non con grandi movimenti del manubrio. Misura i progressi in distanza.","en":"Find the balance point at low speed first, with relaxed arms and soft knees. Correct mainly with hips/legs rather than big bar movements. Track progress by distance or ground markers."},"keywords":["manual","nose manual","équilibre","balance","street"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-contest-prep","category":"Trottinette freestyle","questions":{"fr":"Comment préparer une compétition de trottinette ?","de":"Wie bereite ich mich auf einen Scooter-Contest vor?","it":"Come prepararsi a una gara di monopattino?","en":"How should I prepare for a scooter contest?"},"answer":{"fr":"Prépare une run réaliste que tu peux répéter proprement, repère le park, garde 1–2 tricks de secours et ne mise pas tout sur ton trick le plus risqué. Vérifie le setup, casque et horaires, arrive en avance et chauffe progressivement.","de":"Plane einen realistischen Run, den du sauber wiederholen kannst, lerne den Park, halte 1–2 Ersatztricks bereit und setze nicht alles auf den riskantesten Trick. Setup/Helm/Zeiten prüfen, früh kommen und progressiv aufwärmen.","it":"Prepara una run realistica e ripetibile, studia il park, tieni 1–2 trick di riserva e non puntare tutto sul trick più rischioso. Controlla setup, casco e orari, arriva in anticipo e riscaldati progressivamente.","en":"Build a realistic run you can repeat cleanly, learn the park, keep 1–2 backup tricks and do not gamble everything on your riskiest trick. Check setup, helmet and schedule, arrive early and warm up progressively."},"keywords":["préparer contest","competition prep","run","échauffement","warm up","contest"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-sketchy","category":"Trottinette freestyle","questions":{"fr":"C’est quoi une réception sketchy ?","de":"Was ist eine sketchy Landung?","it":"Cos’è un atterraggio sketchy?","en":"What is a sketchy landing?"},"answer":{"fr":"“Sketchy” signifie que la réception n’est pas vraiment propre ou contrôlée : pied qui touche, gros déséquilibre, mouvement de rattrapage, etc. En règlement RSL, le trick peut parfois être compté mais il est fortement pénalisé en exécution/propreté.","de":"„Sketchy“ bedeutet eine unsaubere oder schlecht kontrollierte Landung, z.B. Fußkontakt oder starkes Abfangen. Bei RSL kann der Trick eventuell zählen, wird aber bei Ausführung/Sauberkeit stark abgewertet.","it":"“Sketchy” indica un atterraggio non pulito o poco controllato, per esempio piede a terra o forte recupero. In RSL il trick può talvolta contare ma viene penalizzato molto nell’esecuzione/pulizia.","en":"“Sketchy” means the landing is not clean or well controlled, for example a foot touch or major save. Under RSL rules the trick may still count but is heavily penalised for execution/cleanliness."},"keywords":["sketchy","réception","landing","propreté","execution","landung","atterraggio"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-commuter-vs-freestyle","category":"Trottinette freestyle","questions":{"fr":"Quelle différence entre trottinette freestyle et trottinette de déplacement ?","de":"Was ist der Unterschied zwischen Freestyle- und City-Scooter?","it":"Differenza tra monopattino freestyle e da trasporto?","en":"What is the difference between a freestyle and commuter scooter?"},"answer":{"fr":"Une trottinette freestyle est conçue pour encaisser sauts et tricks : structure fixe, deck/fourche/bar renforcés, petites roues PU et absence de mécanisme de pliage classique. Une trottinette de déplacement privilégie confort, grandes roues, pliage ou équipement urbain, mais n’est pas faite pour les impacts freestyle.","de":"Ein Freestyle-Scooter ist für Sprünge/Tricks gebaut: feste Konstruktion, verstärktes Deck/Gabel/Bar, kleine PU-Rollen und kein klassischer Klappmechanismus. Ein City-Scooter priorisiert Komfort, größere Rollen und Faltung, ist aber nicht für Freestyle-Impacts gedacht.","it":"Un monopattino freestyle è costruito per salti/trick: struttura fissa, deck/forcella/manubrio rinforzati, piccole ruote PU e niente classico sistema pieghevole. Un monopattino da trasporto privilegia comfort e praticità, non gli impatti freestyle.","en":"A freestyle scooter is built for jumps/tricks: fixed construction, reinforced deck/fork/bar, small PU wheels and no typical folding mechanism. A commuter scooter prioritises comfort, larger wheels and portability, but is not designed for freestyle impacts."},"keywords":["freestyle vs normal","trottinette déplacement","commuter","city scooter","pliable","folding"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-memberships","category":"RSL","questions":{"fr":"Quelles sont les formules membres RSL ?","de":"Welche RSL-Mitgliedschaften gibt es?","it":"Quali formule membro RSL esistono?","en":"What RSL membership plans are available?"},"answer":{"fr":"La page Membres présente 5 formules : Starter 50 CHF/an, Rider 80 CHF/an, Pro/Soutien 15 CHF/mois ou 149 CHF/an, Progression 289 CHF/an ou 25 CHF/mois, Premium 490 CHF/an ou 43 CHF/mois. Les avantages augmentent selon la formule : réductions, priorités, cours inclus ou gratuits et suivi.","de":"Die Mitgliederseite zeigt 5 Modelle: Starter 50 CHF/Jahr, Rider 80 CHF/Jahr, Pro/Soutien 15 CHF/Monat oder 149 CHF/Jahr, Progression 289 CHF/Jahr oder 25 CHF/Monat, Premium 490 CHF/Jahr oder 43 CHF/Monat. Vorteile steigen je nach Paket.","it":"La pagina Membri presenta 5 formule: Starter 50 CHF/anno, Rider 80 CHF/anno, Pro/Soutien 15 CHF/mese o 149 CHF/anno, Progression 289 CHF/anno o 25 CHF/mese, Premium 490 CHF/anno o 43 CHF/mese. I vantaggi aumentano secondo il piano.","en":"The Members page lists 5 plans: Starter CHF 50/year, Rider CHF 80/year, Pro/Support CHF 15/month or 149/year, Progression CHF 289/year or 25/month, and Premium CHF 490/year or 43/month. Benefits increase with each plan."},"keywords":["membre","membership","starter","rider","soutien","progression","premium","50","80","149","289","490"],"source":{"label":"RSL – Membres","url":"https://rsl-swiss.ch/membres"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-member-starter","category":"RSL","questions":{"fr":"Que comprend la formule Starter RSL ?","de":"Was enthält RSL Starter?","it":"Cosa comprende RSL Starter?","en":"What does RSL Starter include?"},"answer":{"fr":"Starter est affiché à 50 CHF/an : statut membre officiel, cours à 20 CHF au lieu de 30, –10 % sur le livret de tricks, –10 % dans les boutiques partenaires et sticker/support visuel RSL.","de":"Starter kostet laut Seite 50 CHF/Jahr: offizieller Mitgliedsstatus, Kurse für 20 statt 30 CHF, –10 % auf das Trick-Heft, –10 % bei Partner-Shops und RSL-Sticker/Visual.","it":"Starter è indicato a 50 CHF/anno: status membro ufficiale, corsi a 20 invece di 30 CHF, –10% sul libretto trick, –10% nei negozi partner e sticker/supporto RSL.","en":"Starter is listed at CHF 50/year: official member status, courses at CHF 20 instead of 30, 10% off the trick booklet, 10% off partner shops and an RSL sticker/visual."},"keywords":["starter","50 chf","cours 20","10%","membre officiel"],"source":{"label":"RSL – Membres","url":"https://rsl-swiss.ch/membres"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-member-rider","category":"RSL","questions":{"fr":"Que comprend la formule Rider RSL ?","de":"Was enthält RSL Rider?","it":"Cosa comprende RSL Rider?","en":"What does RSL Rider include?"},"answer":{"fr":"Rider est affiché à 80 CHF/an : priorité à certaines sessions/events, cours à 20 CHF au lieu de 30, –15 % sur le livret de tricks et –15 % dans les boutiques partenaires RSL.","de":"Rider kostet laut Seite 80 CHF/Jahr: Priorität bei bestimmten Sessions/Events, Kurse für 20 statt 30 CHF, –15 % auf Trick-Heft und –15 % bei RSL-Partner-Shops.","it":"Rider è indicato a 80 CHF/anno: priorità su alcune session/eventi, corsi a 20 invece di 30 CHF, –15% sul libretto trick e –15% nei negozi partner RSL.","en":"Rider is listed at CHF 80/year: priority for some sessions/events, courses at CHF 20 instead of 30, 15% off the trick booklet and 15% off RSL partner shops."},"keywords":["rider plan","80 chf","15%","priorité session"],"source":{"label":"RSL – Membres","url":"https://rsl-swiss.ch/membres"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-member-support","category":"RSL","questions":{"fr":"Que comprend Pro / Soutien RSL ?","de":"Was enthält RSL Pro / Support?","it":"Cosa comprende Pro / Soutien RSL?","en":"What does RSL Pro / Support include?"},"answer":{"fr":"Pro / Soutien est affiché à 15 CHF/mois ou 149 CHF/an. Il vise notamment marques, commerces, parents et riders adultes qui veulent soutenir la ligue ; il inclut livret de tricks, cours à 20 CHF et –15 % chez les partenaires.","de":"Pro/Support kostet laut Seite 15 CHF/Monat oder 149 CHF/Jahr. Es richtet sich u.a. an Marken, Shops, Eltern und erwachsene Rider zur Unterstützung der Liga; enthalten sind Trick-Heft, Kurse für 20 CHF und –15 % bei Partnern.","it":"Pro/Soutien è indicato a 15 CHF/mese o 149 CHF/anno. È rivolto anche a marchi, negozi, genitori e rider adulti che sostengono la lega; include libretto trick, corsi a 20 CHF e –15% dai partner.","en":"Pro/Support is listed at CHF 15/month or 149/year. It targets brands, businesses, parents and adult riders supporting the league; it includes the trick booklet, CHF 20 courses and 15% off partners."},"keywords":["pro soutien","support","149","15 mois","marque commerce"],"source":{"label":"RSL – Membres","url":"https://rsl-swiss.ch/membres"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-member-progression","category":"RSL","questions":{"fr":"Que comprend la formule Progression RSL ?","de":"Was enthält RSL Progression?","it":"Cosa comprende RSL Progression?","en":"What does RSL Progression include?"},"answer":{"fr":"Progression est affiché à 289 CHF/an ou 25 CHF/mois. La formule comprend 15 cours, puis les suivants à 20 CHF, –15 % sur matériel/partenaires et un T-shirt RSL offert.","de":"Progression kostet laut Seite 289 CHF/Jahr oder 25 CHF/Monat. Enthalten sind 15 Kurse, danach weitere für 20 CHF, –15 % auf Material/Partner und ein RSL-T-Shirt.","it":"Progression è indicato a 289 CHF/anno o 25 CHF/mese. Include 15 corsi, poi corsi a 20 CHF, –15% su materiale/partner e una T-shirt RSL.","en":"Progression is listed at CHF 289/year or 25/month. It includes 15 courses, then further courses at CHF 20, 15% off equipment/partners and an RSL T-shirt."},"keywords":["progression","289","25 mois","15 cours","t-shirt"],"source":{"label":"RSL – Membres","url":"https://rsl-swiss.ch/membres"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-member-premium","category":"RSL","questions":{"fr":"Que comprend la formule Premium RSL ?","de":"Was enthält RSL Premium?","it":"Cosa comprende RSL Premium?","en":"What does RSL Premium include?"},"answer":{"fr":"Premium est affiché à 490 CHF/an ou 43 CHF/mois : tous les cours gratuits, –50 % sur les events, suivi avancé, T-shirt et sweat offerts.","de":"Premium kostet laut Seite 490 CHF/Jahr oder 43 CHF/Monat: alle Kurse kostenlos, –50 % auf Events, erweitertes Coaching sowie T-Shirt und Hoodie.","it":"Premium è indicato a 490 CHF/anno o 43 CHF/mese: tutti i corsi gratis, –50% sugli eventi, follow-up avanzato, T-shirt e felpa inclusi.","en":"Premium is listed at CHF 490/year or 43/month: all courses free, 50% off events, advanced follow-up, plus a T-shirt and hoodie."},"keywords":["premium","490","43 mois","cours gratuits","50% events","sweat"],"source":{"label":"RSL – Membres","url":"https://rsl-swiss.ch/membres"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-course-price","category":"RSL","questions":{"fr":"Combien coûte un cours RSL ?","de":"Was kostet ein RSL-Kurs?","it":"Quanto costa un corso RSL?","en":"How much is an RSL course?"},"answer":{"fr":"La page Membres utilise 30 CHF comme tarif normal de référence et 20 CHF pour les membres concernés par les avantages cours. Le prix exact d’une séance doit être vérifié au moment de l’inscription.","de":"Die Mitgliederseite verwendet 30 CHF als regulären Referenzpreis und 20 CHF für berechtigte Mitglieder. Den genauen Preis einer Session bitte bei der Anmeldung prüfen.","it":"La pagina Membri usa 30 CHF come prezzo normale di riferimento e 20 CHF per i membri con vantaggio corsi. Verifica il prezzo esatto al momento dell’iscrizione.","en":"The Members page uses CHF 30 as the regular reference price and CHF 20 for members with course benefits. Check the exact session price when registering."},"keywords":["prix cours","30 chf","20 chf","course price","kurs preis","prezzo corso"],"source":{"label":"RSL – Membres","url":"https://rsl-swiss.ch/membres"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-course-locations","category":"RSL","questions":{"fr":"Où ont lieu les cours RSL ?","de":"Wo finden RSL-Kurse statt?","it":"Dove si svolgono i corsi RSL?","en":"Where are RSL courses held?"},"answer":{"fr":"Les lieux communiqués dans le projet RSL incluent notamment Lausanne/Vidy, Montreux, Martigny et Yverdon selon les périodes. Les lieux et dates changent : utilise toujours la page Cours pour voir les séances réellement ouvertes.","de":"Im RSL-Projekt wurden je nach Zeitraum u.a. Lausanne/Vidy, Montreux, Martigny und Yverdon als Kursorte kommuniziert. Orte und Daten ändern sich: immer die aktuelle Kursseite prüfen.","it":"Nel progetto RSL sono stati comunicati, a seconda del periodo, luoghi come Losanna/Vidy, Montreux, Martigny e Yverdon. Luoghi e date cambiano: controlla sempre la pagina Corsi.","en":"RSL project communications have included locations such as Lausanne/Vidy, Montreux, Martigny and Yverdon depending on the period. Locations and dates change, so always use the Courses page for currently open sessions."},"keywords":["lausanne","vidy","montreux","martigny","yverdon","où cours","course locations"],"source":{"label":"RSL – Cours","url":"https://rsl-swiss.ch/cours"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-shop-tshirt","category":"RSL","questions":{"fr":"Quel est le prix de T-shirt officiel RSL au Shop RSL ?","de":"Was kostet Offizielles RSL T-Shirt im RSL Shop?","it":"Quanto costa T-shirt ufficiale RSL nello Shop RSL?","en":"How much is the Official RSL T-shirt in the RSL Shop?"},"answer":{"fr":"La page Shop RSL affichait T-shirt officiel RSL à 35 CHF lors de la dernière vérification. Le catalogue est évolutif : vérifie le prix, le stock et les variantes sur la page officielle.","de":"Die RSL-Shopseite zeigte Offizielles RSL T-Shirt bei der letzten Prüfung für 35 CHF. Katalog, Preis, Bestand und Varianten können sich ändern; bitte die offizielle Seite prüfen.","it":"La pagina Shop RSL mostrava T-shirt ufficiale RSL a 35 CHF all’ultima verifica. Catalogo, p ,"category":"Trottinette freestyle","questions":{"fr":"Quelle différence entre IHC et SCS ?","de":"Was ist der Unterschied zwischen IHC und SCS?","it":"Qual è la differenza tra IHC e SCS?","en":"What is the difference between IHC and SCS?"},"answer":{"fr":"IHC est généralement plus léger et courant sur les setups Park ; il utilise un shim et une barre compatible avec fente. SCS est plus massif : le gros collier fait aussi la compression, la barre est normalement sans fente dans la zone serrée et le système est très apprécié en Street pour sa robustesse.","de":"IHC ist meist leichter und im Park verbreitet; es nutzt einen Shim und eine kompatible geschlitzte Bar. SCS ist massiver: Die große Clamp übernimmt auch die Kompression, die Bar ist im Klemmbereich normalerweise schlitzlos und das System ist im Street wegen Robustheit beliebt.","it":"IHC è in genere più leggero e comune nel Park; usa uno shim e una bar compatibile con fessura. SCS è più massiccio: il grande collarino fa anche la compressione, la bar normalmente non ha fessura nella zona serrata ed è molto usato nello Street per robustezza.","en":"IHC is generally lighter and common in Park; it uses a shim and a compatible slit bar. SCS is bulkier: the large clamp also provides compression, the bar normally has no slit in the clamped area, and Street riders value it for robustness."},"keywords":["ihc vs scs","ihc ou scs","difference ihc scs","compression comparison","vergleich ihc scs"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-park-vs-street","category":"Trottinette freestyle","questions":{"fr":"Quelle différence entre Park et Street ?","de":"Was ist der Unterschied zwischen Park und Street?","it":"Qual è la differenza tra Park e Street?","en":"What is the difference between Park and Street?"},"answer":{"fr":"Park met davantage l’accent sur airs, amplitude, flow et combos sur quarters/bowls/spines. Street se concentre sur rails, ledges, gaps, grinds, manuals, précision et créativité. Beaucoup de riders mélangent les deux styles : ce sont des tendances, pas des cases obligatoires.","de":"Park betont eher Airs, Höhe, Flow und Combos auf Quarters/Bowls/Spines. Street konzentriert sich auf Rails, Ledges, Gaps, Grinds, Manuals, Präzision und Kreativität. Viele Rider mischen beide Stile.","it":"Il Park mette più l’accento su air, ampiezza, flow e combo su quarter/bowl/spine. Lo Street si concentra su rail, ledge, gap, grind, manual, precisione e creatività. Molti rider mescolano i due stili.","en":"Park focuses more on airs, amplitude, flow and combos on quarters/bowls/spines. Street focuses on rails, ledges, gaps, grinds, manuals, precision and creativity. Many riders mix both styles."},"keywords":["park vs street","park ou street","difference park street","street park"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rider-jayden-sharman","category":"Riders","questions":{"fr":"Qui est Jayden Sharman ?","de":"Wer ist Jayden Sharman?","it":"Chi è Jayden Sharman?","en":"Who is Jayden Sharman?"},"answer":{"fr":"Jayden Sharman est un rider britannique de trottinette freestyle, spécialisé surtout en Park. Jayden Sharman a terminé 1er du classement mondial World Skate 2023‑2024 en Park. Il a aussi remporté le Championnat du monde Park 2024 puis 2025.","de":"Jayden Sharman ist ein britischer Freestyle-Scooter-Rider, vor allem im Park. Im World-Skate-Weltranking 2023‑2024 belegte Jayden Sharman Platz 1. im Park. Er gewann außerdem die Park-Weltmeisterschaften 2024 und 2025.","it":"Jayden Sharman è un rider britannico di monopattino freestyle, soprattutto nel Park. Nel ranking mondiale World Skate 2023‑2024 ha chiuso 1° nel Park. Ha inoltre vinto i Mondiali Park 2024 e 2025.","en":"Jayden Sharman is a British freestyle scooter rider, best known for Park. Jayden Sharman finished 1st in the 2023‑2024 World Skate Park ranking. He also won the Park World Championships in 2024 and 2025."},"keywords":["Jayden Sharman","jayden sharman","bio jayden sharman","rider jayden sharman","trottinette","scooter","park","britannique","british"],"source":{"label":"World Skate","url":"https://www.worldskate.org/scootering/rankings.html?download=7251%3Aworld-ranking-men-park"},"dynamic":true,"verified":"2026-08-26"},{"id":"rider-jordan-clark","category":"Riders","questions":{"fr":"Qui est Jordan Clark ?","de":"Wer ist Jordan Clark?","it":"Chi è Jordan Clark?","en":"Who is Jordan Clark?"},"answer":{"fr":"Jordan Clark est un rider britannique de trottinette freestyle, spécialisé surtout en Park. Jordan Clark a terminé 2e du classement mondial World Skate 2023‑2024 en Park. Multiple champion du monde, il a pris l'argent mondial Park 2024 et 2025.","de":"Jordan Clark ist ein britischer Freestyle-Scooter-Rider, vor allem im Park. Im World-Skate-Weltranking 2023‑2024 belegte Jordan Clark Platz 2. im Park. Mehrfacher Weltmeister; 2024 und 2025 gewann er Park-WM-Silber.","it":"Jordan Clark è un rider britannico di monopattino freestyle, soprattutto nel Park. Nel ranking mondiale World Skate 2023‑2024 ha chiuso 2° nel Park. Pluricampione del mondo, ha conquistato l'argento Park ai Mondiali 2024 e 2025.","en":"Jordan Clark is a British freestyle scooter rider, best known for Park. Jordan Clark finished 2nd in the 2023‑2024 World Skate Park ranking. A multiple world champion, he took Park world silver in 2024 and 2025."},"keywords":["Jordan Clark","jordan clark","bio jordan clark","rider jordan clark","trottinette","scooter","park","britannique","british"],"source":{"label":"World Skate","url":"https://www.worldskate.org/scootering/rankings.html?download=7251%3Aworld-ranking-men-park"},"dynamic":true,"verified":"2026-08-26"},{"id":"rider-esteban-clot","category":"Riders","questions":{"fr":"Qui est Esteban Clot ?","de":"Wer ist Esteban Clot?","it":"Chi è Esteban Clot?","en":"Who is Esteban Clot?"},"answer":{"fr":"Esteb 023‑2025 : Adrien Gay-Crosier, Alain Zuber, Anthony Grant, Enak Markwalder, Jaime Glaus, Janosch Steinmann, Jari Brandstetter, Jarno Landolt, Joshua Mangelsdorf, Julien Rota, Jérôme Petrich, Karim Héritier, Killian Froidevaux, Lony Savary, Martin Rolle, Mathieu Vilminot, Matis Neyroud, Patrick Frossard, Paul Harti, Pierrick Frossard, Tiago Carvalho Morais, Xavier Gremaud, Yann Montani. La scène évolue, donc cette liste pourra être enrichie.","de":"Lya kennt unter anderem diese Schweizer Rider aus Swiss-Skate-Aufgeboten 2023‑2025: Adrien Gay-Crosier, Alain Zuber, Anthony Grant, Enak Markwalder, Jaime Glaus, Janosch Steinmann, Jari Brandstetter, Jarno Landolt, Joshua Mangelsdorf, Julien Rota, Jérôme Petrich, Karim Héritier, Killian Froidevaux, Lony Savary, Martin Rolle, Mathieu Vilminot, Matis Neyroud, Patrick Frossard, Paul Harti, Pierrick Frossard, Tiago Carvalho Morais, Xavier Gremaud, Yann Montani. Die Szene entwickelt sich weiter.","it":"Lya conosce tra gli altri questi rider svizzeri presenti nelle selezioni Swiss Skate 2023‑2025: Adrien Gay-Crosier, Alain Zuber, Anthony Grant, Enak Markwalder, Jaime Glaus, Janosch Steinmann, Jari Brandstetter, Jarno Landolt, Joshua Mangelsdorf, Julien Rota, Jérôme Petrich, Karim Héritier, Killian Froidevaux, Lony Savary, Martin Rolle, Mathieu Vilminot, Matis Neyroud, Patrick Frossard, Paul Harti, Pierrick Frossard, Tiago Carvalho Morais, Xavier Gremaud, Yann Montani. La scena continua a evolvere.","en":"Lya knows, among others, these Swiss riders appearing in Swiss Skate selections from 2023‑2025: Adrien Gay-Crosier, Alain Zuber, Anthony Grant, Enak Markwalder, Jaime Glaus, Janosch Steinmann, Jari Brandstetter, Jarno Landolt, Joshua Mangelsdorf, Julien Rota, Jérôme Petrich, Karim Héritier, Killian Froidevaux, Lony Savary, Martin Rolle, Mathieu Vilminot, Matis Neyroud, Patrick Frossard, Paul Harti, Pierrick Frossard, Tiago Carvalho Morais, Xavier Gremaud, Yann Montani. The scene keeps evolving."},"keywords":["riders suisses","rider suisse","team suisse","swiss riders","schweizer rider","rider svizzeri"],"source":{"label":"Swiss Skate","url":"https://www.swissskate.ch/fr/actualites/article/une-forte-delegation-suisse-pour-les-championnats-du-monde-de-trottinette/"},"dynamic":true,"verified":"2026-08-26"},{"id":"riders-mondiaux-liste","category":"Riders","questions":{"fr":"Quels sont les meilleurs riders mondiaux ?","de":"Wer sind bekannte internationale Scooter-Rider?","it":"Quali sono i rider mondiali più conosciuti?","en":"Who are some of the top world scooter riders?"},"answer":{"fr":"Lya contient maintenant les principaux riders des classements officiels World Skate Park et Street 2023‑2024, ainsi que des champions 2025, des finalistes de Rome 2026 et plusieurs légendes. Tu peux demander directement « bio Jayden Sharman », « qui est Matis Neyroud ? », « riders suisses », etc.","de":"Lya enthält jetzt die wichtigsten Rider der offiziellen World-Skate-Rankings Park und Street 2023‑2024, dazu Champions 2025, Finalisten Rom 2026 und mehrere Legenden.","it":"Lya contiene ora i principali rider dei ranking ufficiali World Skate Park e Street 2023‑2024, oltre ai campioni 2025, finalisti di Roma 2026 e diverse leggende.","en":"Lya now includes the main riders from the official 2023‑2024 World Skate Park and Street rankings, plus 2025 champions, Rome 2026 finalists and several legends."},"keywords":["riders mondiaux","meilleurs riders","world riders","best scooter riders","rider world skate","champions trottinette"],"source":{"label":"World Skate","url":"https://www.worldskate.org/scootering/rankings.html?download=7251%3Aworld-ranking-men-park"},"dynamic":true,"verified":"2026-08-26"},{"id":"person-joel-meuwly","category":"RSL","questions":{"fr":"Qui est Joël Meuwly ?","de":"Wer ist Joël Meuwly?","it":"Chi è Joël Meuwly?","en":"Who is Joël Meuwly?"},"answer":{"fr":"Joël Meuwly est un entrepreneur suisse romand actif dans la scène ride et la trottinette freestyle. Il est président de la Romandie Scooter League (RSL), où il s'occupe notamment de la coordination, des résultats et des sponsors. Il est aussi le fondateur de JF-Skateboards et de JF Ride Shop, projet qu'il a développé à partir de 2015-2017 avant la création de JF Ride Shop Sàrl à Montreux en 2021. Menuisier de métier, il a également travaillé sur la fabrication artisanale de skateboards et longboards. La RSL est la continuité de Ride4Style, développé depuis 2018 autour des cours, contests et de la structuration de la trottinette freestyle en Suisse romande. Joël est aussi à l'origine de RELÈVE, une plateforme suisse romande destinée à faciliter l'accès des jeunes à leurs premières missions et expériences professionnelles.","de":"Joël Meuwly ist ein Westschweizer Unternehmer, der in der Ride- und Freestyle-Scooter-Szene aktiv ist. Er ist Präsident der Romandie Scooter League (RSL) und kümmert sich dort unter anderem um Koordination, Resultate und Sponsoren. Außerdem ist er Gründer von JF-Skateboards und JF Ride Shop, einem Projekt, das er ab 2015-2017 aufbaute; 2021 entstand daraus JF Ride Shop Sàrl in Montreux. Von Beruf ist er Schreiner und arbeitete auch an handgefertigten Skateboards und Longboards. Die RSL führt das seit 2018 entwickelte Ride4Style-Projekt mit Kursen, Contests und dem Aufbau der Freestyle-Scooter-Szene in der Romandie weiter. Joël steht außerdem hinter RELÈVE, einer Westschweizer Plattform für erste Jobs und lokale Einsätze von Jugendlichen.","it":"Joël Meuwly è un imprenditore della Svizzera romanda attivo nella scena ride e nel freestyle scooter. È presidente della Romandie Scooter League (RSL), dove si occupa in particolare di coordinamento, risultati e sponsor. È anche fondatore di JF-Skateboards e JF Ride Shop, progetto sviluppato dal 2015-2017 e diventato JF Ride Shop Sàrl a Montreux nel 2021. Falegname di formazione, ha lavorato anche nella produzione artigianale di skateboard e longboard. La RSL prosegue il lavoro di Ride4Style, sviluppato dal 2018 con corsi, contest e strutturazione del freestyle scooter nella Svizzera romanda. Joël è inoltre all'origine di RELÈVE, piattaforma romanda dedicata alle prime esperienze professionali dei giovani.","en":"Joël Meuwly is a French-speaking Swiss entrepreneur active in the ride and freestyle scooter scene. He is president of the Romandie Scooter League (RSL), where his responsibilities include coordination, results and sponsors. He is also the founder of JF-Skateboards and JF Ride Shop, a project developed from 2015-2017 before becoming JF Ride Shop Sàrl in Montreux in 2021. A carpenter by trade, he also worked on handcrafted skateboards and longboards. RSL continues the Ride4Style project developed since 2018 around lessons, contests and structuring freestyle scootering in French-speaking Switzerland. Joël is also behind RELÈVE, a regional platform designed to help young people access their first local jobs and work experiences."},"keywords":["joel meuwly","joël meuwly","joel","joël","president rsl","président rsl","fondateur rsl","jf rideshop","jf ride shop","jf skateboards","jf-skateboards","ride4style","releve","relève","menuisier","carpenter","romandie scooter league"],"source":{"label":"RSL / JF Ride Shop / RELÈVE","url":"https://rsl-swiss.ch/comite"},"dynamic":true,"verified":"2026-08-26"}];

<style>
.ridy-art{cursor:pointer}

.ridy-sprite-overlay{
  position:fixed; inset:0; z-index:9999;
  pointer-events:none; opacity:0; overflow:hidden;
  transition:opacity .16s ease;
}
.ridy-sprite-overlay.active{opacity:1}

.sprite-backdrop{
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 52%,rgba(229,16,16,.20),transparent 24%),
    linear-gradient(180deg,rgba(0,0,0,.14),rgba(0,0,0,.88));
  backdrop-filter:blur(3px);
}
.sprite-floor{
  position:absolute; left:50%; bottom:10%;
  width:min(80vw,520px); height:90px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(229,16,16,.22),transparent 72%);
  filter:blur(12px);
}
.sprite-badge{
  position:absolute; left:50%; top:7%;
  transform:translateX(-50%);
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(7,7,7,.76);
  color:#fff;
  font:900 11px/1 "Barlow Condensed",Arial,sans-serif;
  letter-spacing:.12em;
  box-shadow:0 10px 28px rgba(0,0,0,.32);
}
.sprite-stage{
  position:absolute; left:50%; top:54%;
  width:min(78vw,420px); aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  z-index:4;
}
.sprite-frame{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:contain;
  opacity:0;
  transform:translateY(12px) scale(.93);
  filter:
    drop-shadow(0 22px 38px rgba(0,0,0,.55))
    drop-shadow(0 0 24px rgba(229,16,16,.14));
}
.sprite-frame.active{
  opacity:1;
  transform:translateY(0) scale(1);
}
body.ridy-sprite-playing #ridyArt img{
  opacity:.12!important;
  transform:scale(.92)!important;
  transition:.18s ease!important;
}
@media(max-width:820px){
  .sprite-stage{width:min(92vw,390px);top:56%}
  .sprite-badge{top:8%;font-size:10px}
  }
</style>


<script>
(() => {
  const hero = document.getElementById('ridyArt');
  const overlay = document.getElementById('ridySpriteOverlay');
  const frames = [...document.querySelectorAll('.sprite-frame')];
const badgeEl = document.getElementById('spriteBadge');
  if(!hero || !overlay || !frames.length) return;

  let playing = false;
  let lastIndex = -1;

  const tricks = [
    {
      frames:[0,1,2,3,11,15],
      timings:[180,120,100,120,130,190]
    },
    {
      frames:[4,5,6,7,11,15],
      timings:[170,115,95,110,135,190]
    },
    {
      frames:[8,9,10,11,15],
      timings:[180,120,105,125,190]
    },
    {
      frames:[12,13,14,15],
      timings:[180,125,125,210]
    }
  ];

  const badgeText={
    fr:'SURPRISE',
    de:'SURPRISE',
    it:'SORPRESA',
    en:'SURPRISE'
  };

  const langNow=()=>{
    if(typeof language!=='undefined') return language;
    const active=document.querySelector('.lang.active');
    return (active?.dataset?.lang||'en').toLowerCase();
  };

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const resetFrames=()=>frames.forEach(f=>f.classList.remove('active'));

  function pickTrick(){
    let idx=Math.floor(Math.random()*tricks.length);
    if(tricks.length>1 && idx===lastIndex) idx=(idx+1)%tricks.length;
    lastIndex=idx;
    return tricks[idx];
  }

  async function playSingleTrick(){
    if(playing) return;
    playing=true;

    const lang=langNow();
    const trick=pickTrick();

    badgeEl.textContent=badgeText[lang]||badgeText.en;
document.body.classList.add('ridy-sprite-playing');
    overlay.setAttribute('aria-hidden','false');
    overlay.classList.add('active');

    resetFrames();

    for(let i=0;i<trick.frames.length;i++){
      resetFrames();
      const frameIndex=trick.frames[i];
      if(frames[frameIndex]) frames[frameIndex].classList.add('active');
      await sleep(trick.timings[i]||100);
    }

    await sleep(180);
    resetFrames();

    const last=trick.frames[trick.frames.length-1];
    if(frames[last]) frames[last].classList.add('active');

    await sleep(120);
    resetFrames();

    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden','true');
    document.body.classList.remove('ridy-sprite-playing');
    playing=false;
  }

  hero.addEventListener('click',playSingleTrick);
  hero.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      playSingleTrick();
    }
  });

  hero.setAttribute('tabindex','0');
  hero.setAttribute('role','button');
  hero.setAttribute('aria-label','Play one random Lya trick');
})();
</script>
