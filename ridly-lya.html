  function cleanPossiblePersonName(text){
    let s=String(text||'').trim();

    // Remove conversational corrections / question wrappers.
    s=s.replace(/^(non|nan|nope|nop)\s+/i,'');
    s=s.replace(/^(qui\s+est|c['’]est\s+qui|bio(?:graphie)?(?:\s+de)?|who\s+is|wer\s+ist|chi\s+[èe])\s+/i,'');
    s=s.replace(/[?!.,;:]+$/g,'').trim();

    return s;
  }

  function isLikelyPersonName(text){
    const cleaned=cleanPossiblePersonName(text);
    if(!cleaned) return false;

    const parts=cleaned.split(/\s+/).filter(Boolean);
    if(parts.length<2 || parts.length>4) return false;

    const phraseWords=parts.map(p=>normalize(p));
    const notNameWords=new Set([
      'est','et','es','etre','être','toujours','encore','connu','connue','actif','active',
      'tu','connais','connait','connaît','connaissez','sais','savoir',
      'actualite','actualité','actuel','actuelle','recent','récente','ride','rider','roule',
      'is','still','known','famous','active','current','latest',
      'ist','noch','bekannt','aktiv','aktuell',
      'e','è','ancora','conosciuto','attivo','attuale'
    ]);
    if(phraseWords.some(w=>notNameWords.has(w))) return false;

    // Do not confuse normal RIDLY questions with names.
    const blocked=new Set([
      'game','scoot','scout','score','cours','course','courses','prix','price',
      'rider','riders','suisse','suisses','swiss','world','mondial','mondiaux',
      'park','street','spot','spots','whatsapp','groupe','group','inscription',
      'ridly','rsl','lya','trottinette','scooter','classement','ranking',
      'montreux','lausanne','vidy','yverdon','martigny',

      // Conversational acknowledgements must never look like a person's name.
      'ok','okay','merci','thanks','thank','danke','grazie','parfait','super','cool','top',
      'oui','ouais','yes','yeah','ja','bene','dac','accord',

      // Material / sizing vocabulary must never look like a person's name.
      'deck','plateau','guidon','bar','bars','handlebar','handlebars',
      'fourche','fork','roue','roues','wheel','wheels','grips','poignees','poignées',
      'frein','brake','collier','clamp','jdd','headset','compression',
      'taille','tail','taile','hauteur','haut','largeur','longueur',
      'dimension','dimensions','size','height','width','length',

      // Common grammar words: a phrase containing these is not a full name.
      'la','le','les','un','une','du','de','des','d','pour','avec','sans',
      'quelle','quel','quels','quelles','comment','combien',
      'the','of','for','with','what','which',
      'der','die','das','von','mit','welche','welcher',
      'il','lo','gli','le','di','del','della','con','che'
    ]);
    if(parts.some(p=>blocked.has(normalize(p)))) return false;

    return parts.every(p=>/^[A-Za-zÀ-ÖØ-öø-ÿ'’\-]+$/.test(p));
  }

  function riderFullNameDistance(a,b){
    const aa=normalize(a).split(/\s+/).filter(Boolean);
    const bb=normalize(b).split(/\s+/).filter(Boolean);
    if(aa.length!==bb.length) return 99;

    let total=0;
    for(let i=0;i<aa.length;i++){
      total += editDistance(aa[i],bb[i]);
    }
    return total;
  }

  function answerUnknownRiderName(text){
    if(!isLikelyPersonName(text)) return false;

    const candidate=cleanPossiblePersonName(text);
    const nc=normalize(candidate);

    // Known people outside the Riders category (e.g. Joël Meuwly / RSL)
    // must be allowed through to the normal knowledge search.
    if(typeof knownFullNames==='function'){
      const knownPerson=knownFullNames().some(full=>normalize(full)===nc);
      if(knownPerson) return false;
    }

    const riderEntries=knowledge.filter(e=>e.category==='Riders' && riderDisplayName(e));
    const exact=riderEntries.find(e=>normalize(riderDisplayName(e))===nc);
    if(exact) return false; // normal search should answer it

    // Allow small spelling mistakes only when the WHOLE full name is close.
    const close=riderEntries.find(e=>{
      const rn=riderDisplayName(e);
      const partsA=normalize(rn).split(/\s+/);
      const partsB=nc.split(/\s+/);
      if(partsA.length!==partsB.length) return false;
      const d=riderFullNameDistance(rn,candidate);
      return d <= (nc.length>=12 ? 2 : 1);
    });
    if(close) return false;

    // A full-name-looking query should never fall onto another rider
    // merely because the first name matches.
    const replies={
      fr:`Je n’ai pas encore d’infos fiables sur ${candidate} 😅 Je préfère ne pas inventer.`,
      de:`Ich habe noch keine verlässlichen Infos zu ${candidate} 😅 Lieber erfinde ich nichts.`,
      it:`Non ho ancora informazioni affidabili su ${candidate} 😅 Preferisco non inventare.`,
      en:`I don’t have reliable information on ${candidate} yet 😅 I’d rather not make anything up.`
    };

    addUser(text);
    input.value='';
    setBusy(true);
    setTimeout(()=>{
      addRidy(replies[language]||replies.fr);
      setBusy(false);
      input.focus();
    },180);
    return true;
  }


  function knownFullNames(){
    const names=[];

    // Structured rider names
    for(const e of knowledge){
      if(e.category==='Riders'){
        const rn=riderDisplayName(e);
        if(rn) names.push(rn);
      }
    }

    // A few structured RSL names already present in the local knowledge base.
    // Extract likely "Firstname Lastname" sequences from RSL answers/questions.
    for(const e of knowledge){
      if(e.category==='Riders') continue;
      const blob=[
        ...Object.values(e.questions||{}),
        ...Object.values(e.answer||{})
      ].join(' ');

      const matches=blob.match(/\b[A-ZÀ-ÖØ-Ý][a-zà-öø-ÿ'’\-]+(?:\s+[A-ZÀ-ÖØ-Ý][a-zà-öø-ÿ'’\-]+)+\b/g) || [];
      for(const m of matches){
        const parts=m.split(/\s+/);
        if(parts.length>=2 && parts.length<=3) names.push(m.trim());
      }
    }

    return [...new Set(names)];
  }

  function answerSingleFirstName(text){
    const raw=String(text||'').trim().replace(/[?!.,;:]+$/g,'');
    if(!raw || /\s/.test(raw)) return false;

    const n=normalize(raw);
    if(n.length<3) return false;

    // Don't hijack normal one-word RIDLY commands/topics.
    const blocked=new Set([
      'salut','hello','bonjour','merci','aide','help','score','game','scoot','scout',
      'park','street','spot','spots','cours','course','prix','price','riders','rider',
      'suisse','swiss','mondial','world','classement','ranking','whatsapp','groupe',
      'montreux','lausanne','vidy','yverdon','martigny','ridly','rsl','lya',
      'oui','non','ok','okay','bye','ciao','hallo','bonjour'
    ]);
    if(blocked.has(n)) return false;

    const candidates=knownFullNames().filter(full=>{
      const first=normalize(full).split(/\s+/)[0];
      return first===n || editDistance(first,n)<=1;
    });

    // If no known candidate, leave normal routing alone.
    if(!candidates.length) return false;

    const unique=[...new Set(candidates)].slice(0,4);

    let msg='';
    if(unique.length===1){
      const full=unique[0];
      rememberContext({
        pendingPerson: full,
        pendingPersonConfirm: true,
        pendingPeople: [],
        pendingFirstName: raw,
        lastUser: raw
      });
      msg=(
        language==='de' ? `Meinst du ${full}?` :
        language==='it' ? `Parli di ${full}?` :
        language==='en' ? `Do you mean ${full}?` :
        `Tu parles de ${full} ?`
      );
    }else{
      rememberContext({
        pendingPerson: '',
        pendingPersonConfirm: false,
        pendingPeople: unique,
        pendingFirstName: raw,
        lastUser: raw
      });
      const list=unique.join(', ');
      msg=(
        language==='de' ? `Welchen ${raw} meinst du? Ich habe mehrere mögliche Personen: ${list}. Gib mir bitte den vollständigen Namen 😄` :
        language==='it' ? `Quale ${raw} intendi? Ho più possibilità: ${list}. Dammi nome e cognome 😄` :
        language==='en' ? `Which ${raw} do you mean? I have several possibilities: ${list}. Give me the full name 😄` :
        `Tu parles de quel ${raw} ? J’ai plusieurs possibilités : ${list}. Donne-moi le prénom + nom 😄`
      );
    }

    addUser(text);
    input.value='';
    setBusy(true);
    setTimeout(()=>{
      addRidy(msg);
      setBusy(false);
      input.focus();
    },160);
    return true;
  }



  function parseRiderHeightCm(text){
    const raw=String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const s=normalize(text);

    // Common numeric forms: 1m20, 1.20 m, 1,20 m, 120 cm, 1 metre 20.
    let m=raw.match(/\b([12])\s*m\s*([0-9]{1,2})\b/);
    if(m) return (+m[1]*100)+(+m[2]);

    m=raw.match(/\b([12])[\.,]([0-9]{1,2})\s*(?:m|metre|meter|metri|metro)?\b/);
    if(m){
      const dec=String(m[2]).padEnd(2,'0').slice(0,2);
      return (+m[1]*100)+(+dec);
    }

    m=raw.match(/\b([12])\s*(?:metre|meter|metri|metro|m)\s*([0-9]{1,2})\b/);
    if(m) return (+m[1]*100)+(+m[2]);

    m=raw.match(/\b([0-9]{2,3})\s*(?:cm|centimetre|centimeter|centimetri)\b/);
    if(m){
      const cm=+m[1];
      if(cm>=70 && cm<=230) return cm;
    }

    // Tolerate phrases such as “un mettre vingt” / “un metre vingt”.
    const tens={
      dix:10, vingt:20, trente:30, quarante:40, cinquante:50, soixante:60,
      seventy:70, twenty:20, thirty:30, forty:40, fifty:50, sixty:60,
      zehn:10, zwanzig:20, dreissig:30, dreißig:30, vierzig:40, funfzig:50, fünfzig:50, sechzig:60,
      dieci:10, venti:20, trenta:30, quaranta:40, cinquanta:50, sessanta:60
    };
    const unitWords='metre|mettre|meter|metro|metri';
    const oneWords='un|une|one|ein|eine|uno|una';
    const twoWords='deux|two|zwei|due';
    const wordMatch=s.match(new RegExp('\\b('+oneWords+'|'+twoWords+')\\s+(?:'+unitWords+')\\s+([a-z]+)(?:\\s+([a-z]+))?\\b'));
    if(wordMatch){
      const metres=/(deux|two|zwei|due)/.test(wordMatch[1])?2:1;
      let extra=tens[wordMatch[2]]||0;
      const ones={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,
                  one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
                  ein:1,eins:1,zwei:2,drei:3,vier:4,funf:5,fünf:5,sechs:6,sieben:7,acht:8,neun:9,
                  uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9};
      if(wordMatch[3] && ones[wordMatch[3]]) extra += ones[wordMatch[3]];
      if(extra>=0 && extra<100) return metres*100+extra;
    }

    // Bare 3-digit height only when the sentence clearly talks about the rider's size.
    if(/\b(mesure|mesurer|fais|fait|taille|height|gross|grosse|groesse|grösse|alto|alta)\b/.test(s)){
      m=s.match(/\b(1[0-9]{2}|2[0-2][0-9])\b/);
      if(m) return +m[1];
    }

    // Very common spoken/mobile form: “je fais metre trente-cinq” / “mètre trente cinq”.
    // When a metre word is present without an explicit leading “un”, interpret it as 1 metre.
    const looseMetre=s.match(/\b(?:metre|mettre|meter|metro|metri)\s+([a-z]+)(?:\s+([a-z]+))?\b/);
    if(looseMetre){
      let extra=tens[looseMetre[1]]||0;
      const onesLoose={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,
        one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
        ein:1,eins:1,zwei:2,drei:3,vier:4,funf:5,fünf:5,sechs:6,sieben:7,acht:8,neun:9,
        uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9};
      if(looseMetre[2] && onesLoose[looseMetre[2]]) extra += onesLoose[looseMetre[2]];
      if(extra>=0 && extra<=99) return 100+extra;
    }

    return null;
  }

  function scooterTotalHeightRange(cm){
    if(!Number.isFinite(cm)) return null;
    if(cm<100) return '65–69 cm';
    if(cm<110) return '69–72 cm';
    if(cm<120) return '72–75 cm';
    if(cm<130) return '75–77 cm';
    if(cm<140) return '77–80 cm';
    if(cm<150) return '80–84 cm';
    if(cm<160) return '84–88 cm';
    if(cm<170) return '88–94 cm';
    if(cm<180) return '94–100 cm';
    return '100 cm ou plus';
  }

  function isFoamyGripQuery(text){
    const s=normalize(text);
    const ts=s.split(/\s+/).filter(Boolean);
    const compact=s.replace(/\s+/g,'');

    const obvious=/\bfoamy\s+grips?\b/.test(s) || /\bfaux\s+mi\s+gripp?e?s?\b/.test(s) || /\bfoamygrips?\b/.test(s) || /\bfromeryp\b/.test(s) || /\bfromerip\b/.test(s);
    const foamyLike=obvious || ts.some(t=>
      ['foamy','foami','fomy','fommy','faumy','foumi','foamee'].includes(t) ||
      (t.length>=4 && Math.abs(t.length-5)<=2 && editDistance(t,'foamy')<=2)
    ) || compact.includes('fauxmi');
    const gripLike=ts.some(t=>
      ['grip','grips','gripp','grippe','grippes','poignee','poignees'].includes(t) ||
      (t.length>=4 && (editDistance(t,'grip')<=1 || editDistance(t,'grips')<=2 || editDistance(t,'grippe')<=1))
    );
    const karimLike=(/\bkarim\b/.test(s) || /\bheritier\b/.test(s) || /\bkarim\s+heritier\b/.test(s));
    return !!((foamyLike && gripLike) || (karimLike && gripLike));
  }

  const JF_SEARCH_STOPWORDS=new Set([
    'trottinette','trottinettes','trot','scooter','freestyle','pour','de','du','des',

      .filter(w=>!JF_SEARCH_STOPWORDS.has(
        w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
    // Si le nettoyage ne laisse rien, on renvoie la categorie generale
    // plutot qu'une recherche vide.

  function parseBudgetChf(text){
    const s=normalize(text);
    const raw=String(text||'').replace(/['’]/g,'');
    const hasBudget=/\b(budget|max|maxi|maximal|franc|francs|chf|prix|price|budgett|budjet)\b/.test(s);
    let m=raw.match(/(?:CHF\s*)?(\d{2,4})(?:[.,]\d{1,2})?\s*(?:CHF|fr\.?|francs?)?/i);
    if(!m || !hasBudget) return null;
    const n=Number(m[1]);
    return Number.isFinite(n) && n>=30 && n<=3000 ? n : null;
  }

  function rideLevelFromText(text){
    const s=normalize(text);
    if(/\b(debutant|debutante|beginner|anfanger|anfänger|principiante|commence|debut)\b/.test(s)) return 'debutant';
    if(/\b(intermediaire|intermediate|mittelstufe|intermedio|progresse|progression)\b/.test(s)) return 'intermediaire';
    if(/\b(avance|avancee|advanced|fortgeschritten|esperto|expert|pro)\b/.test(s)) return 'avance';
    return null;
  }

  function scooterFitScore(model, bounds, style, level, budget){
    let score=0;
    if(bounds && Number.isFinite(model.height)){
      const [lo,hi]=bounds;
      // Small tolerance: real preference can vary a few centimetres.
      if(model.height>=lo && model.height<=hi) score+=55;
      else if(model.height>=lo-3 && model.height<=hi+3) score+=35;
      else {
        const dist=model.height<lo ? lo-model.height : model.height-hi;
        score-=Math.min(45, dist*6);
      }
    }
    if(style){
      if(model.style.includes(style)) score+=25;
      else if(model.style.includes('polyvalent')) score+=10;
      else score-=18;
    }
    if(level){
      if(model.level.includes(level)) score+=14;
      else score-=5;
    }
    if(Number.isFinite(budget)){
      if(model.priceValue<=budget) score+=18;
      else score-=Math.min(50,(model.priceValue-budget)/3);
    }
    return score;
  }

  function rideStyleFromText(text){

    if(/\b(polyvalent|allround|all round|mixte|les deux|beides|entrambi)\b/.test(s)) return 'polyvalent';

  function approximateWord(ts,target,maxDist=2){
    return ts.some(t=>{
      if(t===target || t.startsWith(target) || (target.startsWith(t) && t.length>=4)) return true;
      return t.length>=4 && Math.abs(t.length-target.length)<=maxDist && editDistance(t,target)<=maxDist;
    });
  }

  function asksForScooterModel(text){
    const s=normalize(text);
    const ts=s.split(/\s+/).filter(Boolean);
    const targets=['modele','model','modelle','conseiller','conseille','conseil','recommande','recommandation','propose','proposer','choisir','prendre','acheter'];
    const fuzzy=targets.some(w=>approximateWord(ts,w,2));
    const scooterWord='(?:trottinette|trotinette|trotinnette|scooter|scoot)';
    return fuzzy ||
      /\b(un|une|quel|quelle|lequel|laquelle)\s+(modele|model)\b/.test(s) ||
      /\b(quoi|laquelle|lequel)\s+(prendre|acheter|choisir)\b/.test(s) ||
      new RegExp('\\b(quel|quelle|laquelle|lequel|quoi)\\s+(?:' + scooterWord + ')\\b').test(s) ||
      new RegExp('\\b(?:' + scooterWord + ')\\b.*\\b(alor|alors|du coup|prendre|choisir|acheter|conseil|conseille|recommande)\\b').test(s) ||
      /\b(tu\s+as|t as|avez vous).*\b(modele|model|conseil|recommand)\b/.test(s);
  }

  function isContextAgreement(text){
    const s=normalize(text).replace(/\s+/g,' ').trim();
    if(!s || s.length>32) return false;

    // Natural ways to say “yes / gladly / sounds good” in the 4 RIDLY languages.
    // The small edit-distance tolerance catches common mobile typos such as
    // “avec plsir”, “volontier”, “bien sur”, “of corse”, etc.
    const phrases=[
      'oui','ouais','yes','yep','ok','okay','d accord','dac','go','vas y','vasy',
      'avec plaisir','oui avec plaisir','ok avec plaisir','d accord avec plaisir',
      'volontiers','bien sur','ca marche','sa marche','pas de souci','pourquoi pas',
      'ja','gerne','sehr gerne','klar','naturlich',
      'si','con piacere','volentieri','certo','va bene',
      'sure','of course','with pleasure','sounds good'
    ];
    return phrases.some(p=>{
      if(s===p) return true;
      const maxDist=p.length>=13?2:1;
      return Math.abs(s.length-p.length)<=maxDist && editDistance(s,p)<=maxDist;
    });
  }

  function detectScooterPart(text){
    const s=normalize(text);
    const ts=s.split(/\s+/).filter(Boolean);
    const has=(arr)=>ts.some(t=>arr.includes(t));
    if(has(['deck','plateau']) || ts.some(t=>editDistance(t,'deck')<=1)) return 'deck';
    if(has(['guidon','bar','bars','handlebar','handlebars','lenker','manubrio'])) return 'bar';
    if(has(['fourche','fork','forks','gabel','forcella'])) return 'fork';
    if(has(['roue','roues','wheel','wheels','rollen','ruote'])) return 'wheels';
    if(has(['grip','grips','poignee','poignees','manopole'])) return 'grips';
    if(has(['clamp','collier','scs','ihc','hic','ics'])) return 'clamp';
    if(has(['headset','jdd']) || /jeu de direction/.test(s)) return 'headset';
    if(has(['roulement','roulements','bearing','bearings','lager','cuscinetti'])) return 'bearings';
    if(has(['frein','brake','fender','bremse','freno'])) return 'brake';
    if(has(['peg','pegs'])) return 'pegs';
    return null;
  }

    const words=s.split(/\s+/).filter(Boolean);
    for(const e of riderEntries){
      const parts=normalize(riderDisplayName(e)).split(/\s+/).filter(Boolean);
      if(parts.length<2) continue;
      let matched=0;
      for(const rp of parts){
        if(words.some(w=>w===rp || editDistance(w,rp)<=1)) matched++;
      }
      if(matched===parts.length) return e;
    }
    return null;
  }

  /* =========================================================
     ÂGE / INSCRIPTION / PUBLICATION RIDLY
     - réponses basées sur l'entrée ridly-age de la base

  const AGE_WORD_VALUES = {
    // FR
    'dix':10,'onze':11,'douze':12,'treize':13,'quatorze':14,'quinze':15,'seize':16,
    'dix sept':17,'dix huit':18,'dix neuf':19,'vingt':20,
    // DE
    'zehn':10,'elf':11,'zwolf':12,'zwoelf':12,'dreizehn':13,'vierzehn':14,'funfzehn':15,
    'fuenfzehn':15,'sechzehn':16,'siebzehn':17,'achtzehn':18,'neunzehn':19,'zwanzig':20,
    // IT
    'dieci':10,'undici':11,'dodici':12,'tredici':13,'quattordici':14,'quindici':15,
    'sedici':16,'diciassette':17,'diciotto':18,'diciannove':19,'venti':20,
    // EN
    'ten':10,'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,
    'sixteen':16,'seventeen':17,'eighteen':18,'nineteen':19,'twenty':20
  };

  function extractAgeFromText(text){
    const s=normalize(text);

    // Strong numeric forms: "12 ans", "13 years", "14 anni", "15 Jahre".
    let m=s.match(/\b(\d{1,2})\s*(?:ans?|annees?|years?|yrs?|anni|anno|jahre|jahren)\b/);
    if(m){
      const n=Number(m[1]);
      if(n>=5 && n<=99) return n;
    }

    // Natural forms without the unit: "j'ai 12", "I am 12", "ich bin 12", "ho 12".
    m=s.match(/\b(?:j ai|jai|je suis|i am|im|i m|ich bin|ho)\s+(\d{1,2})\b/);
    if(m){
      const n=Number(m[1]);
      if(n>=5 && n<=99) return n;
    }

    // Number words: "j'ai douze ans", "twelve years old", etc.
    const keys=Object.keys(AGE_WORD_VALUES).sort((a,b)=>b.length-a.length);
    for(const key of keys){
      const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('\\b'+escaped+'\\b(?:\\s+(?:ans?|annees?|years?|old|anni|anno|jahre|jahren))?');
      if(re.test(s)){
        const hasAgeContext=/\b(ans?|age|annees?|years?|old|anni|anno|eta|jahre|jahren|alter|j ai|jai|je suis|i am|ich bin|ho)\b/.test(s);
        if(hasAgeContext) return AGE_WORD_VALUES[key];
      }
    }
    return null;
  }

  function ridlyLikeToken(t){
    if(['ridly','riley','ridley','ridli','rily','ridy'].includes(t)) return true;
    return t.length>=4 && t.length<=7 && editDistance(t,'ridly')<=2;
  }

  function deterministicVariant(list,seed){
    if(!Array.isArray(list) || !list.length) return '';
    const s=normalize(seed||'');
    let h=0;
    for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
    return list[h%list.length];
  }

  function fillAgeTemplate(tpl,values){
    return String(tpl||'')
      .replaceAll('{age}',String(values.age??''))
      .replaceAll('{minAge}',String(values.minAge))
      .replaceAll('{guardianAge}',String(values.guardianAge));
  }

  function answerRidlyAgeEligibility(text){
    const raw=String(text||'').trim();
    const s=normalize(raw);
    const ts=s.split(/\s+/).filter(Boolean);
    const entry=knowledge.find(e=>e.id==='ridly-age');
    if(!entry) return false;

    const hasRidly=ts.some(ridlyLikeToken) || conversationContext?.topic==='ridly';
    if(!hasRidly) return false;

    const age=extractAgeFromText(raw);
    const hasAgeWord=ts.some(t=>
      ['age','ans','an','annee','annees','jeune','mineur','minor','minimum','min','old','years','year','anni','anno','eta','jahre','alter'].includes(t) ||
      editDistance(t,'age')<=1
    );

    const registerIntent=intentTokenMatch(ts,[
      'inscrire','inscription','inscrit','inscrir','inscire','register','registration','signup',
      'anmelden','anmeldung','iscrivere','iscrizione','iscriverti','compte','account','profil','profile','creer','create'
    ],2) || /\b(m inscrire|me inscrire|je m inscris|sign up|creer un compte|create account)\b/.test(s);

    const publishIntent=intentTokenMatch(ts,[
      'publier','publie','publication','pubier','poster','poste','post','reel','real','story','feed','upload','share','publish','posten','veroffentlichen','pubblicare'
    ],2);

    const eligibilityIntent=/\b(peux|peut|possible|droit|autorise|autorisee|autoriser|minimum|minimal|trop jeune|quel age|quelle age|combien d ans|how old|minimum age|mindestalter|quanti anni|eta minima)\b/.test(s);

    if(!(age!==null || hasAgeWord) || !(registerIntent || publishIntent || eligibilityIntent)) return false;

    const minAge=Number(entry.policy?.minAge ?? 13);
    const guardianAge=Number(entry.policy?.guardianConsentUnder ?? 16);
    const packs=entry.responseVariants?.[language] || entry.responseVariants?.fr || {};

    let group='generic';
    if(age!==null){
      if(age<minAge) group='under';
      else if(age<guardianAge) group='allowedMinor';
      else group='allowedAdult';
    }

    let answer=deterministicVariant(packs[group],raw);
    if(!answer) answer=(entry.answer&&entry.answer[language])||entry.answer?.fr||entry.answer?.en||'';
    answer=fillAgeTemplate(answer,{age,minAge,guardianAge});

    addUser(raw);
    input.value='';
    setBusy(true);

  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const hasRecognition = !!SpeechRecognitionAPI;
  const micSecureOrigin = location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname);
  let micRecognition=null, micListening=false, micFinalSent=false, lastMicNoticeAt=0;

  const MIC_COPY={
    fr:{listen:'Je t’écoute…',unavailable:'Le micro vocal n’est pas disponible dans ce navigateur.',blocked:'Le micro est bloqué. Autorise le micro pour ce site dans le navigateur puis réessaie.',local:'Le micro est bien intégré 🎤 mais Android le bloque quand la page est ouverte depuis content://downloads. Teste cette même page sur RIDLY/Netlify en HTTPS : le navigateur pourra alors te demander l’autorisation du micro.',empty:'Je n’ai rien entendu 😅 Réessaie en parlant un peu plus près du téléphone.'},

  function addMicNoticeOnce(message){
    const now=Date.now();
    if(now-lastMicNoticeAt<5000) return;
    lastMicNoticeAt=now;
    addRidy(message);
  }

  function recognitionLocale(){
    return language==='fr'?'fr-CH':language==='de'?'de-CH':language==='it'?'it-CH':'en-GB';
  }

  function updateMicButton(){
    if(!micBtn) return;
    const t=MIC_COPY[language]||MIC_COPY.fr;
    micBtn.disabled=!hasRecognition;
    micBtn.classList.toggle('listening',micListening);
    if(micListening){
      micBtn.textContent='⏹';
      micBtn.title=t.listen;
      micBtn.setAttribute('aria-label',t.listen);
    }else{
      micBtn.textContent='🎤';
      micBtn.title=!hasRecognition ? t.unavailable : !micSecureOrigin ? t.local : (language==='de'?'Mit Lya sprechen':language==='it'?'Parla con Lya':language==='en'?'Talk to Lya':'Parler à Lya');
      micBtn.setAttribute('aria-label',micBtn.title);
    }
  }

  function setMicUi(on){
    micListening=!!on;
    if(micListening) ridyArt.classList.add('thinking');
    else ridyArt.classList.remove('thinking');
    updateMicButton();
  }

  function startMic(){
    const t=MIC_COPY[language]||MIC_COPY.fr;
    if(!hasRecognition){ addMicNoticeOnce(t.unavailable); return; }
    if(!micSecureOrigin){ addMicNoticeOnce(t.local); return; }
    if(micListening){ try{micRecognition&&micRecognition.stop();}catch(e){} return; }
    stopSpeaking();
    micFinalSent=false;
    try{
      const rec=new SpeechRecognitionAPI();
      micRecognition=rec;
      rec.lang=recognitionLocale();
      rec.interimResults=true;
      rec.continuous=false;
      rec.maxAlternatives=1;
      rec.onstart=()=>{ setMicUi(true); try{navigator.vibrate&&navigator.vibrate(25);}catch(e){} };
      rec.onresult=(event)=>{
        let interim='', finalText='';
        for(let i=event.resultIndex;i<event.results.length;i++){
          const txt=(event.results[i][0]&&event.results[i][0].transcript||'').trim();
          if(event.results[i].isFinal) finalText += (finalText?' ':'')+txt;
          else interim += (interim?' ':'')+txt;
        }
        const shown=(finalText||interim).trim();
        if(shown) input.value=shown;
        if(finalText.trim() && !micFinalSent){
          micFinalSent=true;
          const q=finalText.trim();
          input.value=q;
          setTimeout(()=>{ if(!busy) ask(q); },180);
        }
      };
      rec.onerror=(event)=>{
        setMicUi(false);
        if(event && (event.error==='not-allowed'||event.error==='service-not-allowed')) addMicNoticeOnce(micSecureOrigin?t.blocked:t.local);
        else if(event && event.error==='no-speech') addMicNoticeOnce(t.empty);
      };
      rec.onend=()=>{ setMicUi(false); micRecognition=null; };
      rec.start();
    }catch(e){
      setMicUi(false);
      addMicNoticeOnce(t.unavailable);
    }
  }

  const FAILURE_KEY='lya_failed_questions_v61';
  const FAILURE_MAX=300;

  function readFailures(){
    try{ const x=JSON.parse(localStorage.getItem(FAILURE_KEY)||'[]'); return Array.isArray(x)?x:[]; }catch(e){ return []; }
  }
  function writeFailures(rows){
    try{ localStorage.setItem(FAILURE_KEY,JSON.stringify(rows.slice(0,FAILURE_MAX))); }catch(e){}
  }
  function logRoutingFailure(question, ranked=[]){
    const q=String(question||'').trim(); if(!q) return;
    const now=new Date().toISOString();
    const key=normalize(q);
    const rows=readFailures();
    const existing=rows.find(x=>x.key===key && x.lang===language);
    const top3=(ranked||[]).slice(0,3).map(x=>({id:x.e&&x.e.id||'',score:Math.round((x.score||0)*100)/100}));
    const ctx={topic:conversationContext.topic||'',entryId:conversationContext.entryId||'',intent:conversationContext.intent||''};
    if(existing){
      existing.count=(existing.count||1)+1; existing.lastSeen=now; existing.top3=top3; existing.context=ctx;
      rows.splice(rows.indexOf(existing),1); rows.unshift(existing);
    }else{
      rows.unshift({key,question:q,lang:language,count:1,firstSeen:now,lastSeen:now,top3,context:ctx});
    }
    writeFailures(rows);
  }

  function downloadFailures(){
    const rows=readFailures();
    const payload={exportedAt:new Date().toISOString(),version:'V66',count:rows.length,failures:rows};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='lya-echecs-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),800);
  }

           language==='en'?['Lya diagnostics','Questions Lya missed – stored only on this device.','Export failures','Clear','No failed questions yet.','times']:
           ['Diagnostic Lya','Questions mal comprises – enregistrées uniquement sur cet appareil.','Exporter les échecs','Effacer','Aucune question ratée pour le moment.','fois'];
  }

  function ensureDiag(){
    let root=document.getElementById('lyaDiag'); if(root) return root;
    root=document.createElement('div'); root.id='lyaDiag'; root.className='lya-diag';
    root.innerHTML='<div class="lya-diag-sheet" role="dialog" aria-modal="true"><div class="lya-diag-head"><div><div class="lya-diag-title" id="lyaDiagTitle"></div><div class="lya-diag-sub" id="lyaDiagSub"></div></div><button class="lya-diag-close" type="button" aria-label="Fermer">×</button></div><div class="lya-diag-actions"><button class="primary" id="lyaDiagExport" type="button"></button><button id="lyaDiagClear" type="button"></button></div><div class="lya-diag-list" id="lyaDiagList"></div></div>';
    document.body.appendChild(root);
    root.addEventListener('click',e=>{if(e.target===root)root.classList.remove('open')});
    root.querySelector('.lya-diag-close').addEventListener('click',()=>root.classList.remove('open'));
    root.querySelector('#lyaDiagExport').addEventListener('click',downloadFailures);
    root.querySelector('#lyaDiagClear').addEventListener('click',()=>{writeFailures([]);renderDiag();});

  }
  function renderDiag(){
    const root=ensureDiag(), L=diagLabels(), rows=readFailures();
    root.querySelector('#lyaDiagTitle').textContent=L[0]+' · '+rows.length;
    root.querySelector('#lyaDiagSub').textContent=L[1];
    root.querySelector('#lyaDiagExport').textContent=L[2];
    root.querySelector('#lyaDiagClear').textContent=L[3];
    const list=root.querySelector('#lyaDiagList'); list.innerHTML='';
    if(!rows.length){ list.innerHTML='<div class="lya-diag-empty">'+L[4]+'</div>'; return; }
    rows.slice(0,40).forEach(r=>{
      const item=document.createElement('div'); item.className='lya-diag-item';
      const top=(r.top3||[]).map(x=>x.id+' ('+x.score+')').join(' · ');
      item.innerHTML='<div class="lya-diag-q"></div><div class="lya-diag-meta"></div>';
      item.querySelector('.lya-diag-q').textContent=r.question;
      item.querySelector('.lya-diag-meta').textContent=(r.lang||'').toUpperCase()+' · '+(r.count||1)+' '+L[5]+(top?' · '+top:'');
      list.appendChild(item);
    });
  }
  function openDiag(){ const root=ensureDiag(); renderDiag(); root.classList.add('open'); }

  window.LYA_FAILURES={list:readFailures,export:downloadFailures,clear:()=>writeFailures([]),open:openDiag};

  // Reprend le routeur normal quand la recherche de spots n'a rien donne.
  let _spotFallback = false;
  let _membreFallback = false;
  let _feedFallback = false;
  function askFallback(q){
    _spotFallback = true;
    try { ask(q); } finally { _spotFallback = false; }
  }

  function ask(q){
    const clean=String(q||'').trim();
    if(!clean||busy) return;

    // RIDLY_LYA_GARDE_FOU
    // Contenu sexuel : verifie AVANT tout autre routeur. Sinon « tu me suces ? »
    // tombe dans la FAQ, qui repond a cote — et une reponse commencant par
    // « Oui. » ressemble a un consentement.
    if(answerBoundary(clean)) return;

    // Relances courtes : elles se rapportent au dernier sujet, donc elles
    // doivent passer avant la recherche, qui ne comprendrait pas « et apres ? ».
    if(answerRelance(clean)) return;

    // Spots : lecture en direct de la table Supabase. Asynchrone, donc on
    // sort tout de suite et la reponse arrive quand la requete revient.
    if(!_spotFallback && detectSpotIntent(clean)){
      answerSpotsLive(clean).then(handled => { if(!handled) askFallback(clean); });
      return;
    }


    // GAME OF SCOOT: persistent local match state.
    if(answerScootGame(clean)) return;

    // Short confirmations such as "Go" use the current conversation context.
    if(answerContextualGo(clean)) return;

    // V69: explicit federation / Swiss Skate questions override old conversation context.
    // This prevents « C'est qui Swiss Skate ? » after an SSA discussion from being answered as SSA.
    const _swissSkateExplicit=/(^|\s)(swiss ?skate|swissskate|swiss ?ket|swissket|swiss sket)(\s|$)/.test(normalize(clean));
    if(_swissSkateExplicit && answerV53EncyclopediaIntent(clean)) return;

    // Contextual social/site links for the entity just discussed.
    // Example: SSA -> « ils ont un insta ? ».
    if(answerEntityLinkFollowUp(clean)) return;

    // V56 encyclopedia: strong history, event and Swiss-shop names get deterministic routing.
    if(answerV53EncyclopediaIntent(clean)) return;

    // A short follow-up containing only the rider's height/style/budget must keep
    // the scooter recommendation context. Example: "je f ai 1m80" after Lya asked
    // for the rider's size must never be mistaken for a rider name or biography.
    if(answerScooterModelFollowUp(clean)) return;

    // Person conversation flow: clarification can be resolved by surname only.
    // Example: "joel" -> "Joel Ingold / Joël Meuwly ?" -> "meuwly".
    if(answerPendingPersonChoice(clean)) return;
    if(answerDoYouKnowPerson(clean)) return;
    if(answerPendingPersonConfirmation(clean)) return;
    if(answerPersonPronounInfo(clean)) return;
    if(answerNaturalPersonFollowUp(clean)) return;


    // RIDLY age / registration / publishing eligibility.
    // Must run before publication steps and rider-name matching.
    if(answerRidlyAgeEligibility(clean)) return;

    // RIDLY publishing flow: Reel / Story / feed, including common typos.
    if(answerRidlyPublishIntent(clean)) return;

    // Course WhatsApp links.
    if(answerCourseWhatsApp(clean)) return;

    // Product names and common phonetic/mobile typos must be understood seriously.
    // Example: “faux mi grippe” => Foamy Grips.
    if(answerFoamyGrips(clean)) return;

    // Natural beginner questions should never fall into a random rider biography.
    if(answerBeginnerScooterIntent(clean)) return;

    // If the rider switches from a complete scooter to a specific part (e.g. “juste le deck”),
    // keep the previous fit context but change product type instead of falling back to generic sizing.
    if(answerScooterPartProductFollowUp(clean)) return;

    // Keep the JF recommendation context alive: “oui”, “tu as le lien ?”, etc.
    if(answerScooterLinkOrConfirm(clean)) return;

    // Product recommendation has priority when the rider asks which complete scooter to choose.
    // It keeps height/style/budget across messages and can link directly to JF Ride Shop.
    if(answerScooterModelFollowUp(clean)) return;

    // Material sizing intents are resolved before person-name detection.
    if(answerScooterSizeChoice(clean)) return;
    if(answerDeckSizing(clean)) return;
    if(answerBarHeight(clean)) return;

    // Contextual reasoning: understands follow-up questions.
    if(answerSmartContext(clean)) return;

    // Greetings / thanks / basic conversation.
    if(answerSmallTalk(clean)) return;

    // Natural follow-up questions about the last rider or a loosely typed rider name.
    if(answerRiderFollowUp(clean)) return;

    // A single first name is ambiguous: ask for the full name.
    if(answerSingleFirstName(clean)) return;

    // A full rider name must match the full name, not just the first name.
    // Membres RIDLY : verifie AVANT de declarer un nom inconnu. Les 91
    // entrees « Riders » sont des pros codes en dur ; un membre de l'app
    // n'y figure evidemment pas. Asynchrone, donc on sort tout de suite.
    // Feed en direct : asynchrone, on sort tout de suite.
    if(!_feedFallback && detectFeedIntent(clean)){
      answerFeedLive(clean).then(traite => {
        if(!traite && !_feedFallback){
          _feedFallback = true;
          try { ask(clean); } finally { _feedFallback = false; }
        }
      });
      return;
    }

    if(answerMembreSansNom(clean)) return;

    if(!_membreFallback && detectMembreIntent(clean)){
      answerMembreRidly(clean).then(traite => {
        if(!traite && !_membreFallback){
          _membreFallback = true;
          try { ask(clean); } finally { _membreFallback = false; }
        }
      });
      return;
    }

    if(answerUnknownRiderName(clean)) return;

    if(!knowledge.length) return;
    addUser(clean); input.value=''; setBusy(true);
    setTimeout(()=>{
      const results=rank(clean); const top=results[0];
      const second=results[1]||{score:0};

      /* ===== RIDLY_LYA_CONFIANCE =====
         Le score absolu ne distingue pas une bonne reponse d'une mauvaise :
         « Ok sylf? » marquait 13 et sortait un rider au hasard, alors qu'une
         vraie question marque 30 a 124. Ce qui discrimine, c'est l'ECART avec
         la deuxieme entree : 12 a 115 pour une bonne reponse, 0 a 2 pour un
         match douteux. En cas d'egalite, on propose au lieu d'affirmer. */
      const ecart = top ? top.score - second.score : 0;
      const sur   = top && top.score >= 5.5 && (ecart >= 3 || top.score >= 25);

      if(top && top.score >= 5.5 && !sur){
        const choix = results.slice(0,3).filter(r => r.score >= 5.5);
        addRidy("Je ne suis pas sûre de ce que tu cherches. Tu veux dire :");
        const bulle = messages.lastElementChild?.querySelector('.bubble');
        if(bulle){
          const wrap = document.createElement('div');
          wrap.className = 'smart-actions';
          choix.forEach(c => {
            const q = (c.e.questions && (c.e.questions[language] || c.e.questions.fr)) || c.e.id;
            addSmartButton(wrap, q.replace(/\s*\?\s*$/, ''), () => {
              const rep = (c.e.answer && (c.e.answer[language] || c.e.answer.fr)) || '';
              rememberEntry(c.e, clean, 'knowledge');
              addRidy(rep, c.e);
              ajouterSuiteTrick(c.e);
            });
          });
          bulle.appendChild(wrap);
        }
        setBusy(false); input.focus();
        return;
      }

      if(sur){
        const answer=(top.e.answer&&top.e.answer[language])||top.e.answer.fr||top.e.answer.en;
        rememberEntry(top.e,clean,'knowledge');
        addRidy(answer,top.e);
        ajouterSuiteTrick(top.e);

        // Useful call-to-action when the matched topic is courses.
        if(topicFromEntry(top.e)==='courses'){
          const lastBubble=messages.lastElementChild?.querySelector('.bubble');
          if(lastBubble){
            const t=SMART_COPY[language]||SMART_COPY.en;
            const wrap=document.createElement('div'); wrap.className='smart-actions';
            addSmartButton(wrap,t.coursesBtn,null,'https://rsl-swiss.ch/cours');
            lastBubble.appendChild(wrap);
          }
        }
      } else {
        logRoutingFailure(clean,results);
        showSuggestions(results.filter(x=>x.score>0));
      }
      setBusy(false); input.focus();
    },260);
  }

  function resetChat(){
    stopSpeaking();
    conversationContext={topic:null,entryId:null,city:null,intent:null,lastUser:'',riderHeightCm:null,scooterHeightRange:null,rideStyle:null,rideLevel:null,budgetChf:null,shoeSize:null,wantedPart:null,lastRecommendedModel:null,lastRecommendedUrl:null,awaitingScooterDetails:false,pendingPerson:'',pendingPersonConfirm:false,pendingPeople:[],pendingFirstName:'',updatedAt:0};

  function applyLanguage(lang,reset=true){
    if(!copy[lang]) lang='en'; language=lang; localStorage.setItem('ridy_language',lang); document.documentElement.lang=lang;
    const t=copy[lang];
    document.getElementById('eyebrow').textContent=t.eyebrow; document.getElementById('heroTitle').innerHTML=t.title; document.getElementById('heroLead').innerHTML=t.lead;
    document.getElementById('assistantSub').textContent=t.assistantSub; document.getElementById('quickLabel').textContent=t.quickLabel;

    input.placeholder=t.placeholder; input.setAttribute('aria-label',t.placeholder); sendBtn.textContent=t.send; clearBtn.textContent=t.newChat; document.getElementById('note').textContent=t.note;
    langButtons.forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); ridyStatus.textContent=knowledge.length?t.online(knowledge.length):t.loading;
    updateVoiceButton();
    updateMicButton();
    if(voiceSettingsBtn){ const vt=lang==='de'?'Stimme wählen':lang==='it'?'Scegli la voce':lang==='en'?'Choose voice':'Choisir la voix'; voiceSettingsBtn.title=vt; voiceSettingsBtn.setAttribute('aria-label',vt); }
    if(reset&&knowledge.length) resetChat();
  }

  form.addEventListener('submit',e=>{e.preventDefault();ask(input.value)});

  // Short click = new chat. Long press = local diagnostics / missed questions.
  let clearPressTimer=null, clearLongPress=false;
  clearBtn.addEventListener('pointerdown',()=>{
    clearLongPress=false; clearTimeout(clearPressTimer);
    clearPressTimer=setTimeout(()=>{clearLongPress=true; openDiag(); try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}},700);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>clearBtn.addEventListener(ev,()=>clearTimeout(clearPressTimer)));
  clearBtn.addEventListener('click',e=>{
    if(clearLongPress){e.preventDefault();clearLongPress=false;return;}
    resetChat();
  });
  clearBtn.title=(clearBtn.title||'')+' · Appui long : diagnostic Lya';

  if(voiceSettingsBtn){
    voiceSettingsBtn.addEventListener('click',openVoicePicker);
  }

  if(voiceBtn){
    voiceBtn.addEventListener('click',toggleVoice);
  }

  if(micBtn){
    micBtn.addEventListener('click',startMic);
    updateMicButton();
  }
  const quickItems=[
    {id:'ridly-map', key:'spots'},
    {id:'rsl-next-event', key:'events'},
    {id:'scooter-parts', key:'gear'},
    {id:'ridly-overview', key:'ridly'}
  ];
  quickButtons.forEach((btn,i)=>btn.addEventListener('click',()=>{
    if(btn.dataset.action==='whatsapp'){
      showWhatsAppGroups(['montreux','vidy','yverdon','martigny']);
      return;
    }
    const item=quickItems[i];
    if(!item) return;
    const entry=knowledge.find(x=>x.id===item.id);
    if(entry) answerEntry(entry,copy[language].category[item.key]);
  }));
  langButtons.forEach(btn=>btn.addEventListener('click',()=>{if(!busy)applyLanguage(btn.dataset.lang,true)}));

  applyLanguage(language,false);

  // Signale les messages non lus une fois la page prete.
  accueilMessages();

  // Base de connaissances : chargee depuis js/lya-knowledge.js.
  // Les donnees sont hors du code pour pouvoir corriger une reponse
  // sans toucher au moteur.
  knowledge = Array.isArray(window.RIDLY_KNOWLEDGE) ? window.RIDLY_KNOWLEDGE : [];
  if(!knowledge.length) console.error("[Lya] base de connaissances vide ou non chargee.");
  

  // V68 — Swiss Skate officiel : fédération suisse, jamais confondue avec SSA.
  

  // V65 — Swiss Scoot Academy + transparence générale des académies/clubs payants.
  // Principe : rester sur les faits publics vérifiables, distinguer partenaire / association / fédération / statut non vérifié.
  
    

  /* RIDLY V53 — encyclopédie historique + shops Suisse romande */
  

  // V53 complément encyclopédie : matériel, sécurité et pionniers européens.
  
  applyLanguage(language,true);
})();

<script>
(() => {
  const hero = document.getElementById('ridyArt');
  const overlay = document.getElementById('ridySpriteOverlay');
  const frames = [...document.querySelectorAll('.sprite-frame')];
const badgeEl = document.getElementById('spriteBadge');
  if(!hero || !overlay || !frames.length) return;

  let playing = false;
  let lastIndex = -1;

  const tricks = [
    {
      frames:[0,1,2,3,11,15],
      timings:[180,120,100,120,130,190]
    },
    {
      frames:[4,5,6,7,11,15],
      timings:[170,115,95,110,135,190]
    },
    {
      frames:[8,9,10,11,15],
      timings:[180,120,105,125,190]
    },
    {
      frames:[12,13,14,15],
      timings:[180,125,125,210]
    }
  ];

  const badgeText={
    fr:'SURPRISE',
    de:'SURPRISE',
    it:'SORPRESA',
    en:'SURPRISE'
  };

  const langNow=()=>{
    if(typeof language!=='undefined') return language;
    const active=document.querySelector('.lang.active');
    return (active?.dataset?.lang||'en').toLowerCase();
  };

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const resetFrames=()=>frames.forEach(f=>f.classList.remove('active'));

  function pickTrick(){
    let idx=Math.floor(Math.random()*tricks.length);
    if(tricks.length>1 && idx===lastIndex) idx=(idx+1)%tricks.length;
    lastIndex=idx;
    return tricks[idx];
  }

  async function playSingleTrick(){
    if(playing) return;
    playing=true;

    const lang=langNow();
    const trick=pickTrick();

    badgeEl.textContent=badgeText[lang]||badgeText.en;
document.body.classList.add('ridy-sprite-playing');
    overlay.setAttribute('aria-hidden','false');
    overlay.classList.add('active');

    resetFrames();

    for(let i=0;i<trick.frames.length;i++){
      resetFrames();
      const frameIndex=trick.frames[i];
      if(frames[frameIndex]) frames[frameIndex].classList.add('active');
      await sleep(trick.timings[i]||100);
    }

    await sleep(180);
    resetFrames();

    const last=trick.frames[trick.frames.length-1];
    if(frames[last]) frames[last].classList.add('active');

    await sleep(120);
    resetFrames();

    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden','true');
    document.body.classList.remove('ridy-sprite-playing');
    playing=false;
  }

  hero.addEventListener('click',playSingleTrick);
  hero.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      playSingleTrick();
    }
  });

  hero.setAttribute('tabindex','0');
  hero.setAttribute('role','button');
  hero.setAttribute('aria-label','Play one random Lya trick');
})();
</script>

<script>
/* Bouton retour Lya : revient d'ou l'utilisateur vient s'il s'agit
   d'une page RIDLY, sinon retombe sur le feed. */
(function(){
  var link = document.getElementById('backLink');
  if(!link) return;

  var PAGES = ['feed','ou_rider','recherche','profil_ou_rider','spot',
               'classement','games','chat','chat1v1','ajouter'];

  var ref = '';
  try{
    if(document.referrer){
      var u = new URL(document.referrer);
      if(u.origin === location.origin) ref = u.pathname;
    }
  }catch(e){}

  var known = ref && PAGES.some(function(n){
    return ref === '/'+n || ref === '/'+n+'.html';
  });

  if(known) link.setAttribute('href', ref);

  link.addEventListener('click', function(e){
    if(known && history.length > 1){
      e.preventDefault();
      history.back();
    }
  });
})();
</script>
