<!doctype html>
<!-- RIDLY Lya V63 — micro HTTPS + failure logger -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <!-- RIDLY_PWA_HEAD_BEGIN -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="192x192" href="/image/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/image/icon-512.png">
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RIDLY">
  <meta name="format-detection" content="telephone=no">
  <!-- RIDLY_PWA_HEAD_END -->

  <!-- RIDLY LYA V59 voix synthèse vocale 2026-08-27 -->
<title>Lya — RIDLY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --red:#cc0000;
      --red2:#e51010;
      --bg:#080808;
      --panel:#101010;
      --panel2:#0b0b0b;
      --text:#f2f2f2;
      --muted:#858585;
      --border:rgba(255,255,255,.10);
      --border2:rgba(255,255,255,.16);
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100svh;
      color:var(--text);
      font-family:"Barlow Condensed",Arial,sans-serif;
      background:
        radial-gradient(700px 500px at 20% 8%,rgba(204,0,0,.18),transparent 62%),
        radial-gradient(700px 500px at 90% 90%,rgba(204,0,0,.08),transparent 65%),
        var(--bg);
    }

    button,input{font:inherit}
    a{color:inherit}

    header{
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 clamp(16px,4vw,52px);
      border-bottom:1px solid var(--border);
      background:rgba(8,8,8,.86);
      backdrop-filter:blur(16px);
      position:sticky;
      top:0;
      z-index:30;
    }

    .brand{display:flex;align-items:center;text-decoration:none}
    .brand img{
      width:112px;
      height:54px;
      object-fit:contain;
      mix-blend-mode:screen;
    }

    .back{
      text-decoration:none;
      color:#858585;
      text-transform:uppercase;
      letter-spacing:.1em;
      font-weight:800;
      font-size:12px;
      transition:.2s;
    }
    .back:hover{color:#fff}

    main{
      width:min(1180px,calc(100% - 28px));
      min-height:calc(100svh - 72px);
      margin:auto;
      padding:36px 0 48px;
      display:grid;
      grid-template-columns:.82fr 1.18fr;
      gap:26px;
      align-items:stretch;
    }

    .ridy-side,.chat-card{
      border:1px solid var(--border);
      border-radius:22px;
      background:linear-gradient(145deg,rgba(17,17,17,.97),rgba(5,5,5,.98));
      box-shadow:0 32px 90px rgba(0,0,0,.38);
      overflow:hidden;
      position:relative;
    }

    .ridy-side::before{
      content:"";
      position:absolute;
      width:300px;height:300px;
      left:-130px;top:-120px;
      border-radius:50%;
      background:rgba(204,0,0,.16);
      filter:blur(65px);
      pointer-events:none;
    }

    .ridy-side{
      min-height:660px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:28px 28px 0;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      width:max-content;
      padding:7px 11px;
      border:1px solid var(--border);
      border-radius:999px;
      color:#a0a0a0;
      font-size:11px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      background:rgba(255,255,255,.025);
    }
    .eyebrow::before{
      content:"";
      width:7px;height:7px;border-radius:50%;
      background:var(--red2);
      box-shadow:0 0 13px var(--red2);
    }

    h1{
      margin:19px 0 8px;
      font-family:"Bebas Neue",sans-serif;
      font-size:clamp(58px,6vw,88px);
      line-height:.86;
      font-weight:400;
      letter-spacing:.02em;
    }
    h1 span{color:var(--red2)}

    .lead{
      margin:0;
      max-width:370px;
      color:#8f8f8f;
      font-size:20px;
      line-height:1.16;
    }
    .lead strong{color:#fff}

    .ridy-art{
      position:relative;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      height:430px;
      margin-top:18px;
      overflow:visible;
    }
    .ridy-art::before{
      content:"";
      position:absolute;
      bottom:20px;
      width:280px;height:210px;
      border-radius:50%;
      background:rgba(204,0,0,.16);
      filter:blur(70px);
    }
    .ridy-art img{
      position:relative;
      z-index:2;
      display:block;
      height:430px;
      width:auto;
      max-width:100%;
      object-fit:contain;
      object-position:bottom center;
      filter:
        brightness(1.08)
        contrast(1.05)
        drop-shadow(0 0 24px rgba(204,0,0,.28))
        drop-shadow(0 18px 38px rgba(0,0,0,.75));
      animation:ridyFloat 4.6s ease-in-out infinite;
      transform-origin:bottom center;
    }
    .ridy-art.thinking img{animation:ridyThink .65s ease-in-out infinite alternate}

    @keyframes ridyFloat{
      0%,100%{transform:translateY(0) rotate(0deg)}
      50%{transform:translateY(-7px) rotate(.35deg)}
    }
    @keyframes ridyThink{
      from{transform:translateY(-2px) scale(1)}
      to{transform:translateY(-7px) scale(1.008)}
    }

    .status-pill{
      position:absolute;
      z-index:3;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:7px;
      padding:7px 12px;
      border:1px solid var(--border2);
      border-radius:999px;
      background:rgba(0,0,0,.74);
      backdrop-filter:blur(10px);
      color:#d5d5d5;
      white-space:nowrap;
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.09em;
    }
    .status-pill i{width:7px;height:7px;border-radius:50%;background:#38d46a;box-shadow:0 0 10px #38d46a}

    .chat-card{
      min-height:660px;
      display:flex;
      flex-direction:column;
    }

    .chat-head{
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      padding:18px 20px;
      border-bottom:1px solid var(--border);
    }
    .chat-title{display:flex;align-items:center;gap:12px}
    .mini-avatar{
      width:44px;height:44px;border-radius:14px;
      overflow:hidden;border:1px solid rgba(204,0,0,.45);
      background:#050505;
      flex:0 0 auto;
    }
    .mini-avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
    .chat-title strong{display:block;font-size:18px;line-height:1}
    .chat-title span{display:block;color:#747474;font-size:12px;margin-top:4px}
    .clear-btn{
      border:1px solid var(--border);
      background:#0b0b0b;color:#777;
      border-radius:8px;padding:8px 10px;
      font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
      cursor:pointer;
    }
    .clear-btn:hover{color:#fff;border-color:rgba(204,0,0,.5)}

    .chat-head-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}
    .voice-btn{
      width:38px;height:38px;border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
      border:1px solid var(--border);background:#0b0b0b;color:#8a8a8a;
      cursor:pointer;font-size:17px;line-height:1;transition:.16s;
    }
    .voice-btn:hover{color:#fff;border-color:rgba(204,0,0,.5)}
    .voice-btn.active{color:#fff;background:rgba(204,0,0,.18);border-color:rgba(229,16,16,.78);box-shadow:0 0 18px rgba(204,0,0,.14)}
    .voice-btn:disabled{opacity:.38;cursor:not-allowed}

    .speak-again{
      margin-top:9px;margin-left:auto;width:30px;height:28px;border-radius:8px;
      border:1px solid rgba(255,255,255,.10);background:#0a0a0a;color:#777;
      display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;
      transition:.15s;
    }
    .speak-again:hover{color:#fff;border-color:rgba(204,0,0,.55)}
    .speak-again.speaking{color:#fff;border-color:var(--red2);background:rgba(204,0,0,.16)}

    .ridy-art.speaking img{animation:lyaVoiceFloat .72s ease-in-out infinite alternate;filter:drop-shadow(0 0 16px rgba(229,16,16,.24))}
    .ridy-art.speaking::after{animation:ridyGroundPulse .72s ease-in-out infinite alternate}
    .mini-avatar.speaking{border-color:rgba(229,16,16,.95);box-shadow:0 0 18px rgba(204,0,0,.32)}
    @keyframes lyaVoiceFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-2px) scale(1.006)}}

    .messages{
      flex:1;
      min-height:360px;
      padding:22px 20px 12px;
      overflow:auto;
      scroll-behavior:smooth;
    }

    .msg{display:flex;margin:0 0 13px}
    .msg.user{justify-content:flex-end}
    .bubble{
      max-width:min(78%,560px);
      padding:11px 14px;
      border-radius:14px;
      font-size:16px;
      line-height:1.25;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .msg.ridy .bubble{
      color:#ddd;
      background:#111;
      border:1px solid var(--border);
      border-bottom-left-radius:4px;
    }
    .msg.user .bubble{
      color:#fff;
      background:var(--red);
      border:1px solid var(--red2);
      border-bottom-right-radius:4px;
    }

    .thinking-bubble{display:inline-flex;align-items:center;gap:5px;min-width:58px}
    .thinking-bubble span{
      width:6px;height:6px;border-radius:50%;background:#aaa;
      animation:dot 1s ease-in-out infinite;
    }
    .thinking-bubble span:nth-child(2){animation-delay:.15s}
    .thinking-bubble span:nth-child(3){animation-delay:.3s}
    @keyframes dot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

    .quick-wrap{padding:0 20px 14px}
    .quick-label{font-size:11px;color:#676767;text-transform:uppercase;font-weight:800;letter-spacing:.12em;margin-bottom:8px}
    .quick-actions{display:flex;gap:7px;flex-wrap:wrap}
    .quick{
      border:1px solid var(--border2);
      background:#0c0c0c;color:#c8c8c8;
      border-radius:999px;padding:8px 11px;
      cursor:pointer;font-size:13px;font-weight:700;
      transition:.16s;
    }
    .quick:hover{border-color:rgba(204,0,0,.65);color:#fff;transform:translateY(-1px)}

    .composer{
      display:flex;
      gap:9px;
      padding:15px;
      border-top:1px solid var(--border);
      background:rgba(5,5,5,.88);
    }
    .composer input{
      flex:1;min-width:0;height:49px;
      padding:0 15px;
      border:1px solid var(--border2);
      border-radius:10px;
      outline:none;
      color:#fff;background:#090909;
      font-size:16px;
    }
    .composer input:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(204,0,0,.13)}
    .composer input::placeholder{color:#4f4f4f}
    .send{
      min-width:92px;
      border:1px solid var(--red);
      border-radius:10px;
      background:var(--red);
      color:#fff;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.06em;
      cursor:pointer;
      transition:.18s;
    }
    .send:hover{background:var(--red2);transform:translateY(-1px)}
    .send:disabled{opacity:.5;cursor:default;transform:none}

    .note{
      padding:0 20px 15px;
      color:#555;
      font-size:11px;
      text-align:center;
    }



    .answer-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08)}
    .source-link,.topic-btn{
      display:inline-flex;align-items:center;gap:6px;text-decoration:none;
      border:1px solid var(--border2);border-radius:999px;padding:6px 9px;
      background:#090909;color:#c9c9c9;font-size:11px;font-weight:800;
      letter-spacing:.04em;cursor:pointer;
    }
    .source-link:hover,.topic-btn:hover{color:#fff;border-color:rgba(204,0,0,.7)}
    .dynamic-tag{display:inline-flex;align-items:center;border:1px solid rgba(245,158,11,.28);border-radius:999px;padding:6px 9px;color:#e6aa48;font-size:11px;font-weight:800;background:rgba(245,158,11,.06)}
    .suggestions{display:flex;flex-direction:column;gap:7px;margin-top:9px}
    .topic-btn{text-align:left;border-radius:10px;padding:9px 10px;width:100%}
    .kb-count{color:#555;font-size:10px;margin-top:4px;text-transform:uppercase;letter-spacing:.1em}

    .lang-switch{
      display:flex;
      align-items:center;
      gap:5px;
      padding:4px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#0a0a0a;
    }
    .lang-btn{
      min-width:34px;
      height:30px;
      padding:0 8px;
      border:0;
      border-radius:7px;
      background:transparent;
      color:#777;
      font-size:11px;
      font-weight:900;
      letter-spacing:.06em;
      cursor:pointer;
      transition:.16s;
    }
    .lang-btn:hover{color:#fff;background:#151515}
    .lang-btn.active{color:#fff;background:var(--red)}
    .head-actions{display:flex;align-items:center;gap:12px}


    @keyframes ridyAlive{
      0%,100%{transform:translateY(0) rotate(-.4deg) scale(1)}
      25%{transform:translateY(-2px) rotate(.3deg) scale(1.008)}
      50%{transform:translateY(-5px) rotate(.8deg) scale(1.014)}
      75%{transform:translateY(-2px) rotate(.1deg) scale(1.007)}
    }

    @keyframes ridyGroundPulse{
      0%,100%{transform:scaleX(.92);opacity:.35}
      50%{transform:scaleX(1.08);opacity:.62}
    }

    .ridy-art.thinking img,
    .thinking .ridy-art img{
      animation:ridyThinking .8s ease-in-out infinite alternate;
    }

    @keyframes ridyThinking{
      from{transform:translateY(0) rotate(-1deg) scale(1)}
      to{transform:translateY(-4px) rotate(1deg) scale(1.025)}
    }

    @media(max-width:820px){
      html,body{
        width:100%;
        height:100%;
        min-height:100%;
        overflow:hidden;
      }

      body{
        min-height:100dvh;
        background:
          radial-gradient(420px 260px at 15% 0%,rgba(204,0,0,.18),transparent 66%),
          var(--bg);
      }

      header{
        height:58px;
        min-height:58px;
        padding:
          max(6px,env(safe-area-inset-top))
          10px
          6px;
        gap:8px;
        position:relative;
      }

      .brand{
        flex:0 0 auto;
      }

      .brand img{
        width:78px;
        height:40px;
      }

      .head-actions{
        min-width:0;
        flex:1;
        justify-content:flex-end;
        gap:6px;
      }

      .lang-switch{
        gap:2px;
        padding:3px;
        border-radius:9px;
        flex:0 1 auto;
      }

      .lang-btn{
        min-width:28px;
        width:28px;
        height:28px;
        padding:0;
        font-size:10px;
        border-radius:6px;
      }

      .back{
        width:32px;
        height:32px;
        flex:0 0 32px;
        display:grid;
        place-items:center;
        border:1px solid var(--border);
        border-radius:8px;
        background:#0a0a0a;
        color:#aaa;
        font-size:0;
      }

      .back::before{
        content:"←";
        font-size:17px;
        line-height:1;
      }

      main{
        width:100%;
        height:calc(100dvh - 58px);
        min-height:0;
        margin:0;
        padding:8px 8px max(8px,env(safe-area-inset-bottom));
        display:flex;
        flex-direction:column;
        gap:8px;
        overflow:hidden;
      }

      .ridy-side,
      .chat-card{
        border-radius:16px;
      }

      /* Compact assistant banner: everything remains visible without eating the screen */
      .ridy-side{
        flex:0 0 178px;
        min-height:178px;
        height:178px;
        margin:0;
        padding:14px 172px 12px 14px;
        overflow:hidden;
        display:block;
        isolation:isolate;
      }

      .ridy-side::before{
        width:190px;
        height:190px;
        left:auto;
        right:-70px;
        top:-70px;
        filter:blur(44px);
      }

      .eyebrow{
        padding:5px 8px;
        gap:5px;
        font-size:9px;
        letter-spacing:.11em;
      }

      .eyebrow::before{
        width:5px;
        height:5px;
      }

      .ridy-side h1{
        margin:8px 0 4px;
        font-size:35px;
        line-height:.84;
        max-width:175px;
      }

      .lead{
        max-width:205px;
        margin:0;
        font-size:12.5px;
        line-height:1.08;
        display:-webkit-box;
        -webkit-line-clamp:3;
        -webkit-box-orient:vertical;
        overflow:hidden;
      }

      .ridy-art{
        position:absolute;
        right:-12px;
        bottom:-3px;
        width:190px;
        height:182px;
        margin:0;
        overflow:visible;
        align-items:flex-end;
        z-index:4;
        pointer-events:none;
      }

      .ridy-art::after{
        content:"";
        position:absolute;
        right:10px;
        bottom:8px;
        width:132px;
        height:26px;
        border-radius:50%;
        background:rgba(204,0,0,.22);
        filter:blur(17px);
        z-index:0;
        animation:ridyGroundPulse 2.6s ease-in-out infinite;
      }

      .ridy-art::before{
        width:135px;
        height:105px;
        bottom:0;
        filter:blur(36px);
      }

      .ridy-art img{
        position:relative;
        z-index:2;
        height:188px;
        width:auto;
        max-width:184px;
        object-fit:contain;
        object-position:bottom center;
        filter:
          brightness(1.12)
          contrast(1.06)
          saturate(1.06)
          drop-shadow(0 0 10px rgba(204,0,0,.16))
          drop-shadow(0 12px 18px rgba(0,0,0,.62));
        animation:ridyAlive 3.4s ease-in-out infinite;
        transform-origin:50% 100%;
        will-change:transform;
      }

      .status-pill{
        left:auto;
        right:8px;
        bottom:7px;
        transform:none;
        padding:5px 8px;
        gap:5px;
        font-size:8px;
        letter-spacing:.06em;
        max-width:138px;
        overflow:hidden;
        text-overflow:ellipsis;
        z-index:7;
        background:rgba(8,8,8,.88);
        backdrop-filter:blur(8px);
        box-shadow:0 5px 16px rgba(0,0,0,.42);
      }

      .status-pill i{
        width:5px;
        height:5px;
        flex:0 0 5px;
      }

      /* Chat takes every remaining pixel */
      .chat-card{
        flex:1 1 auto;
        min-height:0;
        height:auto;
        overflow:hidden;
        display:flex;
        flex-direction:column;
      }

      .chat-head{
        flex:0 0 58px;
        min-height:58px;
        height:58px;
        padding:8px 10px;
        gap:8px;
      }

      .chat-title{
        gap:8px;
        min-width:0;
      }

      .mini-avatar{
        width:42px;
        height:42px;
        border-radius:12px;
        box-shadow:0 0 0 1px rgba(204,0,0,.45),0 0 18px rgba(204,0,0,.16);
        overflow:hidden;
      }

      .mini-avatar img{
        transform:scale(1.22);
        transform-origin:50% 28%;
      }

      .chat-title strong{
        font-size:16px;
      }

      .chat-title span{
        max-width:150px;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        font-size:10px;
        margin-top:2px;
      }

      .clear-btn{
        padding:6px 8px;
        font-size:9px;
        border-radius:7px;
      }

      .messages{
        flex:1 1 auto;
        min-height:0;
        height:auto;
        padding:10px 10px 4px;
        overflow-y:auto;
        overscroll-behavior:contain;
        -webkit-overflow-scrolling:touch;
      }

      .msg{
        margin-bottom:8px;
      }

      .bubble{
        max-width:88%;
        padding:8px 10px;
        border-radius:11px;
        font-size:14px;
        line-height:1.18;
      }

      .answer-meta{
        gap:5px;
        margin-top:7px;
        padding-top:7px;
      }

      .source-link,
      .topic-btn,
      .dynamic-tag{
        padding:5px 7px;
        font-size:9px;
      }

      .suggestions{
        gap:5px;
        margin-top:6px;
      }

      /* Quick questions stay on one compact horizontal row */
      .quick-wrap{
        flex:0 0 auto;
        padding:5px 9px 6px;
        border-top:1px solid rgba(255,255,255,.05);
      }

      .quick-label{
        display:none;
      }

      .quick-actions{
        display:flex;
        flex-wrap:nowrap;
        gap:5px;
        overflow-x:auto;

       LYA V5 — waist-up, immersive mobile
       ========================================================= */
    @media(max-width:820px){
      .ridy-side{
        flex:0 0 330px !important;
        min-height:330px !important;
        height:330px !important;
        padding:24px 52% 34px 20px !important;
        overflow:hidden !important;
        background:
          linear-gradient(90deg,#050505 0%,#080808 43%,rgba(34,0,0,.78) 100%),
          radial-gradient(circle at 80% 42%,rgba(229,16,16,.34),transparent 42%) !important;
      }

      .ridy-side h1{
        font-size:46px !important;
        line-height:.82 !important;
        max-width:190px !important;
        margin:12px 0 8px !important;
      }

      .lead{
        max-width:210px !important;
        font-size:13px !important;
        line-height:1.08 !important;
        -webkit-line-clamp:4 !important;
      }

      /* Complete Lya from waist to head */
      .ridy-art{
        position:absolute !important;
        top:0 !important;
        right:-34px !important;
        bottom:auto !important;
        width:60% !important;
        height:330px !important;
        display:flex !important;
        align-items:flex-start !important;
        justify-content:center !important;
        overflow:visible !important;
        z-index:5 !important;
      }

      .ridy-art img{
        height:330px !important;
        width:auto !important;
        max-width:none !important;
        object-fit:contain !important;
        object-position:top center !important;
        filter:
          saturate(1.08)
          brightness(1.06)
          contrast(1.04)
          drop-shadow(0 14px 22px rgba(0,0,0,.78))
          drop-shadow(0 0 25px rgba(229,16,16,.22)) !important;
        animation:ridyBreath 3.4s ease-in-out infinite !important;
        transform-origin:52% 68% !important;
      }

      @keyframes ridyBreath{
        0%,100%{transform:translateY(0) rotate(-.25deg) scale(1)}
        50%{transform:translateY(-5px) rotate(.35deg) scale(1.018)}
      }

      .ridy-art::before{
        width:205px !important;
        height:240px !important;
        right:4px !important;
        bottom:2px !important;
        background:rgba(229,16,16,.20) !important;
        filter:blur(60px) !important;
      }

      .ridy-art::after{
        right:28px !important;
        bottom:4px !important;
        width:165px !important;
        height:25px !important;
      }

      .ridy-hello{
        top:82px !important;
        right:13px !important;
        z-index:11 !important;
        font-size:10px !important;
      }

      .status-pill{
        bottom:23px !important;
        right:10px !important;
        z-index:12 !important;
      }

      /* Pull the conversation over the scene */
      .chat-card{
        margin-top:-42px !important;
        border-radius:32px 32px 0 0 !important;
        background:
          radial-gradient(340px 130px at 22% 0%,rgba(204,0,0,.10),transparent 68%),
          linear-gradient(180deg,rgba(18,13,13,.99),rgba(5,5,5,.995) 34%) !important;
      }

      .chat-head{
        min-height:72px !important;
        height:72px !important;
        flex-basis:72px !important;
      }

      .messages{
        min-height:0 !important;
      }
    }

    @media(max-width:390px){
      .ridy-side{
        flex-basis:310px !important;
        min-height:310px !important;
        height:310px !important;
        padding-right:51% !important;

      }

      .lead{
        max-width:188px !important;
        font-size:12px !important;
      }

      .ridy-art{
        width:61% !important;
        height:310px !important;
        right:-38px !important;
      }

      .ridy-art img{
        height:310px !important;
      }

    @media(max-width:820px) and (max-height:700px){

        min-height:255px !important;
        height:255px !important;

        margin-top:-34px !important;

    @media (max-width:560px){
      .chat-head{gap:8px}
      .chat-head-actions{gap:5px}

      .clear-btn{padding:8px 9px}
    }

    /* RIDLY_MOBILE_BASE_BEGIN */
    html{
      -webkit-text-size-adjust:100%;
      overscroll-behavior-y:none;
    }
    body{
      min-height:100svh;
      overscroll-behavior-y:none;
      -webkit-font-smoothing:antialiased;
    }
    /* Encoches iPhone : header et barre du bas */
    nav.nav{
      padding-top:env(safe-area-inset-top);
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
    }
    .tabbar{
      padding-bottom:calc(7px + env(safe-area-inset-bottom)) !important;
    }
    /* Zones tactiles : 44px minimum (recommandation Apple) */
    .tab,.icon-btn,.more-btn,.add-btn,button,a.btn{
      touch-action:manipulation;
    }
    .icon-btn,.more-btn,.add-btn{min-height:36px}
    /* Empeche le zoom iOS a la mise au point d'un champ (<16px = zoom auto) */
    input,textarea,select{font-size:16px}
    /* Pas de scroll horizontal parasite */
    body,.page-wrap{max-width:100%;overflow-x:hidden}
    img,video,svg{max-width:100%}
    /* RIDLY_MOBILE_BASE_END */
  
  
    /* RIDLY_LYA_IMG_BEGIN */
    .ridy-art img,.mini-avatar img,.sprite-frame{
      image-rendering:-webkit-optimize-contrast;
      image-rendering:crisp-edges;

      .ridy-art img,.mini-avatar img,.sprite-frame{image-rendering:high-quality}

  function voiceCandidates(){
    const locale=voiceLocale().toLowerCase();
    const base=locale.slice(0,2);

  function voiceQualityScore(v){
    const locale=voiceLocale().toLowerCase();
    const name=String(v.name||'').toLowerCase();
    const lang=String(v.lang||'').toLowerCase();
    let s=0;
    if(lang===locale) s+=70; else if(lang.startsWith(locale.slice(0,2))) s+=35;
    if(/natural|neural|premium|enhanced|studio|wavenet|high quality|hq|online/.test(name)) s+=95;
    if(/google/.test(name)) s+=42;
    if(/samsung/.test(name)) s+=38;
    if(/microsoft/.test(name)) s+=30;
    if(/apple|siri/.test(name)) s+=34;
    if(/female|femme|woman|amelie|amélie|audrey|marie|julie|sylvie|alice|elsa|celine|céline|lea|léa|virginie|hortense|aurelie|aurélie|anna|katja|helena|samantha|victoria|serena|karen|moira|ava|susan|zira/.test(name)) s+=24;
    if(v.default) s+=8;
    if(v.localService) s+=3;
    if(/espeak|robot|compact|basic/.test(name)) s-=50;
    return s;
  }

  function refreshVoices(){
    if(!hasSpeech) return;

  if(hasSpeech && 'onvoiceschanged' in window.speechSynthesis){

  function chooseVoice(){
    refreshVoices();
    const candidates=voiceCandidates();
    if(!candidates.length) return null;

    const pref=voicePrefs[key];
    if(pref){
      const selected=candidates.find(v=>v.voiceURI===pref.voiceURI) || candidates.find(v=>v.name===pref.name && v.lang===pref.lang);

    return [...candidates].sort((a,b)=>voiceQualityScore(b)-voiceQualityScore(a))[0] || candidates[0];

  function openVoicePicker(){
    if(!hasSpeech) return;

  function speechText(text){
    return String(text||'')
      .replace(/https?:\/\/\S+/gi,'')
      .replace(/[•▪◦]/g,'. ')
      .replace(/[#*_`~]/g,'')
      .replace(/\s+/g,' ')

  function setSpeakingUi(on){
    ridyArt.classList.toggle('speaking',!!on);

  function stopSpeaking(){
    if(!hasSpeech) return;
    window.speechSynthesis.cancel();

    setSpeakingUi(false);
    if(speakingReplayBtn){ speakingReplayBtn.classList.remove('speaking'); speakingReplayBtn=null; }
  }

  function speakLya(text,replayBtn=null,force=false,voiceOverride=null){
    if(!hasSpeech || (!voiceEnabled && !force)) return;
    const spoken=speechText(text);
    if(!spoken) return;
    stopSpeaking();
    speakingReplayBtn=replayBtn||null;
    const utter=new SpeechSynthesisUtterance(spoken);
    activeUtterance=utter;
    utter.lang=voiceLocale();
    const chosen=voiceOverride||chooseVoice();
    if(chosen) utter.voice=chosen;
    /* V60 : débit légèrement plus calme + pitch naturel. */
    utter.rate=0.94;
    utter.pitch=1.02;
    utter.volume=1;
    utter.onstart=()=>setSpeakingUi(true);
    utter.onend=()=>{ if(activeUtterance===utter){ activeUtterance=null; setSpeakingUi(false); if(speakingReplayBtn){speakingReplayBtn.classList.remove('speaking'); speakingReplayBtn=null;} } };
    utter.onerror=()=>{ if(activeUtterance===utter){ activeUtterance=null; setSpeakingUi(false); if(speakingReplayBtn){speakingReplayBtn.classList.remove('speaking'); speakingReplayBtn=null;} } };
    setTimeout(()=>{
      try{ window.speechSynthesis.resume(); window.speechSynthesis.speak(utter); }catch(e){ setSpeakingUi(false); }
    },35);
  }

  function updateVoiceButton(){
    const t=VOICE_COPY[language]||VOICE_COPY.fr;

    voiceBtn.classList.toggle('active',voiceEnabled);

    voiceBtn.setAttribute('aria-label',voiceEnabled?t.on:t.off);
    voiceBtn.setAttribute('aria-pressed',voiceEnabled?'true':'false');
  }

    localStorage.setItem('lya_voice_enabled',voiceEnabled?'1':'0');

  const STOP = new Set(('le la les un une des de du d et ou en sur pour a au aux je tu il elle on nous vous ils elles est sont ce ca ça c quoi comment quel quelle quels quelles ' +
    'der die das den dem ein eine einer und oder zu von im in ist sind was wie welche welcher ich du sie wir ihr ' +
    'il lo la i gli le un una di del della e o in su per che cosa come quale quali sono è ' +
    'the a an and or of to in on for is are what how which do does can i you we they it my your').split(/\s+/));

  function normalize(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9+#.]+/g,' ').trim();
  }
  function tokens(s){ return normalize(s).split(/\s+/).filter(x=>x.length>1 && !STOP.has(x)); }
  function detectLanguage(){
    const saved=localStorage.getItem('ridy_language');
    if(['fr','de','it','en'].includes(saved)) return saved;
    const l=(navigator.language||'en').toLowerCase();
    if(l.startsWith('fr')) return 'fr'; if(l.startsWith('de')) return 'de'; if(l.startsWith('it')) return 'it'; return 'en';
  }
  let language=detectLanguage();

  let conversationContext={
    topic:null,

  function topicFromEntry(entry){
    if(!entry) return null;
    const id=String(entry.id||'').toLowerCase();
    const cat=normalize(entry.category||'');
    if(id.startsWith('rsl-course') || id==='rsl-courses') return 'courses';
    if(id.includes('event') || id.includes('contest') || id.includes('championship')) return 'events';
    if(id==='ridly-game-of-scoot' || id.includes('game-of-scoot')) return 'game-scoot';
    if(entry.category==='Riders' || id.startsWith('rider-')) return 'rider';
    if(id.startsWith('ridly-')) return 'ridly';
    if(id.startsWith('jf-')) return 'shop';
    if(cat.includes('trottinette') || cat.includes('scooter')) return 'scooter';
    if(cat.includes('rsl')) return 'rsl';
    return cat || null;
  }

  function rememberEntry(entry,userText='',intent=null){
    rememberContext({
      topic:topicFromEntry(entry),
      entryId:entry?.id||null,

      lastUser:userText||conversationContext.lastUser

  function cityFromText(text){
    const s=normalize(text);
    if(/\bmontreux\b/.test(s)) return 'montreux';
    if(/\b(vidy|lausanne)\b/.test(s)) return 'vidy';
    if(/\byverdon\b/.test(s)) return 'yverdon';
    if(/\bmartigny\b/.test(s)) return 'martigny';
    return null;
  }

  function editDistance(a,b){
    a=String(a||''); b=String(b||'');
    if(a===b) return 0;
    if(!a.length) return b.length;
    if(!b.length) return a.length;
    const prev=Array.from({length:b.length+1},(_,i)=>i);
    for(let i=1;i<=a.length;i++){
      let left=i, diag=i-1;
      prev[0]=i;
      for(let j=1;j<=b.length;j++){
        const up=prev[j];
        const cost=a[i-1]===b[j-1]?0:1;
        const val=Math.min(up+1,left+1,diag+cost);
        diag=up; prev[j]=val; left=val;
      }
    }
    return prev[b.length];
  }

  function fuzzyTokenMatch(token,textTokens){
    if(token.length<4) return false;
    return textTokens.some(t=>{
      if(Math.abs(t.length-token.length)>2) return false;
      const maxDist=token.length>=8?2:1;
      return editDistance(token,t)<=maxDist;
    });
  }

  function allSearchText(e){
    return normalize([
      ...(Object.values(e.questions||{})), ...(e.keywords||[]), e.category, e.id
    ].join(' '));
  }

  function scoreEntry(query,e){
    const nq=normalize(query), qt=tokens(query), text=allSearchText(e);
    if(!nq) return 0;

    // Never fuzzy-match conversational commands to knowledge/rider names.
    if(['go','ok go','vas y','vasy','allez','on y va','c est parti','cest parti','start','lets go','let s go','los','vai','andiamo'].includes(nq)){
      return 0;
    }

    let score=0;

    const qfrExact=normalize((e.questions&&e.questions.fr)||'')
      .replace(/^qui est /,'')
      .replace(/\s*\?\s*$/,'');
    const possiblePerson=normalize(cleanPossiblePersonName(query));
    if(qfrExact && possiblePerson===qfrExact) score += 40;

    if(e.category==='Riders'){
      const rn=normalize(riderDisplayName(e));
      const possible=normalize(cleanPossiblePersonName(query));

      if(rn && possible===rn){
        score += 30;
      } else if(rn && isLikelyPersonName(query)){
        // Full-name typo tolerance, but never "same first name = same rider".
        const d=riderFullNameDistance(rn,possible);
        if(d<=2) score += 14;
        else score -= 18;
      }
    }
    if(text.includes(nq)) score+=18;
    for(const k of (e.keywords||[])){
      const nk=normalize(k); if(nk && nq.includes(nk)) score+=8; else if(nk && text.includes(nk) && qt.some(t=>nk.includes(t))) score+=2;
    }
    const textTokens=tokens(text);
    for(const t of qt){
      if(text.includes(t)) score += t.length>=6 ? 4.5 : 3;
      else if(fuzzyTokenMatch(t,textTokens)) score += t.length>=7 ? 2.6 : 1.7;
      const title=normalize((e.questions||{})[language]||'');
      if(title.includes(t)) score+=2;
      else if(fuzzyTokenMatch(t,tokens(title))) score+=1.1;
    }
    const cat=normalize(e.category);
    if(nq.includes(cat)) score+=8;

    if(tokens(nq).some(t=>t==='deck' || editDistance(t,'deck')<=1)){
      if(e.id==='scooter-deck-size') score += 30;
      if(e.id==='rsl-size-guide' || e.id==='scooter-bar-height' || e.id==='rsl-broomstick') score -= 30;
    }

    const hasGuidon=tokens(nq).some(t=>t==='guidon' || t==='bar' || editDistance(t,'guidon')<=1);
    const hasHeight=tokens(nq).some(t=>
      ['hauteur','haut','taille','tail','height'].includes(t) ||
      t.startsWith('haut') || t.startsWith('tail')
    );
    if(hasGuidon && hasHeight){
      if(e.id==='scooter-bar-height' || e.id==='rsl-size-guide') score += 30;
      if(e.id==='scooter-deck-size') score -= 30;
    }

    const hasScooterChoice=tokens(nq).some(t=>
      ['trottinette','trotinette','trotinnette','scooter','scoot','setup','complete','complet'].includes(t) ||
      editDistance(t,'trottinette')<=2 || editDistance(t,'scooter')<=1
    ) && tokens(nq).some(t=>
      ['prendre','prend','choisir','choix','acheter','conseille','conseil','recommande','quelle','quel','quoi','taille','hauteur','size','choose','buy','which','what'].includes(t) ||
      editDistance(t,'prendre')<=2 || editDistance(t,'choisir')<=2
    );
    if(hasScooterChoice){
      if(e.id==='rsl-size-guide') score += 38;
      if(String(e.id||'').startsWith('scooter-') && ['scooter-tailwhip','scooter-bunnyhop','scooter-barspin'].includes(e.id)) score -= 45;
    }

    // Never let a normal gear/beginner sentence accidentally become a rider biography.
    // Rider entries should win only when the user is actually naming or asking about a person.
    const looksPerson=isLikelyPersonName(query) || /\b(qui est|who is|wer ist|chi e|rider|pilote|connais tu|tu connais)\b/.test(nq);
    const genericScooterTalk=/\b(trottinette|trotinette|trotinnette|scooter|deck|guidon|grip|grips|poignee|poignees|roue|roues|fourche|commencer|debuter|debutant|taille|hauteur|acheter|choisir)\b/.test(nq);
    if(e.category==='Riders' && genericScooterTalk && !looksPerson) score -= 45;

    return score;
  }

  function rank(query){
    return knowledge.map(e=>({e,score:scoreEntry(query,e)})).sort((a,b)=>b.score-a.score);
  }

  function intentTokenMatch(ts, words, maxDist=1){
    return ts.some(t=>words.some(w=>{
      if(t===w || t.startsWith(w) || w.startsWith(t) && t.length>=5) return true;
      if(Math.abs(t.length-w.length)>maxDist) return false;
      return t.length>=4 && editDistance(t,w)<=maxDist;
    }));
  }

  function smartIntent(text){
    const s=normalize(text);
    const city=cityFromText(text);
    const ts=s.split(/\s+/).filter(Boolean);

    const register=intentTokenMatch(ts,[
      'inscrire','inscription','inscriptions','inscrit','inscrir','register','registration','signup',
      'anmelden','anmeldung','iscrivere','iscrizione','iscriverti','reserver','reservation','booking'
    ],2) || /\b(sign up|m inscrire|me inscrire|je m inscris)\b/.test(s);

    const ridly=intentTokenMatch(ts,['ridly','riley','ridley','ridli','rily'],2) ||
      intentTokenMatch(ts,['compte','account','profil','profile'],1);

    const intent={
      city,
      register,
      participate:/\b(particip|participer|venir|rejoindre|join|take part|mitmachen|teilnehmen|partecipa|partecipare|je veux venir|je veux participer)\b/.test(s),
      price:/\b(combien|prix|tarif|coute|cout|chf|price|cost|kosten|preis|quanto|prezzo|costa)\b/.test(s),
      where:/\b(ou|lieu|ville|adresse|where|wo|ort|dove|posto)\b/.test(s),
      when:/\b(quand|horaire|heure|jour|date|samedi|when|time|schedule|wann|uhr|quando|orario)\b/.test(s),
      course:/\b(cours|course|courses|kurs|kurse|corso|corsi|stage|session|seance|coach)\b/.test(s),
      event:/\b(event|evenement|competition|contest|jam|finale|championnat|evento|wettkampf)\b/.test(s),
      ridly,
      whatsapp:/\b(whatsapp|whats app|groupe|group|gruppe|gruppo)\b/.test(s)
    };

    return intent;
  }

    if(i.register && i.ridly && !i.course) return false;

    if(i.participate && courseContext){

        text,

    // "Je m'inscris où ?" after course context.
    if(i.register && courseContext){
      return smartReply(
        text,

    if(i.when && courseContext){
      return smartReply(
        text,
        t.courseWhen,
        courseActions(city),

    if(i.register && !i.course && !i.event && !i.ridly && !ctx.topic){
      return smartReply(
        text,
        t.ambiguousRegister,

          {label:t.courseChoice,action:()=>smartReply('',t.courseRegister,courseActions(null),{topic:'courses',intent:'register'})},
          {label:t.eventChoice,href:'https://rsl-swiss.ch/'}
        ],
        {intent:'clarify-register'}

    if(i.participate && !courseContext && !eventContext){

        text,
        t.ambiguousParticip,
        [
          {label:t.courseChoice,action:()=>smartReply('',t.courseRegister,courseActions(null),{topic:'courses',intent:'register'})},
          {label:t.eventChoice,href:'https://rsl-swiss.ch/'}

  function scootCopy(){
    return SCOOT_COPY[language] || SCOOT_COPY.en;
  }

  function cleanPlayerName(name){
    name = String(name||'')
      .replace(/[.,!?;:()[\]{}"'’`]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

    // remove common command words that can stick to names
    name = name.replace(/^(pour|for|fur|für|a|à|de|da|di)\s+/i,'').trim();

    if(!name) return '';
    return name
      .split(' ')
      .map(p=>p ? p.charAt(0).toUpperCase()+p.slice(1).toLowerCase() : '')
      .join(' ');
  }

  function scootScore(player){
    const count = Math.max(0, Math.min(SCOOT_WORD.length, player.letters||0));
    return count ? SCOOT_WORD.slice(0,count).join('') : scootCopy().zero;
  }

  function scootFindPlayer(name){
    const target = normalize(name);
    if(!target) return null;

    // exact normalized match first
    let found = scootGame.players.find(p=>normalize(p.name)===target);
    if(found) return found;

    // loose first-name match / typo tolerance
    found = scootGame.players.find(p=>{
      const pn = normalize(p.name);
      if(pn.startsWith(target) || target.startsWith(pn)) return true;
      return editDistance(pn,target) <= (Math.max(pn.length,target.length)>=7 ? 2 : 1);
    });
    return found || null;
  }

  function scootExtractNamesFromStart(text){
    let s = String(text||'').trim();

    // Strip game-of-scoot wording in all likely spellings, including user's "scout".
    s = s.replace(/\b(game\s*(of|off|de)?\s*(scoot|scout)|game\s+scoot|game\s+scout|scoot\s+game|scout\s+game)\b/ig,' ');
    s = s.replace(/\b(lance|lancer|commence|commencer|demarre|démarre|start|starte|inizia|iniziare|avec|with|mit|con|entre|vs|versus)\b/ig,' ');

    // Split on commas, slashes, +, &, "et", "and", "und", "e".
    let raw = s
      .replace(/\s+(et|and|und|e)\s+/ig, ',')
      .replace(/[\/+&]/g, ',')
      .split(',')
      .map(cleanPlayerName)
      .filter(Boolean);

    // If no separators, accept remaining words as individual first names.
    if(raw.length < 2){
      const words = s
        .replace(/[^\p{L}\p{M}'’-]+/gu,' ')
        .trim()
        .split(/\s+/)
        .map(cleanPlayerName)
        .filter(Boolean)
        .filter(x=>!['Game','Scoot','Scout'].includes(x));
      if(words.length >= 2) raw = words;
    }

    // Remove duplicates
    const seen = new Set();
    return raw.filter(n=>{
      const k=normalize(n);
      if(!k || seen.has(k)) return false;
      seen.add(k); return true;
    }).slice(0,8);
  }

  function scootRenderScore(prefix=''){
    const t=scootCopy();
    const lines=scootGame.players.map(p=>{
      const dead=(p.letters||0)>=SCOOT_WORD.length;
      return `${dead?'❌':'•'} ${p.name} : ${scootScore(p)}`;
    });
    return `${prefix ? prefix+'\n\n' : ''}${t.scoreTitle}\n${lines.join('\n')}`;
  }

  function scootAlivePlayers(){
    return scootGame.players.filter(p=>(p.letters||0)<SCOOT_WORD.length);
  }

  function scootReply(text,userText=''){
    if(userText) addUser(userText);
    input.value='';
    setBusy(true);

  function scootStart(names,userText){
    const t=scootCopy();
    if(names.length<2) return scootReply(t.needPlayers,userText);

    scootGame={
      active:true,
      players:names.map(name=>({name,letters:0})),
      lastAction:null,
      waitingPlayers:false
    };

    return scootReply(
      `${t.started(names)}\n\n${scootRenderScore()}`,
      userText
    );
  }

  function scootAddLetter(player,userText){
    const t=scootCopy();
    if(!player) return scootReply(t.noGame,userText);
    if(player.letters>=SCOOT_WORD.length){
      return scootReply(`${player.name} a déjà SCOOT 😅\n\n${scootRenderScore()}`,userText);
    }

    const previous=player.letters;
    player.letters++;
    scootGame.lastAction={type:'letter',player:player.name,previous};

    const newLetter=SCOOT_WORD[player.letters-1];
    let msg=t.letter(player.name,newLetter,scootScore(player));

    if(player.letters>=SCOOT_WORD.length){
      msg += `\n${t.eliminated(player.name)}`;
      const alive=scootAlivePlayers();
      if(alive.length===1 && scootGame.players.length>1){
        msg += `\n\n${t.winner(alive[0].name)}`;
      }
    }

    return scootReply(`${msg}\n\n${scootRenderScore()}`,userText);
  }

  function scootRemoveLetter(player,userText){
    const t=scootCopy();
    if(!player) return scootReply(t.noGame,userText);
    if(player.letters<=0) return scootReply(t.nothing(player.name),userText);

    player.letters--;
    scootGame.lastAction={type:'remove',player:player.name};
    return scootReply(`${t.removed(player.name,scootScore(player))}\n\n${scootRenderScore()}`,userText);
  }

  function scootUndo(userText){
    const t=scootCopy();
    const a=scootGame.lastAction;
    if(!a) return scootReply("Je n’ai rien à annuler pour le moment 😄",userText);

    const p=scootFindPlayer(a.player);
    if(!p) return scootReply("Je n’ai pas retrouvé le dernier joueur 😅",userText);

    if(a.type==='letter'){
      p.letters=Math.max(0,a.previous);
      scootGame.lastAction=null;
      return scootReply(`${t.removed(p.name,scootScore(p))}\n\n${scootRenderScore()}`,userText);
    }
    scootGame.lastAction=null;
    return scootReply(scootRenderScore("Annulation faite ↩️"),userText);
  }


  function scootExtractPlainNames(text){
    let s=String(text||'').trim();

    // Common separators between first names
    s=s
      .replace(/\s+(et|and|und|e|vs|versus)\s+/ig, ',')
      .replace(/[\/+&;]/g, ',');

    let names=[];

    if(s.includes(',')){
      names=s.split(',')
        .map(cleanPlayerName)
        .filter(Boolean);
    }else{
      // In waiting mode "Lucas Joel Bastien" means three players.
      names=s
        .replace(/[^\p{L}\p{M}'’-]+/gu,' ')
        .trim()
        .split(/\s+/)
        .map(cleanPlayerName)
        .filter(Boolean);
    }

    const forbidden=new Set([
      'Game','Scoot','Scout','Of','Off','De','The',
      'Oui','Non','Ok','Okay','Merci','Salut','Bonjour'
    ]);

    const seen=new Set();
    return names.filter(n=>{
      const k=normalize(n);
      if(!k || forbidden.has(n) || seen.has(k)) return false;
      seen.add(k);
      return true;
    }).slice(0,8);
  }


  function scootLooksLikeLetterCommand(text){
    const s=normalize(text);
    const ts=tokens(s);

    // Exact + common typos in FR/EN/DE/IT.
    const known=[
      'lettre','letre','lettres','letr','letter','letters',
      'buchstabe','buchstaben','lettera','lettere'
    ];
    if(ts.some(t=>known.includes(t))) return true;

    // Fuzzy typo tolerance: "lettre" / "letter" up to 1 edit,
    // longer translations up to 2 edits.
    return ts.some(t=>{
      if(editDistance(t,'lettre')<=1) return true;
      if(editDistance(t,'letter')<=1) return true;
      if(t.length>=7 && editDistance(t,'buchstabe')<=2) return true;
      if(t.length>=6 && editDistance(t,'lettera')<=2) return true;
      return false;
    });
  }

  function scootPlayerMentioned(text){
    const s=normalize(text);

    // Prefer actual players already registered in the current game.
    for(const p of scootGame.players){
      const pn=normalize(p.name);
      if(
        s===pn ||
        s.includes(` ${pn} `) ||
        s.startsWith(pn+' ') ||
        s.endsWith(' '+pn) ||
        s.includes(pn)
      ){
        return p;
      }
    }

    return null;
  }

  function answerScootGame(text){
    const raw=String(text||'').trim();
    const s=normalize(raw);
    const t=scootCopy();

    // Lya asked for names on the previous turn:
    // the next message is treated as the player list.
    if(scootGame.waitingPlayers){
      if(/^(annule|annuler|cancel|stop|laisse tomber|vergiss|abbrechen|annulla)[!. ]*$/.test(s)){
        scootGame.waitingPlayers=false;
        return scootReply("OK 😄 Game annulé.",raw);
      }

      const pendingNames=scootExtractPlainNames(raw);
      if(pendingNames.length>=2){
        return scootStart(pendingNames,raw);
      }

      // Keep waiting instead of falling back to normal Lya knowledge.
      return scootReply(t.needPlayers,raw);
    }

    const mentionsGame=/\b(game|scoot|scout)\b/.test(s);

    // Start a new game.
    if(
      /\b(game\s*(of|off|de)?\s*(scoot|scout)|game\s+(scoot|scout)|scoot\s+game|scout\s+game)\b/.test(s)
      || (/\b(nouvelle|nouveau|new|neues|nuova)\b/.test(s) && /\b(partie|game|spiel|partita)\b/.test(s))
    ){
      const names=scootExtractNamesFromStart(raw);
      if(names.length>=2) return scootStart(names,raw);

      if(/\b(nouvelle|nouveau|new|neues|nuova)\b/.test(s)){
        scootGame={active:false,players:[],lastAction:null,waitingPlayers:false};
        return scootReply(t.reset,raw);
      }
      scootGame.waitingPlayers=true;
      return scootReply(t.needPlayers,raw);
    }

    // Explicit reset/clear.
    if(
      scootGame.active &&
      /\b(reset|recommence|recommencer|efface|effacer|annule la partie|clear game|reset game|spiel loschen|partita nuova)\b/.test(s)
    ){
      scootGame={active:false,players:[],lastAction:null,waitingPlayers:false};
      return scootReply(t.cleared,raw);
    }

    // Help.
    if(
      /\b(aide|help|hilfe|aiuto)\b/.test(s) &&
      /\b(scoot|scout|game)\b/.test(s)
    ){
      return scootReply(t.help,raw);
    }

    // If no active game, don't intercept normal chat unless user mentions the game.
    if(!scootGame.active){
      if(mentionsGame){
        scootGame.waitingPlayers=true;
        return scootReply(t.needPlayers,raw);
      }
      return false;
    }


    // Natural short commands during an active game:
    // "letre joel", "lettre Joel", "Joel lettre", "met une lettre Joel", etc.
    const mentionedPlayer=scootPlayerMentioned(raw);
    if(mentionedPlayer && scootLooksLikeLetterCommand(raw)){
      // Don't steal "retire/enlève une lettre" — handled below.
      const removing=/\b(retire|retirer|enleve|enlève|enlever|remove|take off|entferne|togli)\b/.test(s);
      if(!removing){
        return scootAddLetter(mentionedPlayer,raw);
      }
    }

    // Also accept very short miss commands with typo tolerance.
    if(mentionedPlayer){
      const missWords=['rate','raté','ratee','ratée','miss','missed','loupe','loupé','foire','foiré'];
      const ts=tokens(s);
      const looksMiss=ts.some(t=>
        missWords.includes(t) ||
        editDistance(t,'rate')<=1 ||
        editDistance(t,'miss')<=1
      );
      if(looksMiss){
        return scootAddLetter(mentionedPlayer,raw);
      }
    }

    // Score request.
    if(/^(score|scores|classement|resultat|resultats|résultat|résultats|stand|standings|punktestand|punteggio)[?.! ]*$/.test(s)
       || /\b(score du game|score scoot|score scout|qui gagne|who is winning|wer fuhrt|chi sta vincendo)\b/.test(s)){
      return scootReply(scootRenderScore(),raw);
    }

    // Undo last action.
    if(/\b(annule|annuler|undo|zuruck|rückgängig|annulla)\b/.test(s) && /\b(lettre|letter|buchstabe|lettera|dernier|last|letzte|ultima)\b/.test(s)){
      return scootUndo(raw);
    }

    // Add a player during the game: "ajoute Noah"
    let m=raw.match(/\b(?:ajoute|ajouter|add|füge|fuge|aggiungi)\s+([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)/i);
    if(m){
      const name=cleanPlayerName(m[1]);
      if(scootFindPlayer(name)) return scootReply(t.already(name),raw);
      scootGame.players.push({name,letters:0});
      return scootReply(`${t.added(name)}\n\n${scootRenderScore()}`,raw);
    }

    // Remove one letter: "retire une lettre à Bastien"
    m=raw.match(/\b(?:retire|enleve|enlève|remove|take off|entferne|togli)\b.*?\b(?:lettre|letter|buchstabe|lettera)\b.*?\b(?:a|à|from|von|da)?\s*([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)\b/i);
    if(m){
      const p=scootFindPlayer(m[1]);
      if(!p) return scootReply(t.unknown(cleanPlayerName(m[1])),raw);
      return scootRemoveLetter(p,raw);
    }

    // "Lucas a réussi / landed it" => no letter, but acknowledge.
    for(const p of scootGame.players){
      const pn=normalize(p.name);
      if(s.includes(pn) && /\b(reussi|réussi|replaque|replaqué|landed|lands|land|gelandet|chiuso|atterrato)\b/.test(s)){
        return scootReply(`${t.success(p.name)}\n\n${scootRenderScore()}`,raw);
      }
    }

    // "Lucas a raté" or "lettre pour Lucas"
    let targetName=null;

    m=raw.match(/\b(?:une?\s+)?(?:lettre|letre|letr|letter|buchstabe|lettera)\s+(?:(?:pour|for|fur|für|a|à|per)\s+)?([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)/i);
    if(m) targetName=m[1];

    if(!targetName){
      m=raw.match(/\b([A-Za-zÀ-ÖØ-öø-ÿ'’-]+)\s+(?:a\s+)?(?:rate|raté|ratee|ratée|missed|miss|verpasst|sbagliato|sbaglia)\b/i);
      if(m) targetName=m[1];
    }

    // Very natural short command: "Bastien lettre"
    if(!targetName){
      for(const p of scootGame.players){
        const pn=normalize(p.name);
        if(s.includes(pn) && /\b(lettre|letre|letr|letter|buchstabe|lettera|rate|raté|miss|missed|sbaglia|verpasst)\b/.test(s)){
          targetName=p.name;
          break;
        }
      }
    }

    if(targetName){
      const p=scootFindPlayer(targetName);
      if(!p) return scootReply(t.unknown(cleanPlayerName(targetName)),raw);
      return scootAddLetter(p,raw);
    }

    // While game is active, allow "score?" style variants but otherwise don't hijack normal Lya.
    return false;
  }

  /* ===== RIDLY_LYA_SPOTS_LIVE =====
     Lecture directe de la table `spots`. Un park ajoute dans l'app est
     connu de Lya sans qu'il faille toucher a sa base de connaissances. */
  let _spotsClient = null;
  let _spotsCache  = null;

  function spotsClient(){
    if(_spotsClient) return _spotsClient;
    if(!window.supabase || !window.env || !window.env.SUPABASE_URL) return null;
    _spotsClient = window.supabase.createClient(window.env.SUPABASE_URL, window.env.SUPABASE_ANON);
    return _spotsClient;
  }

  async function loadSpots(){
    if(_spotsCache) return _spotsCache;
    const db = spotsClient();
    if(!db) return [];
    const { data, error } = await db.from('spots').select('id,nom,ville,country,description');
    if(error){ console.warn('[Lya] spots:', error.message); return []; }
    _spotsCache = data || [];
    return _spotsCache;
  }

  const SPOT_STOPWORDS = new Set([
    'spot','spots','skatepark','skateparks','park','parks','trottinette','scooter',
    'ou','où','a','à','au','aux','de','du','des','le','la','les','un','une','en','et',
    'y','il','est','sont','quels','quel','quelle','quelles','pres','près','proche',
    'connais','tu','je','veux','cherche','trouve','montre','donne','moi','liste',
    'dans','sur','pour','avec','qui','que','quoi','wo','welche','in','the','me',
    'show','find','near','which','where','are','is','dove','quali','vicino'
  ]);

  function detectSpotIntent(text){
    const n = normalize(text);
    // Il faut le mot spot/skatepark ET une intention de liste ou de lieu.
    const saysSpot = /\b(spot|spots|skatepark|skateparks|park|parks)\b/.test(n);
    if(!saysSpot) return null;
    // « c'est quoi un spot » releve de la FAQ, pas d'une recherche.
    if(/\b(c est quoi|cest quoi|definition|ca veut dire|what is|was ist)\b/.test(n)) return null;
    return n;
  }

  async function answerSpotsLive(text){
    const n = detectSpotIntent(text);
    if(!n) return false;

    const spots = await loadSpots();
    if(!spots.length) return false;   // on laisse la FAQ repondre

    const terms = n.split(/\s+/).filter(w => w.length > 2 && !SPOT_STOPWORDS.has(w));

    let list = spots;
    let where = '';
    if(terms.length){
      const scored = spots.map(sp => {
        const hay = normalize([sp.nom, sp.ville, sp.country].filter(Boolean).join(' '));
        let sc = 0;
        for(const t of terms){
          if(hay.includes(t)) sc += 10;
          else if(t.length > 4 && hay.includes(t.slice(0, t.length - 1))) sc += 6;
        }
        return { sp, sc };
      }).filter(x => x.sc > 0).sort((a,b) => b.sc - a.sc);

      if(scored.length){
        list  = scored.map(x => x.sp);
        where = terms.join(' ');
      }else{
        // Un lieu a ete demande mais rien ne correspond : le dire,
        // plutot que de sortir une liste au hasard.
        addUser(text); input.value=''; setBusy(true);
        setTimeout(()=>{
          addRidy(`Je n'ai aucun spot enregistré correspondant à « ${terms.join(' ')} ». `
            + `Tu peux l'ajouter depuis la page Spots — il sera visible pour tous les riders.`);
          setBusy(false); input.focus();
        }, 160);
        return true;
      }
    }

    const total = list.length;
    const top   = list.slice(0, 8);
    const lines = top.map(sp => {
      const ville = sp.ville ? ` — ${sp.ville}` : '';
      return `• ${sp.nom}${ville}`;
    }).join('\n');

    const intro = where
      ? `${total} spot${total>1?'s':''} pour « ${where} » :`
      : `${total} spot${total>1?'s':''} enregistrés sur RIDLY. Les derniers :`;
    const more = total > top.length
      ? `\n\n…et ${total - top.length} autres. Ouvre la page Spots pour la carte complète.`
      : `\n\nOuvre la page Spots pour les voir sur la carte.`;

    addUser(text); input.value=''; setBusy(true);
    setTimeout(()=>{
      addRidy(intro + '\n' + lines + more);
      setBusy(false); input.focus();
    }, 160);
    return true;
  }



  /* ===== RIDLY_LYA_RELANCE =====
     Ce qui manquait pour que la conversation tienne : les relances courtes.
     « et comment on l'apprend ? » n'a de sens que rapporte au trick dont on
     vient de parler. Sans ca, chaque question repart de zero et Lya sonne
     comme un formulaire. */

  function progression(id){
    return (window.RIDLY_PROGRESSION || {})[id] || null;
  }

  function nomTrick(id){
    const e = knowledge.find(x => x.id === id);
    if(!e) return null;
    const q = (e.questions && (e.questions[language] || e.questions.fr)) || '';
    // « C'est quoi un tailwhip ? » -> « tailwhip »
    const m = q.match(/(?:un |une |le |la |l')([a-zA-Z0-9 '-]+?)\s*\?/);
    return m ? m[1].trim() : id.replace('scooter-','').replace(/-/g,' ');
  }

  const NIVEAU = {
    1:"très accessible, c'est une des premières choses qu'on apprend",
    2:"pas très dur, quelques sessions suffisent en général",
    3:"il faut y passer du temps, compte plusieurs semaines",
    4:"c'est costaud, ça demande des bases vraiment solides",
    5:"c'est du niveau confirmé, on ne s'y met pas sans encadrement"
  };

  // Types de relance, testes dans l'ordre.
  const RELANCES = [
    { cle:'apprendre', rx:/\b(comment (on |tu |je )?(l ?)?(apprend|apprends|fait|fais|arrive)|comment faire|comment on le fait|par ou commencer)\b/ },
    { cle:'difficile', rx:/\b(c est dur|cest dur|c est difficile|c est chaud|dur a faire|difficile|complique|niveau)\b/ },
    { cle:'apres',     rx:/\b(et apres|apres quoi|la suite|quoi ensuite|prochain|next)\b/ },
    { cle:'avant',     rx:/\b(et avant|avant quoi|quoi avant|prerequis|il faut savoir quoi)\b/ },
    { cle:'erreur',    rx:/\b(j y arrive pas|jy arrive pas|je bloque|ca marche pas|je rate|qu est ce que je fais mal|erreur|pourquoi ca marche pas)\b/ },
    { cle:'danger',    rx:/\b(ca fait mal|c est dangereux|dangereux|je vais me faire mal|risque)\b/ }
  ];

  function detectRelance(text){
    const n = normalize(text);
    // Une relance est courte et sans sujet explicite. Si la phrase contient
    // deja un nom de trick, ce n'est pas une relance mais une vraie question.
    if(n.split(/\s+/).length > 9) return null;
    for(const r of RELANCES) if(r.rx.test(n)) return r.cle;
    return null;
  }

  function answerRelance(text){
    const type = detectRelance(text);
    if(!type) return false;

    const id = conversationContext.entryId;
    if(!id) return false;                 // on ne sait pas de quoi on parle
    const entry = knowledge.find(e => e.id === id);
    if(!entry) return false;

    const g = progression(id);
    const nom = nomTrick(id) || 'ce trick';
    const rep = e => (e.answer && (e.answer[language] || e.answer.fr)) || '';
    const actions = [];
    let texte = '';

    if(type === 'apprendre'){
      // La reponse contient deja la technique : on la redonne en pointant
      // les prerequis, ce qui est l'info qui manque le plus souvent.
      texte = rep(entry);
      if(g && g.avant.length){
        const noms = g.avant.map(nomTrick).filter(Boolean);
        texte += `\n\nAvant de t'y mettre, assure-toi d'avoir ${noms.join(' et ')} en automatique. C'est là que ça coince neuf fois sur dix.`;
        g.avant.forEach(a => actions.push({ label: nomTrick(a), action: ()=> ask(`c'est quoi un ${nomTrick(a)}`) }));
      }
    }

    else if(type === 'difficile'){
      if(!g) return false;
      texte = `Le ${nom} ? ${NIVEAU[g.difficulte]}.`;
      if(g.avant.length){
        texte += ` Ce qui compte vraiment, c'est d'avoir ${g.avant.map(nomTrick).filter(Boolean).join(' et ')} avant.`;
      }else{
        texte += ` Tu peux t'y mettre directement.`;
      }
      if(g.erreur) texte += `\n\nL'erreur classique : ${g.erreur}`;
    }

    else if(type === 'apres'){
      if(!g || !g.apres.length){
        texte = `Après le ${nom}, il n'y a pas de suite évidente — c'est déjà du haut niveau. Dis-moi ce qui t'intéresse et je te dirai par où passer.`;
      }else{
        const noms = g.apres.map(nomTrick).filter(Boolean);
        texte = `Après le ${nom}, la suite logique c'est ${noms.join(', ')}.`;
        g.apres.forEach(a => actions.push({ label: nomTrick(a), action: ()=> ask(`c'est quoi un ${nomTrick(a)}`) }));
      }
    }

    else if(type === 'avant'){
      if(!g || !g.avant.length){
        texte = `Le ${nom} ne demande rien de particulier avant, à part un bunny hop propre.`;
      }else{
        const noms = g.avant.map(nomTrick).filter(Boolean);
        texte = `Avant le ${nom}, il te faut ${noms.join(' et ')}.`;
        g.avant.forEach(a => actions.push({ label: nomTrick(a), action: ()=> ask(`c'est quoi un ${nomTrick(a)}`) }));
      }
    }

    else if(type === 'erreur'){
      if(g && g.erreur){
        texte = `Sur le ${nom}, l'erreur la plus courante : ${g.erreur}`;
        if(g.avant.length){
          texte += `\n\nSi ça ne débloque pas, redescends sur ${g.avant.map(nomTrick).filter(Boolean).join(' ou ')} et remonte après.`;
        }
      }else{
        texte = `Sur le ${nom}, filme-toi une fois et regarde au ralenti — tu verras l'erreur en dix secondes. C'est ce qui débloque le plus vite.`;
      }
      actions.push({ label:'Pourquoi je stagne ?', action: ()=> ask('je ne progresse plus') });
    }

    else if(type === 'danger'){
      const dur = g && g.difficulte >= 4;
      texte = dur
        ? `Le ${nom} n'est pas anodin. Casque et protège-poignets, et travaille-le en foam pit ou sur airbag avant le dur si tu peux.`
        : `Le ${nom} reste raisonnable si tu as le niveau en dessous. Casque et protège-poignets quand même, le poignet est l'articulation la plus touchée.`;
      actions.push({ label:'Comment bien tomber ?', action: ()=> ask('comment bien tomber') });
    }

    if(!texte) return false;
    return smartReply(text, texte, actions, { entryId:id, topic:conversationContext.topic });
  }

  /* Boutons de suite apres une reponse sur un trick : une reponse reussie
     ne doit pas etre un cul-de-sac. */
  function ajouterSuiteTrick(entry){
    const g = progression(entry && entry.id);
    if(!g) return;
    const bulle = messages.lastElementChild?.querySelector('.bubble');
    if(!bulle || bulle.querySelector('.smart-actions')) return;

    const wrap = document.createElement('div');
    wrap.className = 'smart-actions';

    if(g.avant.length){
      addSmartButton(wrap, "Ce qu'il faut avant", ()=> ask('et avant ?'));
    }
    addSmartButton(wrap, "C'est dur ?", ()=> ask("c'est dur ?"));
    if(g.erreur){
      addSmartButton(wrap, "L'erreur classique", ()=> ask("je bloque dessus"));
    }
    if(g.apres.length){
      addSmartButton(wrap, "Et après ?", ()=> ask('et après ?'));
    }
    bulle.appendChild(wrap);
  }



  /* ===== RIDLY_LYA_ACCUEIL =====
     Lya annonce les messages non lus a l'ouverture. Elle passe d'un role
     purement reactif — elle attend qu'on lui parle — a un role de guide qui
     signale ce qui compte.

     Deliberement discret : un seul message, jamais repete dans la session,
     et rien du tout si la boite est vide. */

  let _accueilFait = false;

  async function accueilMessages(){
    if(_accueilFait) return;
    _accueilFait = true;

    const db = spotsClient();
    if(!db) return;

    try{
      const { data:{ user } } = await db.auth.getUser();
      if(!user) return;

      const { data, error } = await db
        .from('ridly_private_unread_counts')
        .select('peer_id,unread_count')
        .eq('user_id', user.id);
      if(error || !data) return;

      const nonLus = data.filter(r => Number(r.unread_count || 0) > 0);
      if(!nonLus.length) return;

      const total = nonLus.reduce((n, r) => n + Number(r.unread_count || 0), 0);

      // Pseudos des expediteurs : « un message de Matis » vaut mieux
      // qu'un compteur anonyme.
      const { data: profs } = await db
        .from('profiles').select('id,pseudo,full_name')
        .in('id', nonLus.map(r => r.peer_id));
      const nom = {};
      (profs||[]).forEach(p => nom[p.id] = p.pseudo || p.full_name || 'un rider');

      let texte;
      const actions = [];

      if(nonLus.length === 1){
        const r = nonLus[0];
        const qui = nom[r.peer_id] || 'un rider';
        const n = Number(r.unread_count);
        texte = n === 1
          ? `Au fait, tu as un message de ${qui}.`
          : `Au fait, tu as ${n} messages de ${qui}.`;

  /* ===== RIDLY_LYA_FEED =====
     « C'est quoi le dernier post ? » renvoyait l'explication des formats de
     publication. C'est de la donnee vivante, comme les spots et les riders :
     Lya doit lire spot_posts au lieu de reciter une entree figee. */

  function detectFeedIntent(text){
    const n = normalize(text);
    if(n.split(/\s+/).length > 10) return null;
    const recent = /\b(dernier|derniere|derniers|dernieres|recent|recents|recente|recentes|nouveau|nouveaux|nouvelle|nouvelles|neuf|quoi de neuf)\b/.test(n)
                || /\b(latest|last|new|recent)\b/.test(n);
    const objet  = /\b(post|poste|posts|publication|publications|photo|photos|video|videos|feed|reel|reels|story|stories|flash)\b/.test(n);
    if(recent && objet) return 'posts';
    // « quoi de neuf » seul suffit
    if(/\b(quoi de neuf|quoi de nouveau|what s new|whats new)\b/.test(n)) return 'posts';
    return null;
  }

  async function answerFeedLive(text){
    if(!detectFeedIntent(text)) return false;
    const db = spotsClient();
    if(!db) return false;

    const { data, error } = await db
      .from('spot_posts')
      .select('user_display,caption,created_at,spot_id,spot_type')
      .order('created_at', { ascending:false })
      .limit(5);

    if(error){ console.warn('[Lya] feed:', error.message); return false; }
    if(!data || !data.length){
      return smartReply(text,
        "Il n'y a encore aucune publication sur RIDLY. Sois le premier : poste une photo ou une vidéo de ta session.",
        [{ label:'Publier', href:'ajouter.html' }]);
    }

    // Noms des spots rattaches, pour situer les posts
    const spotIds = [...new Set(data.map(p => p.spot_id).filter(Boolean))];
    let spots = {};
    if(spotIds.length){
      const { data: sp } = await db.from('spots').select('id,nom').in('id', spotIds);
      (sp||[]).forEach(x => spots[x.id] = x.nom);
    }

    const quand = iso => {
      const h = (Date.now() - new Date(iso).getTime()) / 3600000;
      if(h < 1)  return "il y a moins d'une heure";
      if(h < 24) return `il y a ${Math.round(h)} h`;
      const j = Math.round(h / 24);
      return j === 1 ? 'hier' : `il y a ${j} jours`;
    };

    const p = data[0];
    const qui  = p.user_display || 'Un rider';
    const ou   = p.spot_id && spots[p.spot_id] ? ` à ${spots[p.spot_id]}` : '';
    const quoi = (p.caption || '').trim();

    let texte = `Le dernier post, c'est ${qui}${ou}, ${quand(p.created_at)}.`;
    if(quoi) texte += `\n« ${quoi.slice(0, 140)} »`;

    if(data.length > 1){
      const autres = data.slice(1, 4)
        .map(x => `• ${x.user_display || 'Rider'}${x.spot_id && spots[x.spot_id] ? ' — ' + spots[x.spot_id] : ''} (${quand(x.created_at)})`)
        .join('\n');
      texte += `\n\nJuste avant :\n${autres}`;
    }

    return smartReply(text, texte, [{ label:'Ouvrir le feed', href:'feed.html' }]);
  }

  async function chercherMembre(nom){
    const db = spotsClient();
    if(!db) return [];

    const q = String(nom || '').trim();
    if(q.length < 2) return [];

    const motif = '%' + q.replace(/[%_]/g, '\\$&') + '%';
    const { data, error } = await db
      .from('profiles')
      .select('id,pseudo,full_name,ville')
      .or(`pseudo.ilike.${motif},full_name.ilike.${motif}`)
      .limit(6);

    if(error){ console.warn('[Lya] membres:', error.message); return []; }
    return data || [];
  }

  // Mots qui suivent l'amorce sans faire partie du pseudo.
  const MEMBRE_PARASITES = new Set([
    'le','la','les','un','une','du','de','des','mon','ma','mes','ce','cet','cette',
    'rider','riders','membre','pseudo','profil','compte','utilisateur','user',
    'the','a','an','profile','account'
  ]);

  // Une question qui se termine par un terme du vocabulaire trottinette
  // n'est pas une recherche de personne : « qui est le meilleur guidon »
  // ne cherche personne.
  const MEMBRE_NON_NOMS = new Set([
    'guidon','deck','roue','roues','frein','fourche','collier','grip','grips',
    'trottinette','scooter','spot','spots','skatepark','park','trick','tricks',
    'shop','magasin','marque','prix','taille','modele','cours','event','contest'
  ]);

  /* RIDLY_MEMBRE_SANS_NOM — « ou un utilisateur », « je cherche un rider » :
     l'intention est claire mais aucun nom n'est donne. Lya doit demander le
     pseudo, pas sortir une blague. */
  function veutChercherMembre(text){
    const n = normalize(text);
    if(n.split(/\s+/).length > 7) return false;
    // Le mot « utilisateur / rider / pseudo » suffit a signaler l'intention.
    // C'est detectMembreIntent qui dira s'il reste un nom exploitable :
    // une exclusion par expression reguliere ici serait trop grossiere.
    return /\b(utilisateur|utilisateurs|rider|riders|membre|membres|pseudo|profil|compte|user|users)\b/.test(n);
  }

  function answerMembreSansNom(text){
    if(!veutChercherMembre(text)) return false;
    if(detectMembreIntent(text)) return false;   // un nom est present
    return smartReply(text,
      "Donne-moi son pseudo et je te sors son profil. Tu peux aussi passer par la page Recherche pour parcourir les riders.",
      [{ label:'Ouvrir la recherche', href:'recherche.html' }]);
  }

  function detectMembreIntent(text){
    const n = normalize(text);
    const m = n.match(/\b(qui est|c est qui|tu connais|connais tu|cherche|trouve|profil de)\s+(.{2,40})$/)
           || n.match(/\b(who is|do you know|find)\s+(.{2,40})$/);
    if(!m) return null;

    // On retire les mots parasites en tete : « le rider matis » -> « matis ».
    const mots = m[2].trim().split(/\s+/).filter(w => !MEMBRE_PARASITES.has(w));
    if(!mots.length) return null;

    // Si le dernier mot est du vocabulaire materiel, ce n'est pas un nom.
    if(mots.some(w => MEMBRE_NON_NOMS.has(w))) return null;

    // Un pseudo fait rarement plus de trois mots.
    if(mots.length > 3) return null;

    const terme = mots.join(' ');
    return terme.length >= 2 ? terme : null;
  }

  async function answerMembreRidly(text){
    const terme = detectMembreIntent(text);
    if(!terme) return false;

    const membres = await chercherMembre(terme);
    if(!membres.length) return false;   // on laisse le routeur normal repondre

    // Un pseudo qui commence par le terme passe devant.
    const bas = normalize(terme);
    membres.sort((a,b)=>{
      const pa = normalize(a.pseudo||''), pb = normalize(b.pseudo||'');
      return (pa.startsWith(bas)?0:1) - (pb.startsWith(bas)?0:1) || pa.localeCompare(pb);
    });

    const nomDe = m => m.pseudo || m.full_name || 'Rider';

    if(membres.length === 1){
      const m = membres[0];
      const lieu = m.ville ? ` (${m.ville})` : '';
      return smartReply(text,
        `${nomDe(m)}${lieu} est sur RIDLY. Ouvre son profil pour voir ses spots, ses publications et lui écrire.`,
        [{ label: `Voir le profil de ${nomDe(m)}`,
           href: 'profil_ou_rider.html?id=' + encodeURIComponent(m.id) }]);
    }

    const liste = membres.map(m => '• ' + nomDe(m) + (m.ville ? ` — ${m.ville}` : '')).join('\n');
    return smartReply(text,
      `${membres.length} riders correspondent à « ${terme} » sur RIDLY :\n${liste}`,
      membres.slice(0,4).map(m => ({
        label: nomDe(m),
        href: 'profil_ou_rider.html?id=' + encodeURIComponent(m.id)
      })));
  }

  function smallTalkIntent(text){
    const s = normalize(text);

    // Identity questions deserve a deterministic answer and must never fall
    // through to the encyclopaedia / product ranking. This intentionally
    // accepts common mobile typos: "tu t apell comment", "tu t apel",
    // "c est quoi ton nom", etc.
    const nameWords=s.split(/\s+/).filter(Boolean);
    const hasNearAppelle=nameWords.some(w=>{
      if(w.length<4 || w.length>10) return false;
      return ['appelle','appelles','appele','appeler','appel','apelle','apell','apel'].some(target=>editDistance(w,target)<=2);
    });
    const identityByName = /\b(ton|votre)\s+nom\b/.test(s) ||
      /\byour\s+name\b/.test(s) ||
      /\b(dein|deine)\s+name\b/.test(s) ||
      /\b(tuo|tuoi)\s+nome\b/.test(s);
    const identityByCall = hasNearAppelle && /\b(tu|t|toi|comment|wie|come|what)\b/.test(s);
    const identityDirect = /\b(qui es tu|t es qui|tu es qui|who are you|wer bist du|chi sei)\b/.test(s);
    if(identityByName || identityByCall || identityDirect) return 'name';

    const patterns = {
      goodMorning:[
        /^(bonjour bon matin|bon matin|bonne matinee)$/,
        /^(guten morgen)$/,
        /^(buongiorno)$/,
        /^(good morning|morning)$/

        /^(buonasera)$/,
        /^(good evening|evening)$/

      // recherche et accrochait scooter-bar-materials avec un ecart de 8,
      // donc meme la regle de confiance ne la rattrapait pas. Les riders
      // ecrivent vite : on couvre les variantes et les abreviations.
      greeting:[
        /^(salut|salutation|salutations|bonjour|bjr|bonsoir|hello|helo|hey|heyy+|coucou|cc|yo|yoo+|slt|wesh|hola|salu|salutt)( ridy| lya)?[!. ]*$/,
        /^(hallo|hi|hii+|hey|servus|moin|gruezi|gruessech)( ridy| lya)?[!. ]*$/,
        /^(ciao|salve|hey)( ridy| lya)?[!. ]*$/,
        /^(hello|hi|hey|yo|sup|whats up|what s up)( ridy| lya)?[!. ]*$/
      ],
      howAreYou:[
        /^(?:(?:salut|bonjour|hello|hey|coucou|yo|slt|wesh|hola)\s+)?(?:(?:ca|sa) va|sava|comment (?:ca|sa) va|comment vas tu|tu vas bien|comment tu vas)( ridy)?[?. ]*$/,
        /^(?:(?:hallo|hi|hey|servus)\s+)?(?:wie geht es dir|wie gehts|alles gut)[?. ]*$/,
        /^(?:(?:ciao|salve|hey)\s+)?(?:come stai|tutto bene|come va)[?. ]*$/,
        /^(?:(?:hello|hi|hey|yo)\s+)?(?:how are you|how are u|you good|how is it going|how s it going)[?. ]*$/
      ],
      thanks:[
        /^(?:(?:ok|okay|d accord|dac|parfait|super|cool|top|oui|ouais|yes|ja|bene|va bene)[, ]+)?(?:merci(?: beaucoup)?|thanks|thank you|thx|danke(?: schon)?|grazie(?: mille)?)[!. ]*$/,
        /^(?:merci(?: beaucoup)?|thanks|thank you|thx|danke(?: schon)?|grazie(?: mille)?)[, ]+(?:ok|okay|d accord|dac|parfait|super|cool|top|oui|ouais|yes|ja|bene|va bene)[!. ]*$/
      ],
      bye:[
        /^(au revoir|a bientot|a plus|bye|ciao|tschuss|tschuss|bis bald|see you|see ya|goodbye)[!. ]*$/
      ],
      name:[
        /(comment tu t appelles|comment tu t appelle|comment tu t apel|comment tu t apell|tu t appelles comment|tu t appelle comment|tu t apel comment|tu t apell comment|quel est ton nom|c est quoi ton nom|c quoi ton nom|ton nom c est quoi|qui es tu|tu es qui|t es qui|wie heisst du|wie ist dein name|wer bist du|come ti chiami|qual e il tuo nome|chi sei|what is your name|what s your name|whats your name|who are you)/

      ],
      whatCanYouDo:[
        /(tu peux faire quoi|que peux tu faire|a quoi tu sers|was kannst du|cosa puoi fare|what can you do|what do you do)/

      areYouAI:[
        /(tu es une ia|es tu une ia|intelligence artificielle|bist du eine ki|sei un ia|sei una ia|are you ai|are you an ai)/

        /^(avec plaisir|volontiers|bien sur|ca marche|sa marche|pas de souci|pourquoi pas|gerne|sehr gerne|klar|naturlich|con piacere|volentieri|certo|sure|of course|with pleasure|sounds good)[!. ]*$/

  function riderDisplayName(entry){
    if(!entry || entry.category!=='Riders') return '';
    const qfr=(entry.questions&&entry.questions.fr)||'';
    const m=qfr.match(/^Qui est (.+?) \?$/i);
    return m ? m[1].trim() : '';
