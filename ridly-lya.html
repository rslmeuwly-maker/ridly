’appuie sur rails, ledges, marches, gaps et curbs. La notation valorise précision, contrôle, originalité, grinds/slides, manuals et lignes propres ; exemples : feeble, smith, boardslide ou nose manual.","de":"Bei RSL nutzt Street Rails, Ledges, Treppen, Gaps und Curbs. Bewertet werden Präzision, Kontrolle, Originalität, Grinds/Slides, Manuals und saubere Lines; Beispiele sind Feeble, Smith, Boardslide oder Nose Manual.","it":"Per RSL lo Street usa rail, ledge, scale, gap e curb. Si valorizzano precisione, controllo, originalità, grind/slide, manual e linee pulite; esempi: feeble, smith, boardslide e nose manual.","en":"In RSL, Street uses rails, ledges, stairs, gaps and curbs. Precision, control, originality, grinds/slides, manuals and clean lines matter; examples include feeble, smith, boardslide and nose manual."},"keywords":["street","rail","ledge","gap","curb","grind","slide","manual","feeble","smith","boardslide"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-contest-formats","category":"RSL","questions":{"fr":"Quels formats de contest utilise la RSL ?","de":"Welche Contest-Formate nutzt RSL?","it":"Quali formati di contest usa RSL?","en":"What contest formats does RSL use?"},"answer":{"fr":"La base RSL prévoit plusieurs formats : Run de 45 à 60 secondes, Best Trick (par exemple 5 essais, 2 minutes ou trick mis en banque), Best Line et Jam. Le format exact peut être adapté au skatepark et au nombre de riders.","de":"RSL nennt mehrere Basisformate: 45–60 Sekunden Run, Best Trick (z.B. 5 Versuche, 2 Minuten oder „banked trick“), Best Line und Jam. Das genaue Format kann an Park und Teilnehmerzahl angepasst werden.","it":"La base RSL prevede: Run da 45–60 secondi, Best Trick (per esempio 5 tentativi, 2 minuti o trick “in banca”), Best Line e Jam. Il formato può essere adattato al park e al numero di rider.","en":"RSL’s base formats include a 45–60 second Run, Best Trick (for example 5 attempts, 2 minutes or a banked trick), Best Line and Jam. The exact format can be adapted to the park and rider count."},"keywords":["format","run","best trick","best line","jam","45 60","5 essais"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-scoring","category":"RSL","questions":{"fr":"Comment la RSL note une run ?","de":"Wie bewertet RSL einen Run?","it":"Come valuta RSL una run?","en":"How does RSL score a run?"},"answer":{"fr":"La base de notation RSL est sur 100 points : difficulté 40, exécution/propreté 30, style/flow 20 et créativité 10. Une réception sketchy peut compter mais être fortement pénalisée.","de":"Die RSL-Basiswertung geht bis 100 Punkte: Schwierigkeit 40, Ausführung/Sauberkeit 30, Style/Flow 20 und Kreativität 10. Eine sketchy Landung kann zählen, wird aber stark abgewertet.","it":"La base RSL è su 100 punti: difficoltà 40, esecuzione/pulizia 30, stile/flow 20 e creatività 10. Un atterraggio sketchy può contare ma essere penalizzato molto.","en":"RSL’s base scoring is out of 100: difficulty 40, execution/cleanliness 30, style/flow 20 and creativity 10. A sketchy landing can count but be heavily penalised."},"keywords":["notation","scoring","100 points","difficulté","exécution","style","flow","créativité","40 30 20 10","sketchy"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-runs","category":"RSL","questions":{"fr":"Combien de runs en compétition RSL ?","de":"Wie viele Runs gibt es bei RSL?","it":"Quante run ci sono in gara RSL?","en":"How many runs are there in RSL competition?"},"answer":{"fr":"Le règlement de base indique 2 runs en qualification et 2 runs en finale, avec le meilleur run qui compte. Ce format peut être adapté selon l’événement.","de":"Die Grundregel nennt 2 Qualifikations-Runs und 2 Final-Runs, wobei der beste Run zählt. Je nach Event kann das Format angepasst werden.","it":"Il regolamento base indica 2 run in qualifica e 2 run in finale, con la migliore che conta. Il formato può essere adattato all’evento.","en":"The base rule is 2 qualifying runs and 2 final runs, with the best run counting. The format may be adapted for a specific event."},"keywords":["2 runs","qualification","finale","qualif","best run","meilleur run"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-tie","category":"RSL","questions":{"fr":"Que se passe-t-il en cas d’égalité RSL ?","de":"Was passiert bei Gleichstand bei RSL?","it":"Cosa succede in caso di parità RSL?","en":"What happens in an RSL tie?"},"answer":{"fr":"La règle de base donne priorité au run le plus propre, puis au trick le plus difficile si l’égalité reste.","de":"Die Grundregel gibt zuerst dem saubereren Run den Vorrang und danach, falls nötig, dem schwierigeren Trick.","it":"La regola base dà priorità alla run più pulita e poi, se necessario, al trick più difficile.","en":"The base rule gives priority to the cleaner run, then to the harder trick if a tie remains."},"keywords":["égalité","tie","gleichstand","parità","propre","harder trick"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-helmet","category":"RSL","questions":{"fr":"Le casque est-il obligatoire en compétition RSL ?","de":"Ist ein Helm bei RSL Pflicht?","it":"Il casco è obbligatorio nelle gare RSL?","en":"Is a helmet mandatory at RSL competitions?"},"answer":{"fr":"Oui. Le règlement RSL de base rend le casque obligatoire pour tous les riders et toutes les catégories. Les protections genoux/coudes sont recommandées et peuvent être imposées selon la catégorie ou l’événement.","de":"Ja. Das RSL-Grundreglement schreibt für alle Rider und Kategorien einen Helm vor. Knie- und Ellbogenschoner werden empfohlen und können je nach Kategorie/Event vorgeschrieben werden.","it":"Sì. Il regolamento base RSL rende il casco obbligatorio per tutti i rider e categorie. Ginocchiere e gomitiere sono raccomandate e possono essere imposte secondo categoria/evento.","en":"Yes. The base RSL rules require a helmet for every rider and category. Knee and elbow pads are recommended and may be required depending on category/event."},"keywords":["casque","helmet","helm","casco","obligatoire","protection","genoux","coudes","pads"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-courses","category":"RSL","questions":{"fr":"La RSL donne-t-elle des cours ?","de":"Bietet RSL Kurse an?","it":"RSL organizza corsi?","en":"Does RSL offer courses?"},"answer":{"fr":"Oui. La RSL propose des cours et stages en skatepark pour plusieurs niveaux, encadrés par des coachs formés RSL. La page d’inscription permet de filtrer les séances par mois, lieu et disponibilité.","de":"Ja. RSL bietet Skatepark-Kurse und Camps für verschiedene Niveaus mit ausgebildeten RSL-Coaches an. Auf der Anmeldeseite lassen sich Termine nach Monat, Ort und Verfügbarkeit filtern.","it":"Sì. RSL propone corsi e stage in skatepark per diversi livelli, seguiti da coach formati RSL. La pagina iscrizioni permette di filtrare per mese, luogo e disponibilità.","en":"Yes. RSL offers skatepark courses and camps for different levels, run by trained RSL coaches. The registration page can filter sessions by month, location and availability."},"keywords":["cours","course","kurs","corsi","stage","coach","skatepark","inscription"],"source":{"label":"RSL – Cours","url":"https://rsl-swiss.ch/cours"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-course-registration","category":"RSL","questions":{"fr":"Quelles infos faut-il pour inscrire un rider à un cours RSL ?","de":"Welche Angaben braucht man für einen RSL-Kurs?","it":"Quali dati servono per iscriversi a un corso RSL?","en":"What information is needed to register for an RSL course?"},"answer":{"fr":"Le panier cours demande les infos du payeur et du rider, l’âge du rider, et permet une remarque médicale/allergie. Il prévoit l’attestation du représentant légal, l’acceptation de la décharge et de l’intervention en urgence ; l’autorisation photo/vidéo est optionnelle.","de":"Die Kursanmeldung fragt nach Daten des Zahlers und Riders, Alter sowie optional medizinischen Hinweisen/Allergien. Vorgesehen sind Zustimmung des gesetzlichen Vertreters, Haftungs-/Notfallbestätigung; Foto/Video-Einwilligung ist optional.","it":"L’iscrizione ai corsi chiede i dati del pagante e del rider, l’età e un’eventuale nota medica/allergia. Prevede attestazione del rappresentante legale, accettazione della liberatoria/intervento d’urgenza; foto/video è opzionale.","en":"Course checkout asks for payer and rider details, rider age and an optional medical/allergy note. It includes legal-guardian confirmation, waiver/emergency-care consent, with photo/video permission optional."},"keywords":["inscrire cours","registration","payeur","rider age","allergie","représentant légal","décharge","photo vidéo"],"source":{"label":"RSL – Panier cours","url":"https://rsl-swiss.ch/panier/panier"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-coach-training","category":"RSL","questions":{"fr":"C’est quoi la formation Moniteur RSL ?","de":"Was ist die RSL-Coach-Ausbildung?","it":"Cos’è la formazione Monitore RSL?","en":"What is the RSL coach training?"},"answer":{"fr":"La formation Moniteur RSL est une journée complète d’environ 6–7 heures mêlant pédagogie, encadrement, sécurité skatepark, pratique et module Samaritains BLS-AED. Elle vise les riders/adultes qui souhaitent encadrer des jeunes proprement.","de":"Die RSL-Coach-Ausbildung ist ein ganzer Tag von etwa 6–7 Stunden mit Pädagogik, Gruppenführung, Skatepark-Sicherheit, Praxis und Samariter-BLS-AED-Modul. Sie richtet sich an Rider/Erwachsene, die Jugendliche betreuen möchten.","it":"La formazione Monitore RSL dura circa 6–7 ore e unisce pedagogia, gestione del gruppo, sicurezza in skatepark, pratica e modulo Samaritani BLS-AED. È rivolta a rider/adulti che vogliono seguire giovani.","en":"RSL Coach Training is a full 6–7 hour day combining pedagogy, supervision, skatepark safety, practice and a Samaritan BLS-AED module. It targets riders/adults who want to coach young people properly."},"keywords":["formation","moniteur","coach training","ausbildung","formazione","bls","aed","samaritains","6 7h"],"source":{"label":"RSL – Formation","url":"https://rsl-swiss.ch/formation"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-coach-price","category":"RSL","questions":{"fr":"Combien coûte la formation Moniteur RSL ?","de":"Was kostet die RSL-Coach-Ausbildung?","it":"Quanto costa la formazione Monitore RSL?","en":"How much is RSL coach training?"},"answer":{"fr":"La page formation affiche 249 CHF par personne comme prix de lancement 2026, avec un prix plein annoncé à 350 CHF. Comme les tarifs peuvent évoluer, vérifie la page officielle avant l’inscription.","de":"Die Ausbildungsseite zeigt 249 CHF pro Person als Einführungspreis 2026 und 350 CHF als Vollpreis. Da Preise sich ändern können, bitte vor Anmeldung die offizielle Seite prüfen.","it":"La pagina formazione mostra 249 CHF a persona come prezzo lancio 2026 e 350 CHF come prezzo pieno. I prezzi possono cambiare: verifica la pagina ufficiale prima dell’iscrizione.","en":"The training page lists CHF 249 per person as a 2026 launch price and CHF 350 as the full price. Prices can change, so check the official page before registering."},"keywords":["prix formation","249","350","coach price","kosten ausbildung","prezzo formazione"],"source":{"label":"RSL – Formation","url":"https://rsl-swiss.ch/formation"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-coach-program","category":"RSL","questions":{"fr":"Que contient le programme de formation RSL ?","de":"Was enthält das RSL-Ausbildungsprogramm?","it":"Cosa comprende il programma di formazione RSL?","en":"What is in the RSL training programme?"},"answer":{"fr":"Le programme publié couvre rôle/responsabilité du moniteur, relation avec les parents, pédagogie et progression, communication et gestion de groupe, BLS-AED/144 et traumatologie, lecture du park et des risques, mini-cours pratique, feedback et validation.","de":"Das veröffentlichte Programm umfasst Rolle/Verantwortung des Coaches, Elternkontakt, Pädagogik/Progression, Kommunikation/Gruppenführung, BLS-AED/144 und Verletzungen, Park-/Risikoanalyse, Praxis-Minilektion, Feedback und Abschluss.","it":"Il programma pubblicato comprende ruolo/responsabilità del coach, rapporto con i genitori, pedagogia/progressione, comunicazione/gestione gruppo, BLS-AED/144 e traumatologia, lettura dei rischi del park, mini-lezione pratica, feedback e validazione.","en":"The published programme covers coach role/responsibility, parent relationships, pedagogy/progression, communication/group management, BLS-AED/144 and injuries, park/risk assessment, a practical mini-class, feedback and validation."},"keywords":["programme formation","pédagogie","parents","144","traumatologie","sécurité","mini cours","validation"],"source":{"label":"RSL – Formation","url":"https://rsl-swiss.ch/formation"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-sponsors","category":"RSL","questions":{"fr":"Comment sponsoriser la RSL ?","de":"Wie kann man RSL sponsern?","it":"Come si sponsorizza RSL?","en":"How can I sponsor RSL?"},"answer":{"fr":"La page d’accueil 2026 affiche des packs de soutien avec visibilité sur le site, les events et les réseaux : Bronze 100 CHF, Argent 250 CHF et Or 500 CHF+. Vérifie les offres actuelles sur le site avant engagement.","de":"Die Startseite 2026 zeigt Sponsoring-Pakete mit Sichtbarkeit auf Website, Events und Social Media: Bronze 100 CHF, Silber 250 CHF und Gold 500 CHF+. Vor einer Zusage bitte die aktuellen Angebote prüfen.","it":"La home 2026 mostra pacchetti sponsor con visibilità su sito, eventi e social: Bronzo 100 CHF, Argento 250 CHF e Oro 500 CHF+. Verifica l’offerta attuale prima di confermare.","en":"The 2026 homepage lists sponsorship packages with visibility on the website, events and social media: Bronze CHF 100, Silver CHF 250 and Gold CHF 500+. Check current offers before committing."},"keywords":["sponsor","sponsoring","bronze","argent","or","gold","silver","100","250","500"],"source":{"label":"RSL","url":"https://rsl-swiss.ch/"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-rental","category":"RSL","questions":{"fr":"La RSL loue-t-elle du matériel pour les événements ?","de":"Vermietet RSL Event-Material?","it":"RSL noleggia materiale per eventi?","en":"Does RSL rent event equipment?"},"answer":{"fr":"Oui. La RSL propose location de matériel, initiations, démonstrations et animations. Le matériel publié comprend notamment une sonorisation Alto Professional complète et une table de brasserie pliante ; disponibilité, transport, durée et tarif sont confirmés au cas par cas.","de":"Ja. RSL bietet Materialmiete, Einführungen, Demos und Animationen. Veröffentlicht sind u.a. ein komplettes Alto-Professional-Soundsystem und ein Klapptisch; Verfügbarkeit, Transport, Dauer und Preis werden individuell bestätigt.","it":"Sì. RSL propone noleggio materiale, introduzioni, demo e animazioni. Tra il materiale pubblicato ci sono un impianto audio Alto Professional completo e un tavolo pieghevole; disponibilità, trasporto, durata e prezzo sono confermati caso per caso.","en":"Yes. RSL offers equipment rental, initiations, demos and event activities. Published equipment includes a complete Alto Professional sound system and a folding table; availability, transport, duration and price are confirmed case by case."},"keywords":["location matériel","rental","sonorisation","alto","table","event equipment","mieten","noleggio"],"source":{"label":"RSL – Location","url":"https://rsl-swiss.ch/location-rsl"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-sound-system","category":"RSL","questions":{"fr":"Quelle sonorisation la RSL loue-t-elle ?","de":"Welche Tonanlage vermietet RSL?","it":"Quale impianto audio noleggia RSL?","en":"What sound system does RSL rent?"},"answer":{"fr":"La liste actuelle indique 2 enceintes actives Alto TX412 12 pouces, 1 caisson TX18S 18 pouces, une table de mixage TrueMix 800FX, 2 supports d’enceintes, un micro, un pied de micro et les câbles nécessaires.","de":"Die aktuelle Liste nennt 2 aktive Alto TX412 12-Zoll-Lautsprecher, 1 TX18S 18-Zoll-Subwoofer, TrueMix 800FX Mischpult, 2 Lautsprecherstative, Mikrofon, Mikrofonständer und benötigte Kabel.","it":"L’elenco attuale indica 2 casse attive Alto TX412 da 12\", 1 subwoofer TX18S da 18\", mixer TrueMix 800FX, 2 supporti casse, microfono, asta microfono e cavi necessari.","en":"The current list shows 2 Alto TX412 12-inch active speakers, 1 TX18S 18-inch subwoofer, a TrueMix 800FX mixer, 2 speaker stands, a microphone, mic stand and required cables."},"keywords":["alto tx412","tx18s","truemix","sonorisation","sound system","lautsprecher","impianto audio"],"source":{"label":"RSL – Location","url":"https://rsl-swiss.ch/location-rsl"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-shop","category":"RSL","questions":{"fr":"Qu’est-ce qu’on trouve au Shop RSL ?","de":"Was gibt es im RSL Shop?","it":"Cosa si trova nello Shop RSL?","en":"What is in the RSL Shop?"},"answer":{"fr":"Le Shop RSL présente du textile officiel, des protections et une sélection de trottinettes recommandées. La page a notamment affiché des produits Versatyl, S2S, Ethic et ALK13 ; stock, prix et disponibilité peuvent changer.","de":"Der RSL Shop zeigt offizielles Textil, Schutzausrüstung und eine Auswahl empfohlener Scooter. Auf der Seite wurden u.a. Versatyl-, S2S-, Ethic- und ALK13-Produkte gezeigt; Bestand, Preise und Verfügbarkeit können sich ändern.","it":"Lo Shop RSL presenta abbigliamento ufficiale, protezioni e una selezione di monopattini consigliati. La pagina ha mostrato prodotti Versatyl, S2S, Ethic e ALK13; stock, prezzi e disponibilità possono cambiare.","en":"The RSL Shop presents official apparel, protection and a selection of recommended scooters. The page has featured Versatyl, S2S, Ethic and ALK13 products; stock, prices and availability can change."},"keywords":["shop rsl","merch","hoodie","tshirt","alk13","versatyl","s2s","ethic","produits"],"source":{"label":"RSL – Shop","url":"https://rsl-swiss.ch/shop-rsl"},"dynamic":true,"verified":"2026-08-26"},{"id":"rsl-size-guide","category":"RSL","questions":{"fr":"Quelle taille de trottinette choisir selon ma taille ?","de":"Welche Scooter-Höhe passt zu meiner Körpergröße?","it":"Quale altezza di monopattino scegliere?","en":"What scooter height should I choose for my height?"},"answer":{"fr":"Repère RSL de hauteur totale (sol au sommet du guidon) : <100 cm → 65–69 ; 100–110 → 69–72 ; 110–120 → 72–75 ; 120–130 → 75–77 ; 130–140 → 77–80 ; 140–150 → 80–84 ; 150–160 → 84–88 ; 160–170 → 88–94 ; 170–180 → 94–100 ; 180+ → 100+ cm. C’est un point de départ, le style et les préférences comptent aussi.","de":"RSL-Richtwert Gesamthöhe (Boden bis Bar-Oberkante): <100 cm → 65–69; 100–110 → 69–72; 110–120 → 72–75; 120–130 → 75–77; 130–140 → 77–80; 140–150 → 80–84; 150–160 → 84–88; 160–170 → 88–94; 170–180 → 94–100; 180+ → 100+ cm. Fahrstil und Vorlieben zählen ebenfalls.","it":"Riferimento RSL altezza totale (terra-cima manubrio): <100 cm → 65–69; 100–110 → 69–72; 110–120 → 72–75; 120–130 → 75–77; 130–140 → 77–80; 140–150 → 80–84; 150–160 → 84–88; 160–170 → 88–94; 170–180 → 94–100; 180+ → 100+ cm. Stile e preferenze contano comunque.","en":"RSL total-height guide (ground to top of bar): <100 cm → 65–69; 100–110 → 69–72; 110–120 → 72–75; 120–130 → 75–77; 130–140 → 77–80; 140–150 → 80–84; 150–160 → 84–88; 160–170 → 88–94; 170–180 → 94–100; 180+ → 100+ cm. Riding style and preference also matter."},"keywords":["taille trottinette","hauteur","size guide","körpergröße","altezza","65 69","94 100","guidon"],"source":{"label":"RSL – Guide tailles","url":"https://rsl-swiss.ch/shop-rsl"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-broomstick","category":"RSL","questions":{"fr":"C’est quoi la méthode du manche à balai pour la taille ?","de":"Was ist die Besenstiel-Methode für die Scooter-Höhe?","it":"Cos’è il metodo del manico di scopa?","en":"What is the broomstick method for scooter height?"},"answer":{"fr":"La méthode RSL : place un manche à balai à la hauteur souhaitée du guidon, souvent autour de la hanche, mesure la distance jusqu’au sol puis ajoute environ 5 cm pour estimer la hauteur totale de la trottinette.","de":"RSL-Methode: Halte einen Besenstiel auf gewünschter Lenkerhöhe, oft etwa an der Hüfte, miss bis zum Boden und addiere ungefähr 5 cm für die geschätzte Gesamthöhe des Scooters.","it":"Metodo RSL: posiziona un manico di scopa all’altezza desiderata del manubrio, spesso circa all’anca, misura fino a terra e aggiungi circa 5 cm per stimare l’altezza totale del monopattino.","en":"RSL method: hold a broomstick at your desired bar height, often around the hip, measure to the ground and add about 5 cm to estimate total scooter height."},"keywords":["manche à balai","broomstick","besenstiel","manico di scopa","taille","hauteur"],"source":{"label":"RSL – Guide tailles","url":"https://rsl-swiss.ch/shop-rsl"},"dynamic":false,"verified":"2026-08-26"},{"id":"rsl-ridly-link","category":"RSL","questions":{"fr":"Quel est le lien entre RSL et RIDLY ?","de":"Wie hängen RSL und RIDLY zusammen?","it":"Qual è il legame tra RSL e RIDLY?","en":"How are RSL and RIDLY connected?"},"answer":{"fr":"RSL renvoie vers une carte des spots et skateparks connectée à RIDLY. RIDLY apporte la partie application/sociale : découverte des spots, riders, clips, profils, feed et games.","de":"RSL verweist auf eine mit RIDLY verbundene Spot-/Skatepark-Karte. RIDLY bringt den App-/Social-Teil: Spots entdecken, Rider, Clips, Profile, Feed und Games.","it":"RSL rimanda a una mappa di spot e skatepark collegata a RIDLY. RIDLY aggiunge la parte app/social: scoperta spot, rider, clip, profili, feed e giochi.","en":"RSL links to a spot/skatepark map connected to RIDLY. RIDLY provides the app/social side: discovering spots, riders, clips, profiles, feed and games."},"keywords":["ridly rsl","lien rsl ridly","connected","carte spots","verbindung","collegamento"],"source":{"label":"RSL","url":"https://rsl-swiss.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-overview","category":"JF Ride Shop","questions":{"fr":"C’est quoi JF Rideshop ?","de":"Was ist JF Rideshop?","it":"Cos’è JF Rideshop?","en":"What is JF Rideshop?"},"answer":{"fr":"JF Rideshop est un shop suisse spécialisé dans la trottinette freestyle, le skate et les sports de ride. Il fonctionne aujourd’hui principalement en ligne et reste présent sur certains événements, contests, cours et déplacements en Suisse romande.","de":"JF Rideshop ist ein Schweizer Shop für Freestyle-Scooter, Skate und Actionsport. Heute funktioniert er hauptsächlich online und ist weiterhin bei ausgewählten Events, Contests, Kursen und Terminen in der Romandie präsent.","it":"JF Rideshop è uno shop svizzero specializzato in monopattino freestyle, skate e sport di ride. Oggi funziona principalmente online e resta presente in alcuni eventi, contest, corsi e trasferte nella Svizzera romanda.","en":"JF Rideshop is a Swiss shop specialising in freestyle scooters, skate and ride sports. It now operates mainly online while remaining present at selected events, contests, courses and trips in French-speaking Switzerland."},"keywords":["jf","jfrideshop","jf rideshop","shop suisse","trottinette","skate","online"],"source":{"label":"JF Rideshop – À propos","url":"https://www.jfrideshop.ch/en/about-us"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-history-2017","category":"JF Ride Shop","questions":{"fr":"Quand JF Rideshop a-t-il commencé ?","de":"Wann begann JF Rideshop?","it":"Quando è iniziato JF Rideshop?","en":"When did JF Rideshop start?"},"answer":{"fr":"L’histoire remonte à 2017 avec J&F Skateboards, créé par Joël et Frank. Entre 2017 et 2019, un petit magasin à Rue développe des skates et longboards artisanaux, de la trottinette freestyle et du matériel graffiti sous le nom JF-Skateboards.","de":"Die Geschichte beginnt 2017 mit J&F Skateboards, gegründet von Joël und Frank. Von 2017 bis 2019 entwickelte ein kleiner Laden in Rue handgefertigte Skate-/Longboards, Freestyle-Scooter und Graffiti-Material unter dem Namen JF-Skateboards.","it":"La storia inizia nel 2017 con J&F Skateboards, creato da Joël e Frank. Tra 2017 e 2019 un piccolo negozio a Rue sviluppa skate e longboard artigianali, monopattini freestyle e materiale graffiti con il nome JF-Skateboards.","en":"The story goes back to 2017 with J&F Skateboards, created by Joël and Frank. From 2017 to 2019 a small shop in Rue developed handmade skate/longboards, freestyle scooters and graffiti gear under the JF-Skateboards name."},"keywords":["histoire jf","history jf","2017","j&f skateboards","jf-skateboards","rue","frank","joel"],"source":{"label":"JF Rideshop – À propos","url":"https://www.jfrideshop.ch/en/about-us"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-history-2021","category":"JF Ride Shop","questions":{"fr":"Quand JF Ride Shop Sàrl a-t-elle été créée ?","de":"Wann entstand JF Ride Shop Sàrl?","it":"Quando è nata JF Ride Shop Sàrl?","en":"When was JF Ride Shop Sàrl created?"},"answer":{"fr":"Entre 2020 et 2021, Jérémie rejoint le projet et aide à développer le web et la structure. Mi-2021, l’activité devient officiellement JF Ride Shop Sàrl à Montreux.","de":"Zwischen 2020 und 2021 kam Jérémie zum Projekt und half beim Web-/Strukturaufbau. Mitte 2021 wurde daraus offiziell JF Ride Shop Sàrl in Montreux.","it":"Tra 2020 e 2021 Jérémie entra nel progetto e aiuta a sviluppare web e struttura. A metà 2021 l’attività diventa ufficialmente JF Ride Shop Sàrl a Montreux.","en":"Between 2020 and 2021 Jérémie joined the project and helped develop the web/structure. In mid-2021 the business officially became JF Ride Shop Sàrl in Montreux."},"keywords":["2020","2021","jeremie","sàrl","montreux","creation company"],"source":{"label":"JF Rideshop – À propos","url":"https://www.jfrideshop.ch/en/about-us"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-online-only","category":"JF Ride Shop","questions":{"fr":"Le magasin JF Rideshop est-il encore ouvert à Montreux ?","de":"Ist der JF-Rideshop in Montreux noch normal geöffnet?","it":"Il negozio JF Rideshop a Montreux è ancora aperto normalmente?","en":"Is the JF Rideshop store in Montreux still normally open?"},"answer":{"fr":"JF Rideshop est désormais principalement en ligne. Le magasin physique n’est plus exploité comme une boutique classique avec des horaires fixes ; le shop reste visible sur certains événements, contests et cours.","de":"JF Rideshop ist inzwischen hauptsächlich online. Der physische Laden wird nicht mehr als klassisches Geschäft mit festen Öffnungszeiten betrieben; der Shop ist weiterhin bei ausgewählten Events, Contests und Kursen präsent.","it":"JF Rideshop è ormai principalmente online. Il negozio fisico non funziona più come una boutique classica con orari fissi; lo shop resta presente in alcuni eventi, contest e corsi.","en":"JF Rideshop is now mainly online. The physical shop no longer operates as a traditional store with fixed hours; the shop remains present at selected events, contests and courses."},"keywords":["magasin montreux","shop montreux","ouvert","opening hours","online","laden","negozio"],"source":{"label":"JF Rideshop – À propos","url":"https://www.jfrideshop.ch/en/about-us"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-products","category":"JF Ride Shop","questions":{"fr":"Que vend JF Rideshop ?","de":"Was verkauft JF Rideshop?","it":"Cosa vende JF Rideshop?","en":"What does JF Rideshop sell?"},"answer":{"fr":"L’univers JF comprend notamment trottinettes freestyle complètes et pièces, skateboards, longboards, rollers/skates, protections et casques, vêtements, chaussures, street-art/graffiti, cartes cadeaux et divers produits de ride. Le site mentionne aussi des produits hiver comme snowscoot/snowskate et le S-Downboards.","de":"JF führt unter anderem komplette Freestyle-Scooter und Teile, Skateboards, Longboards, Roll-/Skates, Schutz/Helme, Kleidung, Schuhe, Street-Art/Graffiti, Gutscheine und weitere Ride-Produkte. Die Website nennt auch Winterprodukte wie Snowscoot/Snowskate und S-Downboards.","it":"JF propone tra l’altro monopattini freestyle completi e pezzi, skateboard, longboard, roller/skate, protezioni e caschi, abbigliamento, scarpe, street-art/graffiti, carte regalo e altri prodotti ride. Il sito cita anche snowscoot/snowskate e S-Downboards.","en":"JF carries complete freestyle scooters and parts, skateboards, longboards, roller/skates, protection and helmets, clothing, shoes, street-art/graffiti, gift cards and other ride products. The site also mentions winter products such as snowscoot/snowskate and S-Downboards."},"keywords":["produits","products","trottinette","pièces","skateboard","longboard","roller","casque","graffiti","snowscoot","snowskate"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-mission","category":"JF Ride Shop","questions":{"fr":"Quelle est la mission de JF Rideshop ?","de":"Was ist die Mission von JF Rideshop?","it":"Qual è la missione di JF Rideshop?","en":"What is JF Rideshop’s mission?"},"answer":{"fr":"JF Rideshop explique vouloir conseiller les riders, proposer du bon matériel, offrir un produit local et soutenir/développer la scène ride et graffiti suisse.","de":"JF Rideshop beschreibt seine Mission als Beratung der Rider, gutes Material anzubieten und die Schweizer Ride- und Graffiti-Szene mit einem lokalen Ansatz zu unterstützen.","it":"JF Rideshop indica come missione consigliare i rider, proporre buon materiale e sostenere/sviluppare la scena ride e graffiti svizzera con un approccio locale.","en":"JF Rideshop describes its mission as advising riders, offering good equipment and supporting/developing the Swiss ride and graffiti scene with a local approach."},"keywords":["mission","objectif","scene suisse","support riders","graffiti","local"],"source":{"label":"JF Rideshop – À propos","url":"https://www.jfrideshop.ch/en/about-us"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-contact","category":"JF Ride Shop","questions":{"fr":"Comment contacter JF Rideshop ?","de":"Wie kontaktiere ich JF Rideshop?","it":"Come contatto JF Rideshop?","en":"How do I contact JF Rideshop?"},"answer":{"fr":"Le site public indique contact@jfrideshop.ch et le +41 79 330 80 03. Pour une question de compatibilité ou un produit en rupture, le contact direct est utile.","de":"Die öffentliche Website nennt contact@jfrideshop.ch und +41 79 330 80 03. Bei Kompatibilitätsfragen oder ausverkauften Produkten ist direkter Kontakt sinnvoll.","it":"Il sito pubblico indica contact@jfrideshop.ch e +41 79 330 80 03. Per compatibilità o prodotti esauriti è utile contattare direttamente lo shop.","en":"The public website lists contact@jfrideshop.ch and +41 79 330 80 03. Direct contact is useful for compatibility questions or out-of-stock products."},"keywords":["contact jf","email jf","telephone jf","téléphone","contact@jfrideshop.ch","0793308003","+41 79"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-stock","category":"JF Ride Shop","questions":{"fr":"Que faire si un produit JF est en rupture de stock ?","de":"Was tun, wenn ein JF-Produkt ausverkauft ist?","it":"Cosa fare se un prodotto JF è esaurito?","en":"What if a JF product is out of stock?"},"answer":{"fr":"Plusieurs fiches produits indiquent qu’en cas de rupture, il vaut la peine de contacter JF Rideshop car le shop peut souvent commander le produit. Le délai dépend alors du fournisseur.","de":"Mehrere Produktseiten weisen darauf hin, dass man JF Rideshop bei Ausverkauf kontaktieren sollte, da der Shop den Artikel oft bestellen kann. Die Lieferzeit hängt dann vom Lieferanten ab.","it":"Diverse schede prodotto indicano di contattare JF Rideshop in caso di esaurimento, perché spesso lo shop può ordinare l’articolo. I tempi dipendono dal fornitore.","en":"Several product pages say to contact JF Rideshop when an item is out of stock because the shop can often order it. Lead time then depends on the supplier."},"keywords":["rupture stock","out of stock","stock","commander fournisseur","ausverkauft","esaurito"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-payment","category":"JF Ride Shop","questions":{"fr":"Quels moyens de paiement accepte JF Rideshop ?","de":"Welche Zahlungsmittel akzeptiert JF Rideshop?","it":"Quali pagamenti accetta JF Rideshop?","en":"What payment methods does JF Rideshop accept?"},"answer":{"fr":"Les CGV listent PayPal, virement bancaire, carte de débit, TWINT et paiement sur place en cas de retrait. Une commande web est livrée après réception du paiement complet.","de":"Die AGB nennen PayPal, Banküberweisung, Debitkarte, TWINT und Zahlung vor Ort bei Abholung. Webbestellungen werden nach vollständigem Zahlungseingang geliefert.","it":"Le CGV elencano PayPal, bonifico bancario, carta di debito, TWINT e pagamento sul posto in caso di ritiro. Gli ordini web vengono spediti dopo il pagamento completo.","en":"The terms list PayPal, bank transfer, debit card, TWINT and on-site payment for pickup. Web orders are shipped after full payment is received."},"keywords":["paiement","payment","paypal","twint","virement","debit","zahlung","pagamento"],"source":{"label":"JF Rideshop – CGV","url":"https://www.jfrideshop.ch/terms"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-shipping","category":"JF Ride Shop","questions":{"fr":"Quels sont les délais de livraison JF Rideshop ?","de":"Wie lange dauert der Versand bei JF Rideshop?","it":"Quali sono i tempi di consegna JF Rideshop?","en":"What are JF Rideshop shipping times?"},"answer":{"fr":"Les CGV indiquent généralement jusqu’à 5 jours ouvrés après paiement pour les articles en stock et environ 5 à 20 jours ouvrés pour les articles sur commande. Certaines fiches produits affichent des délais plus précis : vérifie toujours la fiche au moment de l’achat.","de":"Die AGB nennen für Lagerware im Allgemeinen bis zu 5 Werktage nach Zahlung und für Bestellware etwa 5–20 Werktage. Einzelne Produktseiten können genauere Zeiten zeigen; bitte beim Kauf prüfen.","it":"Le CGV indicano in generale fino a 5 giorni lavorativi dopo il pagamento per articoli in stock e circa 5–20 giorni lavorativi per articoli su ordinazione. Alcune schede possono indicare tempi più precisi.","en":"The terms generally state up to 5 business days after payment for in-stock items and about 5–20 business days for special-order items. Individual product pages may show more specific times, so check at purchase time."},"keywords":["livraison","shipping","delivery","5 jours","20 jours","délai","versand","consegna"],"source":{"label":"JF Rideshop – CGV","url":"https://www.jfrideshop.ch/terms"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-po-box","category":"JF Ride Shop","questions":{"fr":"JF Rideshop livre-t-il en case postale ?","de":"Liefert JF Rideshop an Postfächer?","it":"JF Rideshop consegna a caselle postali?","en":"Does JF Rideshop deliver to PO boxes?"},"answer":{"fr":"Les CGV indiquent que JF Rideshop ne livre plus les colis en case postale depuis 2022.","de":"Die AGB geben an, dass JF Rideshop seit 2022 keine Pakete mehr an Postfächer liefert.","it":"Le CGV indicano che JF Rideshop non consegna più pacchi a caselle postali dal 2022.","en":"The terms state that JF Rideshop has not delivered parcels to PO boxes since 2022."},"keywords":["case postale","po box","postfach","casella postale","livraison"],"source":{"label":"JF Rideshop – CGV","url":"https://www.jfrideshop.ch/terms"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-returns","category":"JF Ride Shop","questions":{"fr":"Comment retourner un article chez JF Rideshop ?","de":"Wie funktioniert eine Rückgabe bei JF Rideshop?","it":"Come si restituisce un articolo a JF Rideshop?","en":"How do returns work at JF Rideshop?"},"answer":{"fr":"Pour les clients en Suisse, les CGV demandent un retour dans les 7 jours après réception, avec article intact, complet, emballage d’origine, étiquettes et bordereau. Les frais de retour sont à la charge du client. Contacte le shop avant l’envoi pour confirmer la procédure actuelle.","de":"Für Kunden in der Schweiz verlangen die AGB eine Rücksendung innerhalb von 7 Tagen nach Erhalt, vollständig und unbenutzt in Originalverpackung mit Etiketten und Lieferschein. Rücksendekosten trägt der Kunde. Vorher den Shop kontaktieren.","it":"Per i clienti in Svizzera, le CGV chiedono il reso entro 7 giorni dalla ricezione, con articolo integro, completo, imballo originale, etichette e documento di consegna. Le spese di ritorno sono a carico del cliente. Contatta prima lo shop.","en":"For customers in Switzerland, the terms require returns within 7 days of receipt, with the item intact and complete in original packaging with labels and delivery note. Return shipping is paid by the customer. Contact the shop first to confirm the current procedure."},"keywords":["retour","return","échange","exchange","7 jours","rückgabe","reso","emballage"],"source":{"label":"JF Rideshop – CGV","url":"https://www.jfrideshop.ch/terms"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-warranty","category":"JF Ride Shop","questions":{"fr":"Comment fonctionne la garantie JF Rideshop ?","de":"Wie funktioniert die Garantie bei JF Rideshop?","it":"Come funziona la garanzia JF Rideshop?","en":"How does JF Rideshop warranty work?"},"answer":{"fr":"La garantie dépend des conditions du fournisseur du matériel. L’usure normale, le mauvais entretien ou une mauvaise utilisation ne sont pas couverts. Les défauts ou dégâts de transport doivent être signalés rapidement ; les frais de renvoi au fournisseur sont souvent à la charge du client.","de":"Die Garantie richtet sich nach den Bedingungen des jeweiligen Lieferanten. Normale Abnutzung, schlechte Wartung oder falsche Nutzung sind nicht gedeckt. Mängel/Transportschäden schnell melden; Rücksendekosten zum Lieferanten liegen oft beim Kunden.","it":"La garanzia dipende dalle condizioni del fornitore. Usura normale, cattiva manutenzione o uso scorretto non sono coperti. Difetti/danni di trasporto vanno segnalati rapidamente; spesso le spese di invio al fornitore sono a carico del cliente.","en":"Warranty follows the equipment supplier’s terms. Normal wear, poor maintenance or misuse are not covered. Defects/transport damage should be reported quickly; shipping back to the supplier is often paid by the customer."},"keywords":["garantie","warranty","défaut","usure","fournisseur","garantiebedingungen","garanzia"],"source":{"label":"JF Rideshop – CGV","url":"https://www.jfrideshop.ch/terms"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-braderie","category":"JF Ride Shop","questions":{"fr":"Quelles règles pour les articles de braderie JF ?","de":"Welche Regeln gelten für JF-Sale-/Braderie-Artikel?","it":"Quali regole valgono per gli articoli Braderie JF?","en":"What are the rules for JF clearance items?"},"answer":{"fr":"Les CGV précisent que la braderie peut contenir des invendus ou anciennes saisons stockés longtemps. Un emballage marqué ou de petites rayures superficielles ne sont pas automatiquement considérés comme défaut ; les défauts majeurs restent traités selon les conditions annoncées.","de":"Die AGB erklären, dass Braderie-/Clearance-Ware aus älteren Saisons oder länger gelagerten Restbeständen stammen kann. Beschädigte Verpackung oder kleine oberflächliche Kratzer gelten nicht automatisch als Mangel; größere Defekte werden nach den angegebenen Bedingungen behandelt.","it":"Le CGV spiegano che la Braderie può includere invenduti o stagioni precedenti conservati a lungo. Imballi segnati o piccoli graffi superficiali non sono automaticamente difetti; i difetti importanti restano gestiti secondo le condizioni.","en":"The terms explain that clearance items may be old-season/unsold stock stored for a long time. Marked packaging or small superficial scratches are not automatically considered defects; major defects remain handled under the stated conditions."},"keywords":["braderie","clearance","invendus","rayure","ancienne saison","sale","ausverkauf"],"source":{"label":"JF Rideshop – CGV","url":"https://www.jfrideshop.ch/terms"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-wiki","category":"JF Ride Shop","questions":{"fr":"C’est quoi le WIKI-JF ?","de":"Was ist das WIKI-JF?","it":"Cos’è il WIKI-JF?","en":"What is WIKI-JF?"},"answer":{"fr":"WIKI-JF est la partie articles/conseils du site : tutoriels, explications, conseils, actualités riders et sujets comme le sponsoring. Certains articles sont anciens, donc une offre ou réduction citée dans un article historique doit être vérifiée avant achat.","de":"WIKI-JF ist der Artikel-/Ratgeberbereich mit Tutorials, Erklärungen, Tipps, Rider-News und Themen wie Sponsoring. Einige Artikel sind älter; historische Rabatte/Angebote sollten vor einem Kauf geprüft werden.","it":"WIKI-JF è la sezione articoli/consigli con tutorial, spiegazioni, news rider e temi come sponsorizzazione. Alcuni articoli sono vecchi: sconti/offerte storici vanno verificati prima dell’acquisto.","en":"WIKI-JF is the site’s advice/article area with tutorials, explanations, rider news and topics such as sponsorship. Some articles are older, so historical discounts/offers should be checked before purchase."},"keywords":["wiki jf","blog jf","conseil","tutoriel","sponsoring","articles","advice"],"source":{"label":"WIKI-JF","url":"https://www.jfrideshop.ch/blog/wiki-jf-1"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-loyalty-historic","category":"JF Ride Shop","questions":{"fr":"JF Rideshop a-t-il un programme de fidélité ?","de":"Hat JF Rideshop ein Treueprogramm?","it":"JF Rideshop ha un programma fedeltà?","en":"Does JF Rideshop have a loyalty programme?"},"answer":{"fr":"Un article WIKI-JF de 2023 annonçait un programme où 1 CHF donnait 1 point de fidélité. Comme cette information est historique, Lya ne garantit pas qu’elle soit encore valable : vérifie ton compte ou contacte JF avant de compter dessus.","de":"Ein WIKI-JF-Artikel von 2023 kündigte ein Programm an, bei dem 1 CHF = 1 Treuepunkt war. Da diese Information historisch ist, kann Lya nicht bestätigen, dass sie noch gilt; bitte im Konto prüfen oder JF kontaktieren.","it":"Un articolo WIKI-JF del 2023 annunciava 1 CHF = 1 punto fedeltà. Essendo un’informazione storica, Lya non garantisce che sia ancora valida: verifica l’account o contatta JF.","en":"A 2023 WIKI-JF article announced a programme where CHF 1 equalled 1 loyalty point. Because this is historical information, Lya cannot guarantee it is still active; check your account or contact JF."},"keywords":["fidélité","loyalty","1 chf 1 point","points fidélité","treue","fedeltà"],"source":{"label":"WIKI-JF","url":"https://www.jfrideshop.ch/blog/wiki-jf-1"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-association-discount-historic","category":"JF Ride Shop","questions":{"fr":"JF Rideshop fait-il des réductions aux associations ?","de":"Gibt JF Rideshop Vereinsrabatte?","it":"JF Rideshop fa sconti alle associazioni?","en":"Does JF Rideshop offer association discounts?"},"answer":{"fr":"Un article WIKI-JF de 2023 annonçait des réductions pour des membres d’associations sportives de ride. Les conditions pouvant avoir changé, il faut demander au shop si l’offre est encore active et quelles associations sont concernées.","de":"Ein WIKI-JF-Artikel von 2023 kündigte Rabatte für Mitglieder von Ride-Sportvereinen an. Da sich die Bedingungen geändert haben können, bitte beim Shop nach aktuellem Status und berechtigten Vereinen fragen.","it":"Un articolo WIKI-JF del 2023 annunciava sconti per membri di associazioni sportive ride. Le condizioni possono essere cambiate: chiedi allo shop se l’offerta è ancora attiva.","en":"A 2023 WIKI-JF article announced discounts for members of ride-sport associations. Conditions may have changed, so ask the shop whether the offer is still active and which associations qualify."},"keywords":["réduction association","association discount","club discount","rabatt verein","sconto associazione"],"source":{"label":"WIKI-JF","url":"https://www.jfrideshop.ch/blog/wiki-jf-1"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-sponsoring","category":"JF Ride Shop","questions":{"fr":"Que dit JF Rideshop sur le sponsoring rider ?","de":"Was sagt JF Rideshop über Rider-Sponsoring?","it":"Cosa dice JF Rideshop sulla sponsorizzazione rider?","en":"What does JF Rideshop say about rider sponsorship?"},"answer":{"fr":"WIKI-JF possède une série sur le sponsoring : ce qu’est un sponsor et comment savoir si un rider est prêt. L’idée centrale est qu’un sponsoring est un vrai engagement entre shop/marque et rider expérimenté, pas seulement du matériel gratuit.","de":"WIKI-JF enthält eine Sponsoring-Serie: Was Sponsoring ist und wann ein Rider dafür bereit ist. Kernidee: Sponsoring ist eine echte Verpflichtung zwischen Shop/Marke und erfahrenem Rider, nicht nur kostenloses Material.","it":"WIKI-JF contiene una serie sulla sponsorizzazione: cos’è uno sponsor e quando un rider è pronto. Il punto centrale è che una sponsorship è un impegno reale tra shop/marca e rider esperto, non solo materiale gratis.","en":"WIKI-JF has a sponsorship series covering what sponsorship is and when a rider is ready. The core idea is that sponsorship is a real commitment between a shop/brand and an experienced rider, not simply free gear."},"keywords":["sponsoring","sponsor rider","sponsorship","matériel gratuit","contrat rider"],"source":{"label":"WIKI-JF","url":"https://www.jfrideshop.ch/blog/wiki-jf-1"},"dynamic":false,"verified":"2026-08-26"},{"id":"jf-sdownboard","category":"JF Ride Shop","questions":{"fr":"C’est quoi un S-Downboards ?","de":"Was ist ein S-Downboard?","it":"Cos’è un S-Downboard?","en":"What is an S-Downboard?"},"answer":{"fr":"JF a présenté le S-Downboards comme un concept entre longboard et trottinette freestyle. L’article WIKI-JF décrit notamment un neck SDB JF spécifique ; pour les pièces et versions actuellement disponibles, utilise la recherche du shop.","de":"JF präsentierte S-Downboards als Konzept zwischen Longboard und Freestyle-Scooter. Der WIKI-JF-Artikel beschreibt u.a. einen speziellen JF-SDB-Neck; aktuelle Teile/Versionen bitte im Shop suchen.","it":"JF ha presentato S-Downboards come concetto a metà tra longboard e monopattino freestyle. L’articolo WIKI-JF descrive anche un neck SDB JF specifico; per pezzi/versioni attuali usa la ricerca shop.","en":"JF presented S-Downboards as a concept between a longboard and freestyle scooter. The WIKI-JF article describes a specific JF SDB neck; use the shop search for currently available parts/versions."},"keywords":["s-downboards","sdownboard","sdb","longboard trottinette","neck jf"],"source":{"label":"WIKI-JF","url":"https://www.jfrideshop.ch/blog/wiki-jf-1"},"dynamic":true,"verified":"2026-08-26"},{"id":"jf-assortment-online","category":"JF Ride Shop","questions":{"fr":"Tout l’assortiment JF est-il en ligne ?","de":"Ist das ganze JF-Sortiment online?","it":"Tutto l’assortimento JF è online?","en":"Is all JF stock online?"},"answer":{"fr":"Les pages catégories indiquent que la boutique en ligne regroupe environ 98 % de l’assortiment Ride. Si tu ne trouves pas une référence, utilise la recherche du site ou contacte le shop.","de":"Die Kategorieseiten geben an, dass der Onlineshop ungefähr 98 % des Ride-Sortiments enthält. Wenn du etwas nicht findest, nutze die Shop-Suche oder kontaktiere JF.","it":"Le pagine categoria indicano che lo shop online contiene circa il 98% dell’assortimento Ride. Se non trovi un articolo, usa la ricerca o contatta JF.","en":"Category pages state that the online shop contains about 98% of the Ride assortment. If you cannot find an item, use site search or contact JF."},"keywords":["98%","assortiment","catalogue","online shop","boutique en ligne","sortiment"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":true,"verified":"2026-08-26"},{"id":"scooter-parts","category":"Trottinette freestyle","questions":{"fr":"Quelles sont les pièces principales d’une trottinette freestyle ?","de":"Was sind die wichtigsten Teile eines Freestyle-Scooters?","it":"Quali sono i pezzi principali di un monopattino freestyle?","en":"What are the main parts of a freestyle scooter?"},"answer":{"fr":"Les principales pièces sont le deck, le guidon/bar, la fourche, le système de compression, le collier, le jeu de direction, les roues avec roulements, les poignées, les axes et le frein ou fender. La compatibilité entre diamètre de barre, compression, fourche et roues est essentielle.","de":"Wichtige Teile sind Deck, Bar/Lenker, Gabel, Kompressionssystem, Clamp, Headset, Rollen mit Lagern, Griffe, Achsen und Bremse/Fender. Die Kompatibilität von Bar-Durchmesser, Kompression, Gabel und Rollen ist entscheidend.","it":"I pezzi principali sono deck, manubrio/bar, forcella, sistema di compressione, collarino, headset, ruote con cuscinetti, manopole, assi e freno/fender. È fondamentale la compatibilità tra diametro bar, compressione, forcella e ruote.","en":"Main parts are the deck, bar, fork, compression system, clamp, headset, wheels/bearings, grips, axles and brake/fender. Compatibility between bar diameter, compression, fork and wheels is essential."},"keywords":["pièces trottinette","parts","deck","bar","fourche","fork","compression","clamp","roues","wheels","headset"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-bar-height","category":"Trottinette freestyle","questions":{"fr":"À quelle hauteur doit arriver le guidon ?","de":"Wie hoch sollte der Lenker sein?","it":"A che altezza deve arrivare il manubrio?","en":"How high should my scooter bar be?"},"answer":{"fr":"Comme point de départ, le guidon arrive souvent autour de la hanche au nombril. En Street on choisit souvent plus haut pour le confort et le contrôle ; en Park on peut préférer plus bas pour gagner en maniabilité. La taille exacte reste personnelle.","de":"Als Ausgangspunkt liegt die Lenkerhöhe oft ungefähr zwischen Hüfte und Bauchnabel. Street-Rider wählen häufig höher für Komfort/Kontrolle, Park-Rider manchmal tiefer für Beweglichkeit. Die genaue Höhe ist persönlich.","it":"Come punto di partenza il manubrio arriva spesso tra anca e ombelico. Nello Street si sceglie spesso più alto per comfort/controllo, nel Park talvolta più basso per maneggevolezza. La misura esatta è personale.","en":"As a starting point, the bar often sits around hip-to-navel height. Street riders often choose higher for comfort/control, while Park riders may prefer lower for manoeuvrability. Exact height is personal."},"keywords":["hauteur guidon","bar height","nombril","hanche","street park","lenkerhöhe","altezza manubrio"],"source":{"label":"RSL – Guide tailles","url":"https://rsl-swiss.ch/shop-rsl"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-bar-materials","category":"Trottinette freestyle","questions":{"fr":"Quelle matière choisir pour un guidon : acier, alu ou titane ?","de":"Welches Bar-Material: Stahl, Alu oder Titan?","it":"Quale materiale per il manubrio: acciaio, alluminio o titanio?","en":"Which bar material: steel, aluminium or titanium?"},"answer":{"fr":"Chromoly/acier : robuste et généralement plus lourd. Aluminium : très léger mais demande de respecter strictement compatibilités et limites d’usage. Titane : léger, plus souple au ressenti et cher. Le meilleur choix dépend du style, du poids recherché et de la compatibilité du setup.","de":"Chromoly/Stahl: robust und meist schwerer. Aluminium: sehr leicht, aber Kompatibilität und Einsatzgrenzen strikt beachten. Titan: leicht, oft flexibler im Gefühl und teuer. Die Wahl hängt von Fahrstil, gewünschtem Gewicht und Setup-Kompatibilität ab.","it":"Chromoly/acciaio: robusto e in genere più pesante. Alluminio: molto leggero ma richiede compatibilità e limiti d’uso rigorosi. Titanio: leggero, più flessibile come feeling e costoso. La scelta dipende da stile, peso e compatibilità.","en":"Chromoly/steel is robust and usually heavier. Aluminium is very light but requires strict compatibility and use limits. Titanium is light, often feels more flexible and is expensive. Choice depends on style, target weight and setup compatibility."},"keywords":["acier","chromoly","aluminium","alu","titane","titanium","bar material","stahl","titan"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-standard-oversized","category":"Trottinette freestyle","questions":{"fr":"C’est quoi un guidon standard ou oversized ?","de":"Was bedeutet Standard oder Oversized bei Bars?","it":"Cosa significa manubrio standard o oversized?","en":"What is a standard vs oversized scooter bar?"},"answer":{"fr":"En trottinette freestyle, on rencontre surtout un diamètre extérieur de serrage d’environ 31,8 mm pour une barre standard et environ 34,9–35 mm pour une oversized. Vérifie toujours le diamètre interne/externe et le système de compression avant achat.","de":"Bei Freestyle-Scootern liegt der äußere Klemmdurchmesser typischerweise bei ca. 31,8 mm für Standard und ca. 34,9–35 mm für Oversized. Vor Kauf immer Innen-/Außendurchmesser und Kompressionssystem prüfen.","it":"Nel monopattino freestyle il diametro esterno di serraggio è tipicamente circa 31,8 mm per standard e circa 34,9–35 mm per oversized. Verifica sempre diametri e sistema di compressione.","en":"Freestyle scooter bars typically use about 31.8 mm outer clamp diameter for standard and about 34.9–35 mm for oversized. Always check internal/external diameter and compression compatibility."},"keywords":["standard oversized","31.8","34.9","35 mm","diamètre barre","bar diameter","oversize"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-ihc","category":"Trottinette freestyle","questions":{"fr":"C’est quoi le système IHC ?","de":"Was ist IHC?","it":"Cos’è IHC?","en":"What is IHC?"},"answer":{"fr":"IHC est un système de compression léger très courant sur les setups Park et complets. Il utilise un shim autour du tube de fourche ; la barre doit être compatible avec le diamètre et comporte généralement une fente. Ne mélange pas IHC, HIC et SCS sans vérifier chaque pièce.","de":"IHC ist ein leichtes Kompressionssystem, häufig bei Park-Setups und Komplettscootern. Ein Shim sitzt um den Gabelschaft; die Bar muss zum Durchmesser passen und hat normalerweise einen Schlitz. IHC/HIC/SCS nicht ohne Kompatibilitätsprüfung mischen.","it":"IHC è un sistema di compressione leggero, comune nei setup Park e completi. Usa uno shim intorno al tubo forcella; il manubrio deve avere diametro compatibile e normalmente una fessura. Non mischiare IHC/HIC/SCS senza controllare.","en":"IHC is a lightweight compression system common on Park setups and completes. It uses a shim around the fork tube; the bar must match the diameter and normally has a slit. Do not mix IHC/HIC/SCS without checking compatibility."},"keywords":["ihc","compression","shim","fente","slit","park setup"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-hic","category":"Trottinette freestyle","questions":{"fr":"C’est quoi le HIC ?","de":"Was ist HIC?","it":"Cos’è HIC?","en":"What is HIC?"},"answer":{"fr":"HIC est un système de compression utilisant un shim et généralement une barre oversized avec fente. Il faut faire correspondre fourche, shim, diamètre interne de barre et collier.","de":"HIC ist ein Kompressionssystem mit Shim und normalerweise einer geschlitzten Oversized-Bar. Gabel, Shim, Innendurchmesser der Bar und Clamp müssen zusammenpassen.","it":"HIC è un sistema di compressione con shim e normalmente un manubrio oversized con fessura. Forcella, shim, diametro interno e collarino devono essere compatibili.","en":"HIC is a compression system using a shim and usually a slit oversized bar. Fork, shim, bar inner diameter and clamp all need to match."},"keywords":["hic","compression hic","oversized","shim","fente"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-scs","category":"Trottinette freestyle","questions":{"fr":"C’est quoi le SCS ?","de":"Was ist SCS?","it":"Cos’è SCS?","en":"What is SCS?"},"answer":{"fr":"SCS combine le serrage du guidon et la compression dans un gros collier. Une barre utilisée en SCS ne doit normalement pas avoir de fente dans la zone serrée. Le système est apprécié pour sa robustesse, surtout en Street, mais il ajoute du poids.","de":"SCS kombiniert Bar-Klemmung und Kompression in einer großen Clamp. Eine SCS-Bar sollte im Klemmbereich normalerweise keinen Schlitz haben. Das System ist robust und besonders im Street beliebt, wiegt aber mehr.","it":"SCS combina serraggio del manubrio e compressione in un collarino grande. Una bar usata in SCS normalmente non deve avere fessura nella zona di serraggio. È robusto, molto usato nello Street, ma aggiunge peso.","en":"SCS combines bar clamping and compression in one large clamp. A bar used with SCS should normally have no slit in the clamped area. It is valued for robustness, especially in Street, but adds weight."},"keywords":["scs","compression scs","collier","clamp","sans fente","no slit","street"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-slit","category":"Trottinette freestyle","questions":{"fr":"Pourquoi certaines barres ont une fente ?","de":"Warum haben manche Bars einen Schlitz?","it":"Perché alcuni manubri hanno una fessura?","en":"Why do some scooter bars have a slit?"},"answer":{"fr":"La fente permet à la barre de se resserrer autour d’un shim sur des systèmes comme IHC/HIC. En SCS, une fente dans la zone de serrage est généralement incompatible/dangereuse sauf modification correcte prévue pour la pièce.","de":"Der Schlitz ermöglicht es der Bar, sich bei IHC/HIC um einen Shim zusammenzuziehen. Bei SCS ist ein Schlitz im Klemmbereich normalerweise inkompatibel/problematisch, außer die Bar wurde korrekt dafür angepasst.","it":"La fessura permette alla bar di stringersi attorno allo shim nei sistemi IHC/HIC. Con SCS una fessura nella zona di serraggio è normalmente incompatibile/problematicа, salvo adattamento corretto.","en":"The slit lets a bar clamp around a shim on systems such as IHC/HIC. With SCS, a slit in the clamping area is normally incompatible/problematic unless the bar has been correctly adapted."},"keywords":["fente barre","slit","bar slit","scs slit","ihc hic"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-wheel-size","category":"Trottinette freestyle","questions":{"fr":"Quelle taille de roues choisir : 100, 110, 120 ou 125 mm ?","de":"Welche Rollengröße: 100, 110, 120 oder 125 mm?","it":"Quale misura ruote: 100, 110, 120 o 125 mm?","en":"Which wheel size: 100, 110, 120 or 125 mm?"},"answer":{"fr":"110 mm est un standard très courant. 100 mm est petit et réactif ; 120/125 mm peut apporter plus de roulage et de confort, mais seulement si la fourche et le deck/frein acceptent le diamètre. Vérifie aussi la largeur de roue.","de":"110 mm ist sehr verbreitet. 100 mm ist klein und agil; 120/125 mm kann besser rollen und komfortabler sein, aber nur wenn Gabel und Deck/Bremse den Durchmesser erlauben. Auch Rollenbreite prüfen.","it":"110 mm è molto comune. 100 mm è piccolo e reattivo; 120/125 mm può scorrere meglio e dare comfort, ma solo se forcella e deck/freno accettano il diametro. Controlla anche la larghezza.","en":"110 mm is very common. 100 mm is small and responsive; 120/125 mm can roll smoother and faster, but only if fork and deck/brake support the diameter. Check wheel width too."},"keywords":["100mm","110mm","120mm","125mm","taille roue","wheel size","rollengröße","misura ruota"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-wheel-width","category":"Trottinette freestyle","questions":{"fr":"C’est quoi une roue 24 mm ou 30 mm de large ?","de":"Was bedeutet 24 mm oder 30 mm Rollenbreite?","it":"Cosa significa ruota larga 24 o 30 mm?","en":"What does 24 mm vs 30 mm wheel width mean?"},"answer":{"fr":"24 mm est la largeur classique de nombreuses roues freestyle. Les roues 30 mm offrent une surface plus large mais demandent une fourche, un deck, des entretoises et parfois un frein compatibles. Diamètre et largeur sont deux compatibilités différentes.","de":"24 mm ist die klassische Breite vieler Freestyle-Rollen. 30-mm-Rollen sind breiter, benötigen aber kompatible Gabel, Deck, Spacer und ggf. Bremse. Durchmesser und Breite sind zwei getrennte Kompatibilitäten.","it":"24 mm è la larghezza classica di molte ruote freestyle. Le ruote da 30 mm sono più larghe ma richiedono forcella, deck, distanziali e a volte freno compatibili. Diametro e larghezza sono compatibilità diverse.","en":"24 mm is the classic width for many freestyle wheels. 30 mm wheels are wider but require compatible fork, deck, spacers and sometimes brake. Diameter and width are separate compatibility checks."},"keywords":["24mm","30mm","largeur roue","wheel width","breite","larghezza ruota"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-bearings","category":"Trottinette freestyle","questions":{"fr":"Quels roulements utilisent les roues de trottinette freestyle ?","de":"Welche Lager nutzen Freestyle-Scooter-Rollen?","it":"Quali cuscinetti usano le ruote freestyle?","en":"What bearings do freestyle scooter wheels use?"},"answer":{"fr":"La grande majorité des roues freestyle utilisent des roulements au format 608. Il faut aussi les entretoises adaptées entre les roulements et dans le deck/fourche.","de":"Die große Mehrheit der Freestyle-Rollen nutzt Lager im 608-Format. Passende Spacer zwischen den Lagern sowie in Deck/Gabel sind ebenfalls wichtig.","it":"La grande maggioranza delle ruote freestyle usa cuscinetti formato 608. Servono anche distanziali adatti tra i cuscinetti e nel deck/forcella.","en":"Most freestyle scooter wheels use 608-format bearings. Correct spacers between bearings and in the deck/fork are also important."},"keywords":["roulement","bearing","608","lager","cuscinetti","entretoise","spacer"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-park-setup","category":"Trottinette freestyle","questions":{"fr":"À quoi ressemble un setup Park ?","de":"Wie sieht ein Park-Setup aus?","it":"Com’è un setup Park?","en":"What is a Park setup like?"},"answer":{"fr":"Un setup Park recherche souvent faible poids et réactivité : deck plus court/étroit, guidon parfois plus bas/étroit, roues rapides et compression légère comme IHC. Ce n’est pas une règle absolue : choisis surtout un setup adapté à ton niveau et ta morphologie.","de":"Ein Park-Setup zielt oft auf geringes Gewicht und Agilität: kürzeres/schmaleres Deck, teils niedrigere/schmalere Bar, schnelle Rollen und leichte Kompression wie IHC. Das ist keine Pflicht – Setup an Niveau/Körper anpassen.","it":"Un setup Park cerca spesso leggerezza e reattività: deck più corto/stretto, manubrio talvolta più basso/stretto, ruote veloci e compressione leggera come IHC. Non è una regola assoluta.","en":"A Park setup often prioritises low weight and responsiveness: shorter/narrower deck, sometimes lower/narrower bar, fast wheels and light compression such as IHC. It is not an absolute rule; fit the setup to rider and level."},"keywords":["setup park","park scooter","léger","light","deck court","ihc"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-street-setup","category":"Trottinette freestyle","questions":{"fr":"À quoi ressemble un setup Street ?","de":"Wie sieht ein Street-Setup aus?","it":"Com’è un setup Street?","en":"What is a Street setup like?"},"answer":{"fr":"Un setup Street privilégie souvent stabilité et grind : deck plus long et plus large, bouts plus boxy, guidon plus haut/large et système robuste comme SCS. Cela augmente généralement le poids mais apporte du contrôle sur rails, ledges et gaps.","de":"Street-Setups priorisieren oft Stabilität und Grinds: längeres/breiteres, boxigeres Deck, höhere/breitere Bar und robuste Kompression wie SCS. Das erhöht meist das Gewicht, bringt aber Kontrolle auf Rails/Ledges/Gaps.","it":"Un setup Street privilegia spesso stabilità e grind: deck più lungo/largo e boxy, manubrio più alto/largo e sistema robusto come SCS. Pesa di più ma dà controllo su rail, ledge e gap.","en":"A Street setup often prioritises stability and grinding: longer/wider, boxier deck, higher/wider bar and robust compression such as SCS. It is usually heavier but gives control on rails, ledges and gaps."},"keywords":["setup street","street scooter","deck large","boxy","scs","rail","ledge"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-headset-play","category":"Trottinette freestyle","questions":{"fr":"Pourquoi ma trottinette a du jeu dans la direction ?","de":"Warum hat mein Scooter Spiel im Headset?","it":"Perché il monopattino ha gioco nello sterzo?","en":"Why does my scooter have headset play?"},"answer":{"fr":"Le jeu peut venir d’une compression insuffisante, d’un headset mal placé/usé, d’un collier desserré ou de pièces incompatibles. Desserre d’abord le collier, règle la compression juste assez pour supprimer le jeu tout en gardant une direction fluide, puis resserre le collier. Si le jeu revient, inspecte les pièces.","de":"Spiel kann von zu wenig Kompression, falsch sitzendem/verschlissenem Headset, lockerer Clamp oder inkompatiblen Teilen kommen. Clamp lösen, Kompression nur so weit einstellen, dass Spiel weg ist und die Lenkung frei bleibt, dann Clamp festziehen. Bei erneutem Spiel Teile prüfen.","it":"Il gioco può venire da compressione insufficiente, headset montato male/usurato, collarino allentato o pezzi incompatibili. Allenta il collarino, regola la compressione finché il gioco sparisce ma lo sterzo resta fluido, poi stringi il collarino.","en":"Play can come from insufficient compression, a badly seated/worn headset, loose clamp or incompatible parts. Loosen the clamp, adjust compression only enough to remove play while steering stays smooth, then retighten the clamp. Inspect parts if play returns."},"keywords":["jeu direction","headset play","compression","collier desserré","lenkung spiel","gioco sterzo"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-foam-grips","category":"Trottinette freestyle","questions":{"fr":"Comment monter des poignées mousse sans les abîmer ?","de":"Wie montiert man Schaumstoffgriffe ohne sie zu beschädigen?","it":"Come montare manopole in schiuma senza rovinarle?","en":"How do I install foam grips without damaging them?"},"answer":{"fr":"Une méthode pratique consiste à glisser 4–5 petits colliers/attaches rapides entre le guidon et la poignée afin que la mousse ne frotte pas directement sur toute la barre. Fais coulisser la poignée en t’aidant des attaches, puis retire-les progressivement. Un compresseur peut aussi aider.","de":"Praktisch ist es, 4–5 kleine Kabelbinder zwischen Bar und Schaumgriff zu schieben, damit der Schaum nicht vollflächig reibt. Griff darüber schieben und die Binder nach und nach herausziehen. Druckluft kann ebenfalls helfen.","it":"Un metodo pratico è inserire 4–5 fascette tra manubrio e manopola in schiuma, così la schiuma non sfrega su tutta la barra. Fai scorrere la manopola e sfila gradualmente le fascette. Può aiutare anche aria compressa.","en":"A practical method is to slide 4–5 small zip ties between the bar and foam grip so the foam does not drag over the full bar. Slide the grip using the ties, then remove them one by one. Compressed air can also help."},"keywords":["poignée mousse","foam grip","grips","colliers","attaches rapides","zip ties","montage poignée"],"source":{"label":"JF Rideshop – conseils","url":"https://www.jfrideshop.ch/blog/wiki-jf-1"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-no-wd40-foam","category":"Trottinette freestyle","questions":{"fr":"Peut-on utiliser du WD-40 pour monter des poignées mousse ?","de":"Kann man WD-40 für Schaumstoffgriffe verwenden?","it":"Si può usare WD-40 per montare manopole in schiuma?","en":"Can I use WD-40 to install foam grips?"},"answer":{"fr":"Évite le WD-40 sur des poignées mousse : il peut rester gras et n’est pas adapté à ce montage. Préfère la méthode des attaches rapides, de l’air comprimé ou un produit qui s’évapore complètement si le fabricant le permet.","de":"WD-40 bei Schaumstoffgriffen vermeiden: Es kann fettig bleiben und ist für diese Montage ungeeignet. Besser Kabelbinder-Methode, Druckluft oder nur ein vollständig verdunstendes Mittel verwenden, wenn der Hersteller es erlaubt.","it":"Evita WD-40 sulle manopole in schiuma: può restare unto e non è adatto al montaggio. Meglio fascette, aria compressa o un prodotto che evapora completamente se consentito dal produttore.","en":"Avoid WD-40 on foam grips: it can stay greasy and is not suitable for this installation. Prefer zip ties, compressed air, or a fully evaporating product if the manufacturer allows it."},"keywords":["wd40","wd-40","poignée mousse","foam grips","lubrifiant","grips"],"source":{"label":"JF Rideshop – conseils","url":"https://www.jfrideshop.ch/blog/wiki-jf-1"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-maintenance","category":"Trottinette freestyle","questions":{"fr":"Quel entretien faire sur une trottinette freestyle ?","de":"Welche Wartung braucht ein Freestyle-Scooter?","it":"Che manutenzione serve a un monopattino freestyle?","en":"What maintenance does a freestyle scooter need?"},"answer":{"fr":"Contrôle régulièrement axes, collier, compression, headset, roues/roulements, frein et fissures du deck/guidon/fourche. Nettoie sans noyer les roulements, remplace les pièces usées et respecte les couples de serrage : trop serrer peut aussi abîmer le matériel.","de":"Regelmäßig Achsen, Clamp, Kompression, Headset, Rollen/Lager, Bremse und Risse an Deck/Bar/Gabel prüfen. Reinigen ohne Lager zu fluten, Verschleißteile ersetzen und sinnvoll anziehen – zu fest kann ebenfalls Schäden verursachen.","it":"Controlla regolarmente assi, collarino, compressione, headset, ruote/cuscinetti, freno e crepe su deck/manubrio/forcella. Pulisci senza inondare i cuscinetti, sostituisci parti usurate e non stringere eccessivamente.","en":"Regularly check axles, clamp, compression, headset, wheels/bearings, brake and cracks in deck/bar/fork. Clean without flooding bearings, replace worn parts and use sensible tightening; overtightening can also damage parts."},"keywords":["entretien","maintenance","serrage","axes","fissure","crack","roulement","headset"],"source":{"label":"JF Rideshop","url":"https://www.jfrideshop.ch/"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-safety","category":"Trottinette freestyle","questions":{"fr":"Quelles protections pour la trottinette freestyle ?","de":"Welche Schutzausrüstung für Freestyle-Scooter?","it":"Quali protezioni per monopattino freestyle?","en":"What protection should I use for freestyle scooter?"},"answer":{"fr":"Le casque est la base et il est obligatoire en compétition RSL. Genouillères et coudières sont fortement utiles, surtout pour apprendre ou rider de gros modules ; selon la pratique on peut aussi ajouter protège-poignets et autres protections adaptées.","de":"Ein Helm ist die Basis und bei RSL-Wettkämpfen Pflicht. Knie- und Ellbogenschoner sind besonders beim Lernen oder auf großen Obstacles sehr sinnvoll; je nach Fahrstil können weitere passende Protektoren ergänzt werden.","it":"Il casco è la base ed è obbligatorio nelle gare RSL. Ginocchiere e gomitiere sono molto utili soprattutto nell’apprendimento o su grandi moduli; si possono aggiungere altre protezioni adatte.","en":"A helmet is the baseline and is mandatory in RSL competition. Knee and elbow pads are very useful, especially when learning or riding large obstacles; add other suitable protection as needed."},"keywords":["protection","casque","helmet","pads","genouillère","coudière","sécurité","safety"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-beginner-progression","category":"Trottinette freestyle","questions":{"fr":"Quels tricks apprendre en premier ?","de":"Welche Tricks sollte man zuerst lernen?","it":"Quali trick imparare per primi?","en":"Which tricks should I learn first?"},"answer":{"fr":"Commence par une position stable, freinage et bunny hop, puis travaille 180/fakie et manual. Quand ces bases sont propres, tu peux progresser vers tailwhip, barspin et petits grinds selon ton style. Mieux vaut un trick simple bien contrôlé qu’un gros trick forcé.","de":"Beginne mit stabiler Position, Bremsen und Bunny Hop, dann 180/Fakie und Manual. Wenn die Basics sauber sind, kannst du je nach Stil zu Tailwhip, Barspin und kleinen Grinds weitergehen. Kontrolle vor Größe.","it":"Inizia da posizione stabile, frenata e bunny hop, poi 180/fakie e manual. Quando le basi sono pulite, passa a tailwhip, barspin e piccoli grind secondo il tuo stile. Meglio un trick semplice controllato che uno grande forzato.","en":"Start with stable stance, braking and bunny hop, then 180/fakie and manual. Once those basics are clean, progress to tailwhip, barspin and small grinds depending on style. A controlled simple trick beats a forced big trick."},"keywords":["débutant","beginner","tricks débutant","bunny hop","180","fakie","manual","tailwhip","barspin"],"source":{"label":"RSL – Disciplines","url":"https://rsl-swiss.ch/disciplines"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-bunny-hop","category":"Trottinette freestyle","questions":{"fr":"Comment faire un bunny hop ?","de":"Wie macht man einen Bunny Hop?","it":"Come si fa un bunny hop?","en":"How do I bunny hop?"},"answer":{"fr":"Fléchis légèrement, tire le guidon vers le haut tout en poussant dans les jambes, puis ramène le deck sous toi pour décoller les deux roues. Commence bas, cherche une réception avec les deux pieds bien placés et augmente la hauteur progressivement.","de":"Leicht in die Knie gehen, Bar nach oben ziehen und gleichzeitig aus den Beinen drücken, dann Deck unter den Körper bringen, sodass beide Rollen abheben. Niedrig beginnen, sauber mit beiden Füßen landen und Höhe langsam steigern.","it":"Piega leggermente le gambe, tira il manubrio verso l’alto mentre spingi con le gambe e porta il deck sotto di te per staccare entrambe le ruote. Inizia basso e aumenta gradualmente mantenendo atterraggi controllati.","en":"Bend slightly, pull the bar upward while driving through your legs, then bring the deck under you so both wheels leave the ground. Start low, land with both feet well placed and build height progressively."},"keywords":["bunny hop","saut","jump","hop","anfänger","salto"],"source":{"label":"RSL – Cours","url":"https://rsl-swiss.ch/cours"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-tailwhip","category":"Trottinette freestyle","questions":{"fr":"Comment apprendre le tailwhip ?","de":"Wie lernt man Tailwhip?","it":"Come imparare il tailwhip?","en":"How do I learn a tailwhip?"},"answer":{"fr":"Maîtrise d’abord un bunny hop stable. Lance le deck avec les pieds puis accompagne sa rotation surtout avec les poignets/avant-bras, garde le guidon devant toi, regarde le deck revenir et pose les pieds dessus. Travaille d’abord sur terrain plat ou module adapté avec protections.","de":"Zuerst einen stabilen Bunny Hop beherrschen. Deck mit den Füßen anstoßen und die Rotation vor allem mit Handgelenken/Unterarmen führen, Bar vor dir halten, Deck beobachten und wieder mit beiden Füßen fangen. Mit Schutz und auf geeignetem Untergrund üben.","it":"Prima padroneggia un bunny hop stabile. Lancia il deck con i piedi e accompagna la rotazione soprattutto con polsi/avambracci, tieni il manubrio davanti, guarda tornare il deck e riprendilo con entrambi i piedi. Allenati con protezioni.","en":"First master a stable bunny hop. Kick the deck, then guide its rotation mainly with wrists/forearms, keep the bar in front, watch the deck return and catch it with both feet. Practise with protection on suitable terrain."},"keywords":["tailwhip","whip","apprendre tailwhip","trick"],"source":{"label":"RSL – Cours","url":"https://rsl-swiss.ch/cours"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-barspin","category":"Trottinette freestyle","questions":{"fr":"Comment apprendre le barspin ?","de":"Wie lernt man Barspin?","it":"Come imparare il barspin?","en":"How do I learn a barspin?"},"answer":{"fr":"Avant de le lancer en l’air, entraîne la rotation du guidon à l’arrêt pour comprendre le passage des mains. Ensuite combine avec un bunny hop, garde le guidon près du corps et récupère les poignées proprement. Vérifie qu’aucun câble ne gêne : une trottinette freestyle classique n’en a généralement pas.","de":"Übe die Bar-Drehung zuerst im Stand, um den Handwechsel zu verstehen. Dann mit Bunny Hop kombinieren, Bar nah am Körper halten und Griffe sauber fangen. Achte darauf, dass nichts die Rotation behindert.","it":"Prima prova la rotazione del manubrio da fermo per capire il passaggio delle mani. Poi combinala con bunny hop, tieni il manubrio vicino al corpo e riprendi bene le manopole. Assicurati che nulla ostacoli la rotazione.","en":"Practise the bar rotation while stationary first to understand the hand pass. Then combine it with a bunny hop, keep the bar close and catch the grips cleanly. Make sure nothing interferes with rotation."},"keywords":["barspin","bar spin","rotation guidon","trick"],"source":{"label":"RSL – Cours","url":"https://rsl-swiss.ch/cours"},"dynamic":false,"verified":"2026-08-26"},{"id":"scooter-grinds","category":"Trottinette freestyle","questions":{"fr":"Quels grinds apprendre en Street ?","de":"Welche Grinds zuerst im Street?","it":"Quali grind imparare nello Street?","en":"Which grinds should I learn first in Street?"},"answer":{"fr":"Commence sur un ledge bas et propre avec des positions simples comme feeble ou boardslide selon ton aisance. Travaille l’approche, le bunny hop, le placement du deck et surtout la sortie contrôlée avant d’augmenter hauteur ou vitesse.","de":"Auf einem niedrigen, sauberen Ledge mit einfachen Positionen wie Feeble oder Boardslide beginnen. Anfahrt, Bunny Hop, Deck-Platzierung und vor allem kontrollierten Ausstieg üben, bevor Höhe/Tempo steigen.","it":"Inizia su un ledge basso e pulito con posizioni semplici come feeble o boardslide. Lavora su avvicinamento, bunny hop, posizione del deck e soprattutto uscita controllata prima di aumentare altezza o velocità.","en":"Start on a low, clean ledge with simple positions such as feeble or boardslide depending on comfort. Work on approach, bunny hop, deck placement and especially a controlled exit before adding height or speed."},"keywords":["grind","feeble","boardslide"
