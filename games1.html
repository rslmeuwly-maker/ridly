<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="192x192" href="/image/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/image/icon-512.png">
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Game of Scoot — RIDLY</title>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#020617;
      --bg-soft:#030712;
      --card:#020617;
      --accent:#22c55e;
      --accent-soft:rgba(34,197,94,.08);
      --accent-strong:rgba(34,197,94,.25);
      --text:#f9fafb;
      --text-dim:#9ca3af;
      --border:rgba(148,163,184,.35);
      --radius-xl:18px;
    }

    body.theme-dark{
      --bg:#020617;
      --bg-soft:#030712;
      --card:#020617;
      --text:#f9fafb;
      --text-dim:#9ca3af;
      --border:rgba(148,163,184,.35);
    }
    body.theme-light{
      --bg:#f4f4f5;
      --bg-soft:#e5e7eb;
      --card:#ffffff;
      --text:#020617;
      --text-dim:#6b7280;
      --border:rgba(148,163,184,.25);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    html,body{
      margin:0;
      padding:0;
      height:100%;
    }
    body{
      font-family:"Outfit",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:#000;
      color:var(--text);
      display:flex;
      flex-direction:column;
    }

    /* ===== BG VIDÉO ===== */
    .rsl-bg-wrap{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }
    .rsl-bg-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      background:#000;
      filter:brightness(.48) saturate(1.05);
    }
    .rsl-bg-dim{
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.7));
    }
    body.theme-light .rsl-bg-dim{
      background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.96));
    }

    .page-wrap{
      flex:1;
      display:flex;
      flex-direction:column;
      max-width:640px;
      margin:0 auto;
      width:100%;
      position:relative;
      z-index:1;
    }

    /* ===== TOP NAV (copiée de feed) ===== */
    nav.nav{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(2,6,23,.9);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);
    }
    body.theme-light nav.nav{
      background:rgba(244,244,245,.95);
    }
    nav.nav .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px 14px;
    }

    .nav-left{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:var(--text);
    }
    .brand img{
      width:32px;
      height:32px;
      border-radius:12px;
      background:#000;
      padding:3px;
      box-shadow:0 0 14px rgba(204,0,0,.55);
    }
    .brand span{
      font-weight:700;
      letter-spacing:-0.03em;
      font-size:20px;
    }

    .add-btn{
      border:none;
      outline:none;
      width:30px;
      height:30px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:700;
      cursor:pointer;
      background:radial-gradient(circle at 30% 20%,#4ade80 0,#22c55e 35%,#16a34a 100%);
      color:#022c16;
      box-shadow:0 10px 22px rgba(34,197,94,.7);
    }
    .add-btn span{
      transform:translateY(-1px);
    }

    .nav-tools{
      display:flex;
      align-items:center;
      gap:8px;
      margin-left:auto;
    }
    .icon-btn{
      border:1px solid rgba(15,23,42,.8);
      background:rgba(15,23,42,.9);
      color:var(--text);
      border-radius:999px;
      width:32px;
      height:32px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
      text-decoration:none;
      position:relative;
      cursor:pointer;
    }
    body.theme-light .icon-btn{
      background:#e5e7eb;
      border-color:rgba(148,163,184,.6);
    }
    .icon-btn:hover{
      border-color:var(--accent);
      color:var(--accent);
    }
    .chat-dot{
      position:absolute;
      top:5px;
      right:5px;
      width:8px;
      height:8px;
      border-radius:999px;
      background:#22c55e;
      box-shadow:0 0 8px rgba(34,197,94,.8);
      opacity:0;
    }

    /* ===== MAIN (comme feed) ===== */
    .main{
      flex:1;
      padding:4px 10px 80px;
    }

    .mini-title{
      padding:8px 4px 4px;
      font-size:13px;
      font-weight:600;
      color:var(--text-dim);
    }

    /* ===== PANELS GAME OF SCOOT ===== */
    .status-main{
      font-size:13px;
      color:var(--text-dim);
      margin:0 0 8px;
      padding:0 2px;
    }

    .panel{
      background:var(--card);
      border-radius:var(--radius-xl);
      border:1px solid rgba(15,23,42,.9);
      box-shadow:0 18px 45px rgba(0,0,0,.6);
      padding:12px 10px 12px;
      margin-bottom:14px;
    }
    body.theme-light .panel{
      border-color:rgba(209,213,219,.9);
      box-shadow:0 14px 30px rgba(15,23,42,.15);
    }

    h2,h3{
      margin:0 0 8px;
      font-size:15px;
    }

    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn{
      appearance:none;
      border-radius:999px;
      border:1px solid rgba(148,163,184,.6);
      background:rgba(15,23,42,.95);
      color:var(--text);
      padding:7px 14px;
      font:600 14px "Outfit",system-ui;
      cursor:pointer;
    }
    .btn.green{
      background:linear-gradient(180deg,#22c55e,#16a34a);
      color:#022c16;
      border-color:#22c55e;
      box-shadow:0 10px 22px rgba(34,197,94,.55);
    }

    input{
      background:#020617;
      border-radius:10px;
      border:1px solid rgba(148,163,184,.6);
      padding:7px 10px;
      color:var(--text);
      font:500 14px "Outfit",system-ui;
      min-width:0;
      flex:1;
    }
    body.theme-light input{
      background:#f4f4f5;
      border-color:rgba(148,163,184,.7);
      color:#111827;
    }

    .players{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }
    .player-card{
      flex:1;
      min-width:140px;
      padding:10px;
      border-radius:14px;
      background:#020617;
      border:1px solid rgba(30,64,175,.7);
    }
    body.theme-light .player-card{
      background:#f9fafb;
      border-color:rgba(148,163,184,.9);
    }
    .player-card > div:first-child{
      font-size:13px;
      font-weight:700;
    }

    .letters{
      display:flex;
      gap:4px;
      margin-top:6px;
    }
    .letter{
      width:24px;
      height:24px;
      border-radius:6px;
      border:1px solid rgba(148,163,184,.8);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:13px;
      color:var(--text-dim);
      background:rgba(15,23,42,.9);
    }
    body.theme-light .letter{
      background:#e5e7eb;
      border-color:rgba(148,163,184,.9);
    }
    .letter.on{
      background:var(--accent-soft);
      color:#bbf7d0;
      border-color:var(--accent);
      box-shadow:0 0 10px rgba(34,197,94,.6);
    }

    .status{
      font-size:12px;
      color:var(--text-dim);
      margin-bottom:6px;
      padding:0 2px;
    }

    .round-log{
      max-height:220px;
      overflow:auto;
      font-size:12px;
      color:var(--text-dim);
      padding-top:4px;
      border-top:1px solid rgba(15,23,42,.95);
      margin-top:4px;
    }
    .round-log div{
      padding:3px 0;
      border-bottom:1px solid rgba(15,23,42,.85);
    }

    /* ===== BOTTOM NAV (comme feed) ===== */
    .tabbar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:30;
      border-top:1px solid var(--border);
      background:rgba(2,6,23,.97);
      backdrop-filter:blur(18px);
      display:flex;
      justify-content:space-around;
      align-items:center;
      padding:6px 8px 10px;
    }
    body.theme-light .tabbar{
      background:rgba(244,244,245,.97);
    }

    .tab{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      text-decoration:none;
      color:var(--text-dim);
      font-size:9px;
      letter-spacing:.04em;
      text-transform:uppercase;
      padding:4px 0;
    }
    .tab .ic{
      font-size:20px;
      line-height:1;
    }
    .tab.active{
      color:var(--accent);
    }

    @media(min-width:700px){
      nav.nav .row{
        padding-inline:20px;
      }
      .main{
        padding-inline:14px;
      }
      .tabbar{
        border-radius:22px 22px 0 0;
      }
    }
  
    /* RIDLY_MOBILE_BASE_BEGIN */
    html{
      -webkit-text-size-adjust:100%;
      overscroll-behavior-y:none;
    }
    body{
      min-height:100svh;
      overscroll-behavior-y:none;
      -webkit-font-smoothing:antialiased;
    }
    /* Encoches iPhone : header et barre du bas */
    nav.nav{
      padding-top:env(safe-area-inset-top);
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
    }
    .tabbar{
      padding-bottom:calc(7px + env(safe-area-inset-bottom)) !important;
    }
    /* Zones tactiles : 44px minimum (recommandation Apple) */
    .tab,.icon-btn,.more-btn,.add-btn,button,a.btn{
      touch-action:manipulation;
    }
    .icon-btn,.more-btn,.add-btn{min-height:36px}
    /* Empeche le zoom iOS a la mise au point d'un champ (<16px = zoom auto) */
    input,textarea,select{font-size:16px}
    /* Pas de scroll horizontal parasite */
    body,.page-wrap{max-width:100%;overflow-x:hidden}
    img,video,svg{max-width:100%}
    /* RIDLY_MOBILE_BASE_END */
  
  
    /* RIDLY_DA_2026_GENERIC_BEGIN */
    :root,body,body.theme-dark,body.theme-light{
      --bg:#080808; --bg-soft:#0d0d0d; --panel:#101010; --panel-soft:#0b0b0b;
      --card:#101010;
      --green:#cc0000; --green-dark:#e51010;
      --accent:#cc0000; --accent-soft:rgba(204,0,0,.11); --accent-strong:rgba(204,0,0,.24);
      --red:#cc0000; --red2:#e51010;
      --text:#f2f2f2; --dim:#8b8b8b; --text-dim:#8b8b8b; --muted:#8b8b8b;
      --border:rgba(255,255,255,.09); --radius-xl:16px;
    }
    html,body{background:#080808 !important;color:#f2f2f2}
    body,body.theme-light{
      font-family:"Barlow Condensed",system-ui,-apple-system,"Segoe UI",sans-serif !important;
      background:#080808 !important;
    }
    button,input,textarea,select{font-family:"Barlow Condensed",system-ui,sans-serif !important}
    h1,h2,h3,.name,.posts-header h2,.modal-header{
      font-family:"Bebas Neue",sans-serif !important;font-weight:400 !important;letter-spacing:.03em;
    }
    .rsl-bg-video{filter:brightness(.20) saturate(.45) !important}
    .rsl-bg-dim,body.theme-light .rsl-bg-dim{
      background:linear-gradient(180deg,rgba(0,0,0,.70),rgba(0,0,0,.94)) !important;
    }
    .page-wrap{max-width:680px;min-height:100svh}

    nav.nav,body.theme-light nav.nav{
      background:rgba(8,8,8,.88) !important;
      border-bottom:1px solid rgba(255,255,255,.07) !important;
      backdrop-filter:blur(18px);
    }
    nav.nav .row{min-height:56px;padding:7px 12px}
    .brand{gap:0}
    .brand-wordmark{width:132px;height:auto;max-width:44vw;display:block}
    .brand img,.brand span{display:none !important}
    .nav-tools{gap:6px;position:relative}
    #btnTheme{display:none !important}

    /* Bouton + : visible et rouge sur toutes les pages */
    .add-btn{
      display:flex !important;
      width:36px;height:36px;min-width:36px;border-radius:999px;
      align-items:center;justify-content:center;border:none;cursor:pointer;
      background:linear-gradient(180deg,#e51010,#cc0000) !important;
      color:#fff !important;font-size:21px;font-weight:700;
      box-shadow:0 8px 20px rgba(204,0,0,.28) !important;
    }
    .add-btn span{transform:translateY(-1px)}

    .icon-btn,body.theme-light .icon-btn{
      width:36px;height:36px;min-width:36px;padding:0;
      border:1px solid rgba(255,255,255,.08) !important;
      background:rgba(255,255,255,.045) !important;
      color:#f2f2f2 !important;box-shadow:none !important;
    }
    .icon-btn:hover{border-color:rgba(204,0,0,.65) !important;color:#fff !important}
    .badge,.nav-badge{background:#cc0000 !important;color:#fff !important}

    .card,body.theme-light .card,.post,body.theme-light .post{
      background:#0b0b0b !important;border:1px solid rgba(255,255,255,.07) !important;
      border-radius:16px !important;box-shadow:none !important;
    }
    .btn,body.theme-light .btn{
      background:rgba(255,255,255,.045) !important;
      border:1px solid rgba(255,255,255,.09) !important;
      color:#f2f2f2 !important;border-radius:10px !important;
      font-weight:700 !important;text-transform:uppercase;letter-spacing:.04em;font-size:12px !important;
    }
    .btn:hover{border-color:rgba(204,0,0,.6) !important}
    .btn.green,.btn.primary,.btn-primary{
      background:linear-gradient(180deg,#e51010,#cc0000) !important;
      color:#fff !important;border:0 !important;
      box-shadow:0 8px 20px rgba(204,0,0,.26) !important;
    }
    .chip-link,body.theme-light .chip-link{
      background:rgba(255,255,255,.055) !important;color:#e8e8e8 !important;
      border:1px solid rgba(255,255,255,.07);
    }
    label{color:#c9c9c9 !important;text-transform:uppercase;letter-spacing:.05em}
    .input,textarea,select,input[type=text],input[type=email],input[type=password],
    input[type=search],input[type=url],input[type=number],
    body.theme-light .input,body.theme-light textarea,body.theme-light select{
      background:#0b0b0b !important;border:1px solid rgba(255,255,255,.09) !important;
      color:#f2f2f2 !important;border-radius:10px !important;
    }
    .input:focus,textarea:focus,select:focus,input:focus{
      outline:none;border-color:rgba(204,0,0,.6) !important;
    }
    .empty,.hint,.hint-bottom{color:#777 !important}
    .toast{
      background:rgba(12,12,12,.97) !important;color:#f2f2f2 !important;
      border:1px solid rgba(255,255,255,.09);
    }
    .modal,.modal-content,.share-dm-panel{
      background:#0b0b0b !important;border:1px solid rgba(255,255,255,.09) !important;
      border-radius:16px !important;
    }
    .modal-backdrop{background:rgba(0,0,0,.88) !important}

    .tabbar,body.theme-light .tabbar{
      left:50% !important;right:auto !important;
      width:min(100%,680px);transform:translateX(-50%);
      min-height:64px;
      padding:6px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)) !important;
      background:rgba(8,8,8,.96) !important;
      border:1px solid rgba(255,255,255,.08) !important;border-bottom:0 !important;
      border-radius:18px 18px 0 0 !important;
      box-shadow:0 -14px 34px rgba(0,0,0,.28) !important;backdrop-filter:blur(20px);
    }
    .tab{
      min-width:0;color:#777 !important;font-size:9px !important;font-weight:700 !important;
      letter-spacing:.06em;padding:5px 2px !important;gap:3px !important;
    }
    .tab .ic{
      width:25px;height:25px;display:flex;align-items:center;justify-content:center;
      font-family:"Barlow Condensed",sans-serif;font-size:21px !important;line-height:1 !important;color:#8b8b8b;
    }
    .tab.active,.tab.active .ic{color:#cc0000 !important}
    ::selection{background:#cc0000;color:#fff}

    @media(max-width:640px){
      nav.nav .row{padding:6px 9px}
      .brand-wordmark{width:112px;max-width:50vw}
      .tabbar{width:100%;border-left:0 !important;border-right:0 !important;border-radius:16px 16px 0 0 !important}
    }
    /* RIDLY_DA_2026_GENERIC_END */
  
  </style>

  <!-- CONTENU PRINCIPAL -->
  <main class="main">
    <div class="mini-title">Game of Scoot</div>

      Connexion en cours…

    <!-- Panel création / rejoindre -->

        <button class="btn" id="btnP2Miss">P2 prend une lettre</button>

<!-- THEME clair / sombre (même logique que feed) -->
<script>
(function(){
  const saved = localStorage.getItem('ridlyTheme') || 'dark';
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
  document.body.classList.toggle('theme-light', theme === 'light');
  document.body.classList.toggle('theme-dark', theme !== 'light');

  const btnTheme = document.getElementById('btnTheme');
  const updateIcon = () => {
    const isLight = document.body.classList.contains('theme-light');
    btnTheme.textContent = isLight ? '☀️' : '🌙';
  };
  updateIcon();

  btnTheme.addEventListener('click', ()=>{
    const isLight = document.body.classList.contains('theme-light');
    document.body.classList.toggle('theme-light', !isLight);
    document.body.classList.toggle('theme-dark',  isLight);
    localStorage.setItem('ridlyTheme', isLight ? 'dark' : 'light');
    updateIcon();
  });
})();
</script>

<script>
  /* Supabase init */
  const SUPABASE_URL  = window.env?.SUPABASE_URL || "https://jynxifufaauoxwzjapzq.supabase.co";
  const SUPABASE_ANON = window.env?.SUPABASE_ANON || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5bnhpZnVmYWF1b3h3emphcHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzODI2NzcsImV4cCI6MjA3Njk1ODY3N30.vFPGhGakPIM3Xg5rn8_BrAXl6oJMJOssO780C9nXmr4";
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  /* BG vidéo depuis Supabase storage (comme feed) */
  (function(){
    const v = document.getElementById('rslBg');
    if(!v) return;
    const s = document.createElement('source');
    s.src = SUPABASE_URL + "/storage/v1/object/public/ridly/ridly.mp4";
    s.type = "video/mp4";
    v.appendChild(s);
    const play = () => {
      try{
        v.playbackRate = 0.6;
        const p = v.play();
        if(p && p.catch) p.catch(()=>{});
      }catch(e){}
    };
    play();
    document.addEventListener('visibilitychange',()=>{
      document.hidden ? v.pause() : play();
    });
  })();

  let currentUser = null;
  let currentGame = null;
  let channel = null;
  const letters = ['S','C','O','O','T'];

  const statusText   = document.getElementById('statusText');
  const gamePanel    = document.getElementById('gamePanel');
  const p1NameEl     = document.getElementById('p1Name');
  const p2NameEl     = document.getElementById('p2Name');
  const p1LettersEl  = document.getElementById('p1Letters');
  const p2LettersEl  = document.getElementById('p2Letters');
  const gameStatusEl = document.getElementById('gameStatus');
  const roundLog     = document.getElementById('roundLog');
  const chatDot      = document.getElementById('chatDot');

  async function initGame(){
    try{
      const { data:{ user } } = await supa.auth.getUser();
      if(!user){
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      const name = user.user_metadata?.full_name || user.email || user.id;
      statusText.textContent = "Tu es connecté en tant que " + name;
      if(chatDot) chatDot.style.opacity = 1;
    }catch(e){
      console.error(e);
      window.location.href = 'index.html';
    }
  }

  function renderLetters(container, count){
    container.innerHTML = '';
    for(let i=0;i<letters.length;i++){
      const div = document.createElement('div');
      div.className = 'letter' + (i < count ? ' on':'');
      div.textContent = letters[i];
      container.appendChild(div);
    }
  }

  function renderGame(){
    if(!currentGame) return;
    gamePanel.style.display = 'block';
    p1NameEl.textContent = currentGame.player1_name || 'Rider 1';
    p2NameEl.textContent = currentGame.player2_name || 'Rider 2';
    renderLetters(p1LettersEl, currentGame.letters_p1 || 0);
    renderLetters(p2LettersEl, currentGame.letters_p2 || 0);

    if(currentGame.status === 'finished'){
      const winner = currentGame.winner_name || 'un rider';
      gameStatusEl.textContent = "Partie terminée — " + winner + " a gagné.";
    }else{
      gameStatusEl.textContent = "Partie en cours — code: " + currentGame.code;
    }
  }

  async function loadRounds(gameId){
    const { data, error } = await supa
      .from('scoot_rounds')
      .select('*')
      .eq('game_id', gameId)
      .order('round_number', { ascending:true });
    if(error){ console.error(error); return; }
    roundLog.innerHTML = '';
    (data||[]).forEach(r => {
      const div = document.createElement('div');
      const t = r.trick_name ? r.trick_name + " — " : "";
      div.textContent = "#" + r.round_number + " " + t +
        "P1 lettres: " + (r.letters_p1_after ?? '?') +
        " / P2 lettres: " + (r.letters_p2_after ?? '?');
      roundLog.appendChild(div);
    });
  }

  function subscribeGame(gameId){
    if(channel){
      supa.removeChannel(channel);
    }
    channel = supa
      .channel('scoot_game_' + gameId)
      .on('postgres_changes',{
        event:'UPDATE', schema:'public', table:'scoot_games',
        filter:'id=eq.'+gameId
      }, payload => {
        Object.assign(currentGame, payload.new);
        renderGame();
      })
      .on('postgres_changes',{
        event:'INSERT', schema:'public', table:'scoot_rounds',
        filter:'game_id=eq.'+gameId
      }, payload => {
        loadRounds(gameId);
      })
      .subscribe();
  }

  document.getElementById('btnCreateGame').addEventListener('click', async () => {
    if(!currentUser) return;
    const code = Math.random().toString(36).slice(2,8).toUpperCase();
    const displayName = currentUser.user_metadata?.full_name || currentUser.email || 'Rider 1';

    const { data, error } = await supa
      .from('scoot_games')
      .insert({
        code,
        player1_id: currentUser.id,
        player1_name: displayName,
        status: 'waiting'
      })
      .select('*')
      .single();
    if(error){ console.error(error); alert("Erreur création partie"); return; }

    document.getElementById('createdCode').textContent =
      "Partage ce code à ton adversaire : " + code;
    currentGame = data;
    renderGame();
    subscribeGame(currentGame.id);
    loadRounds(currentGame.id);
  });

  document.getElementById('btnJoinGame').addEventListener('click', async () => {
    if(!currentUser) return;
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    if(!code) return;
    const displayName = currentUser.user_metadata?.full_name || currentUser.email || 'Rider 2';

    const { data, error } = await supa
      .from('scoot_games')
      .update({ player2_id: currentUser.id, player2_name: displayName, status:'in_progress' })
      .eq('code', code)
      .is('player2_id', null)
      .select('*')
      .single();
    if(error || !data){ alert("Code invalide ou partie déjà pleine."); return; }
    currentGame = data;
    renderGame();
    subscribeGame(currentGame.id);
    loadRounds(currentGame.id);
  });

  document.getElementById('btnP1Miss').addEventListener('click', async () => {
    if(!currentGame) return;
    const nextLetters = Math.min((currentGame.letters_p1 || 0) + 1, 5);
    const roundNum = (currentGame.round_count || 0) + 1;

    const { error: e1 } = await supa.from('scoot_games')
      .update({
        letters_p1: nextLetters,
        status: nextLetters >= 5 ? 'finished' : 'in_progress',
        winner_id: nextLetters >= 5 ? currentGame.player2_id : null
      })
      .eq('id', currentGame.id);

    const { error: e2 } = await supa.from('scoot_rounds')
      .insert({
        game_id: currentGame.id,
        round_number: roundNum,
        trick_name: document.getElementById('trickName').value || null,
        letters_p1_after: nextLetters,
        letters_p2_after: currentGame.letters_p2 || 0
      });

    if(e1 || e2){ console.error(e1||e2); }
    loadRounds(currentGame.id);
  });

  document.getElementById('btnP2Miss').addEventListener('click', async () => {
    if(!currentGame) return;
    const nextLetters = Math.min((currentGame.letters_p2 || 0) + 1, 5);
    const roundNum = (currentGame.round_count || 0) + 1;

    const { error: e1 } = await supa.from('scoot_games')
      .update({
        letters_p2: nextLetters,
        status: nextLetters >= 5 ? 'finished' : 'in_progress',
        winner_id: nextLetters >= 5 ? currentGame.player1_id : null
      })
      .eq('id', currentGame.id);

    const { error: e2 } = await supa.from('scoot_rounds')
      .insert({
        game_id: currentGame.id,
        round_number: roundNum,
        trick_name: document.getElementById('trickName').value || null,
        letters_p1_after: currentGame.letters_p1 || 0,
        letters_p2_after: nextLetters
      });

    if(e1 || e2){ console.error(e1||e2); }
    loadRounds(currentGame.id);
  });

  initGame();
</script>
