<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>RIDLY — Riders, spots & clips</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --red:#cc0000;
      --red2:#e51010;
      --bg:#080808;
      --panel:#101010;
      --text:#f2f2f2;
      --muted:#8a8a8a;
      --border:rgba(255,255,255,.10);
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100svh;
      background:
        radial-gradient(900px 460px at 50% -8%,rgba(204,0,0,.20),transparent 62%),
        var(--bg);
      color:var(--text);
      font-family:"Barlow Condensed",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
      overflow-x:hidden;
    }

    a{color:inherit}

    /* ===== LOADER : icône RIDLY + point blanc ===== */
    #ridly-loader{
      position:fixed;
      inset:0;
      z-index:99999;
      display:grid;
      place-items:center;
      background:#030303;
      pointer-events:none;
      animation:loaderOut .35s ease .85s forwards;
    }

    .loader-icon{
      position:relative;
      width:190px;
      height:205px;
      overflow:hidden;
      background-image:url("image/ridly-rsl-logo.png");
      background-repeat:no-repeat;
      background-size:700px 525px;
      background-position:center -77px;
      filter:drop-shadow(0 0 34px rgba(204,0,0,.18));
    }

    .loader-dot{
      position:absolute;
      left:50%;
      top:42%;
      width:28px;
      height:28px;
      border-radius:50%;
      background:#fff;
      transform:translate(-50%,-50%);
      box-shadow:0 0 0 0 rgba(255,255,255,.50);
      animation:dotPulse .8s ease-in-out infinite;
    }

    @keyframes dotPulse{
      50%{
        transform:translate(-50%,-50%) scale(1.22);
        box-shadow:0 0 0 10px rgba(255,255,255,0);
      }
    }

    @keyframes loaderOut{
      to{opacity:0;visibility:hidden}
    }

    /* ===== PAGE ===== */
    .page{
      min-height:100svh;
      display:flex;
      flex-direction:column;
    }

    .nav{
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:0 clamp(18px,4vw,56px);
      border-bottom:1px solid var(--border);
      background:rgba(8,8,8,.78);
      backdrop-filter:blur(16px);
      position:relative;
      z-index:10;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
    }

    .brand-mark{
      width:38px;
      height:42px;
      overflow:hidden;
      background-image:url("image/ridly-rsl-logo.png");
      background-repeat:no-repeat;
      background-size:155px 116px;
      background-position:center -17px;
      flex:0 0 auto;
    }

    .brand-text{
      font-family:"Bebas Neue",sans-serif;
      font-size:27px;
      letter-spacing:.08em;
      line-height:1;
    }

    .brand-text span{color:var(--red)}

    .nav-rsl{
      text-decoration:none;
      color:#9b9b9b;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:13px;
      font-weight:800;
      transition:.2s ease;
    }
    .nav-rsl:hover{color:#fff}

    .hero{
      width:min(1180px,calc(100% - 36px));
      margin:auto;
      padding:60px 0 70px;
      display:grid;
      grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);
      gap:clamp(30px,6vw,90px);
      align-items:center;
      flex:1;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 11px;
      border:1px solid var(--border);
      border-radius:999px;
      color:#b5b5b5;
      background:rgba(255,255,255,.03);
      font-size:12px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .eyebrow::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--red);
      box-shadow:0 0 14px rgba(204,0,0,.85);
    }

    h1{
      margin:24px 0 18px;
      font-family:"Bebas Neue",sans-serif;
      font-size:clamp(68px,10vw,138px);
      font-weight:400;
      line-height:.82;
      letter-spacing:.015em;
    }

    h1 span{color:var(--red)}

    .lead{
      margin:0 0 30px;
      max-width:610px;
      color:#a7a7a7;
      font-size:clamp(20px,2.15vw,29px);
      line-height:1.12;
    }
    .lead strong{color:#fff}

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .btn{
      min-height:50px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 22px;
      border-radius:10px;
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-size:15px;
      font-weight:900;
      transition:transform .15s ease,border-color .2s ease,background .2s ease;
    }

    .btn:hover{transform:translateY(-1px)}
    .btn-primary{
      color:#fff;
      background:var(--red);
      box-shadow:0 14px 36px rgba(204,0,0,.24);
    }
    .btn-primary:hover{background:var(--red2)}
    .btn-secondary{
      color:#fff;
      background:#111;
      border:1px solid rgba(255,255,255,.14);
    }
    .btn-secondary:hover{border-color:rgba(204,0,0,.55)}

    .visual{
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      min-height:470px;
    }

    .visual::before{
      content:"";
      position:absolute;
      width:360px;
      height:360px;
      border-radius:50%;
      background:rgba(204,0,0,.12);
      filter:blur(80px);
    }

    .logo-card{
      position:relative;
      width:min(500px,100%);
      aspect-ratio:4/3;
      border:1px solid rgba(255,255,255,.09);
      border-radius:24px;
      overflow:hidden;
      background:#000;
      box-shadow:0 34px 90px rgba(0,0,0,.58),0 0 70px rgba(204,0,0,.08);
      transform:rotate(1.2deg);
    }

    .logo-card img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .chips{
      position:absolute;
      left:-24px;
      bottom:28px;
      display:grid;
      gap:8px;
    }

    .chip{
      width:max-content;
      padding:8px 12px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:9px;
      background:rgba(13,13,13,.92);
      backdrop-filter:blur(12px);
      color:#bdbdbd;
      font-size:13px;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
    }
    .chip b{color:#fff}
    .chip i{color:var(--red);font-style:normal}

    footer{
      padding:18px clamp(18px,4vw,56px);
      border-top:1px solid rgba(255,255,255,.06);
      color:#5c5c5c;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.09em;
    }

    @media(max-width:780px){
      .nav{height:64px}
      .hero{
        grid-template-columns:1fr;
        padding:44px 0 38px;
        gap:28px;
      }
      h1{font-size:clamp(66px,23vw,100px)}
      .visual{min-height:330px}
      .logo-card{width:min(430px,94vw);border-radius:18px;transform:none}
      .chips{left:12px;bottom:14px}
      footer{text-align:center}
    }

    @media(max-width:480px){
      .brand-text{font-size:24px}
      .nav-rsl{font-size:11px}
      .actions{display:grid;grid-template-columns:1fr}
      .btn{width:100%}
      .lead{font-size:21px}
    }

    @media(prefers-reduced-motion:reduce){
      #ridly-loader{animation:loaderOut .01s linear .1s forwards}
      .loader-dot{animation:none}
      .logo-card{transform:none}
    }
  </style>
</head>

<body>
  <div id="ridly-loader" aria-hidden="true">
    <div class="loader-icon">
      <span class="loader-dot"></span>
    </div>
  </div>

  <div class="page">
    <header class="nav">
      <a class="brand" href="index.html" aria-label="RIDLY">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">RIDLY <span>BY RSL</span></span>
      </a>
      <a class="nav-rsl" href="https://rsl-swiss.ch" target="_blank" rel="noopener">RSL ↗</a>
    </header>

    <main class="hero">
      <section>
        <div class="eyebrow">RIDLY — BY RSL</div>
        <h1>RIDE.<br><span>FIND.</span><br>CONNECT.</h1>
        <p class="lead"><strong>RIDLY</strong> rassemble les riders, les spots et les clips. Trouve ce qui se passe autour de toi et connecte-toi à la scène.</p>
        <div class="actions">
          <a class="btn btn-primary" href="compte.html">Entrer dans RIDLY</a>
          <a class="btn btn-secondary" href="ou_rider.html">Voir les riders</a>
        </div>
      </section>

      <aside class="visual" aria-label="Logo RIDLY">
        <div class="logo-card">
          <img src="image/ridly-rsl-logo.png" alt="RIDLY by RSL">
          <div class="chips" aria-hidden="true">
            <div class="chip"><i>●</i> <b>Spots</b> autour de toi</div>
            <div class="chip"><i>●</i> Riders · Clips · Events</div>
          </div>
        </div>
      </aside>
    </main>

    <footer>© <span id="year"></span> RIDLY · Romandie Scooter League</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    // sécurité : le loader disparaît toujours, même si un navigateur bloque l'animation CSS
    window.setTimeout(function(){
      var loader=document.getElementById('ridly-loader');
      if(loader) loader.remove();
    }, 1600);
  </script>
</body>
</html>
